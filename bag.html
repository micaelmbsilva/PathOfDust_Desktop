<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Path of Dust — Bag</title>
<script src="/config.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: "Segoe UI", Arial, sans-serif;
    background: #0c0a16; color: #eae6f5; }
  h1 { font-size: 1.2rem; margin: 0 0 4px; }
  h2 { font-size: 1rem; color: #c9bdf0; margin: 18px 0 8px; }
  .bar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  #hdr { position: sticky; top: 0; z-index: 10; background: #0c0a16;
    margin: 0 -16px 4px; padding: 8px 16px 10px; border-bottom: 1px solid rgba(160,140,255,0.15); }
  #hdr h1 { margin-bottom: 8px; }
  .chip { background: #1c1830; border: 1px solid rgba(160,140,255,0.25); border-radius: 8px; padding: 4px 10px; font-size: 0.85rem; color: #eae6f5; }
  .chip.repair { cursor: pointer; }
  .chip.autodis { gap: 6px; display: inline-flex; align-items: center; }
  .chip.autodis select { padding: 1px 4px; font-size: 0.8rem; }
  .chip.autodis input[type="number"] { width: 52px; background: #1c1830; color: #eae6f5;
    border: 1px solid rgba(160,140,255,0.3); border-radius: 6px; padding: 1px 4px; font-size: 0.8rem; }
  .chip.repair.on { border-color: #4a8a5a; background: rgba(120,255,160,0.12); }
  .chip.repair.off { border-color: #a04a4a; background: rgba(200,70,70,0.12); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
  .item { background: rgba(24,20,40,0.9); border: 1px solid rgba(160,140,255,0.25); border-radius: 10px; padding: 10px;
    display: flex; flex-direction: column; }
  /* Cards in a grid row stretch to the tallest; push the buttons to the card
     floor so they line up across a row regardless of mod-count. */
  .item .acts { margin-top: auto; }
  .item .n { font-weight: 700; }
  .item .s { font-size: 0.72rem; color: #b0a2d9; }
  .perfect { color: #ffd76b; font-weight: 700; } /* Perfect Quality gold — site's .gear-quality--perfect */
  .sacredq { color: #d6f0ff; font-weight: 700; } /* Sacred → icy blue-white, like the site */
  .item .n.sacred { color: #d6f0ff; text-shadow: 0 0 8px rgba(120,200,255,0.6); }
  .item .n.unique { color: #ffd76b; text-shadow: 0 0 6px rgba(255,215,107,0.4); }
  .item .n.krangled { color: #b23a3a; } /* Krangled (locked) — matches the site */
  /* Sacred/unique implicit callout — boxed line above the mods, site's treatment */
  .imp { font-size: 0.78rem; color: #d6f0ff; font-weight: 600; line-height: 1.35;
    background: rgba(120,200,255,0.12); border: 1px solid rgba(120,200,255,0.4);
    border-radius: 6px; padding: 4px 7px; margin-top: 6px; width: fit-content; }
  .imp.gold { color: #ffd76b; background: rgba(255,215,107,0.1); border-color: rgba(255,215,107,0.35); }
  .item .m { font-size: 0.8rem; color: #c9bdf0; margin: 6px 0; }
  .veilbox { background: rgba(60,44,20,0.6); border: 1px solid #d9a441; border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .veilbox h2 { color: #ffcf5a; margin: 0 0 4px; }
  .veilbox .acts { margin-top: 10px; }
  .veilbox button { font-size: 0.95rem; padding: 8px 14px; }
  .bag-head { display: flex; align-items: center; gap: 12px; margin-top: 34px; margin-bottom: 16px;
    padding-top: 16px; border-top: 1px solid rgba(160,140,255,0.18); }
  .bag-head h2 { margin: 0; }
  .bag-head label { font-size: 0.85rem; color: #b0a2d9; }
  .bag-head #disAll { margin-left: auto; }
  .grouphdr { font-size: 0.9rem; color: #b0a2d9; margin: 14px 0 6px; }
  select { background: #1c1830; color: #eae6f5; border: 1px solid rgba(160,140,255,0.3); border-radius: 6px; padding: 3px 6px; }
  .mline { display: flex; align-items: center; gap: 6px; }
  /* Reforge/Recombine crit-granted bonus modifier — green, same as the site */
  .mt.crit { color: #6ee08a; font-weight: 600; }
  .roll { font-size: 0.68rem; font-weight: 700; padding: 0 5px; border-radius: 4px;
    border: 1px solid currentColor; white-space: nowrap; }
  .roll.gold { color: #ffcf5a; }
  .roll.t1 { color: #ffcf5a; } .roll.t2 { color: #ffb347; } .roll.t3 { color: #c792ea; }
  .roll.t4 { color: #82aaff; } .roll.t5 { color: #7fdba3; } .roll.t6 { color: #5fb3b3; }
  .roll.t7 { color: #9aa0b5; } .roll.t8 { color: #6b6f80; }
  .hint { cursor: help; }
  .dur { color: #ffd479; } .dur.broke { color: #ff8080; font-weight: 700; }
  .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  button { border-radius: 7px; padding: 5px 10px; font-size: 0.8rem; cursor: pointer;
    border: 1px solid rgba(160,140,255,0.35); background: rgba(120,90,255,0.18); color: #eae6f5; }
  button:hover { background: rgba(120,90,255,0.34); }
  button.danger { border-color: #a04a4a; background: rgba(200,70,70,0.18); }
  button:disabled { opacity: 0.5; cursor: default; }
  .locked { color: #ffd479; font-size: 0.72rem; }
  .craft { background: rgba(24,20,40,0.9); border: 1px solid rgba(160,140,255,0.25); border-radius: 10px; padding: 12px; }
  .craft select { width: 100%; margin: 4px 0 8px; padding: 6px; background: #1c1830; color: #eae6f5; border: 1px solid rgba(160,140,255,0.3); border-radius: 6px; }
  .craft label { font-size: 0.85rem; display: block; margin-bottom: 8px; }
  /* Item picker. A native <select> popup is drawn by the browser/OS, so no DOM
     events reach its <option>s and hovering one can't preview anything — this
     list replaces the popup while the real <select> stays as the state holder. */
  .isel { position: relative; margin: 4px 0 8px; }
  .isel-btn { width: 100%; text-align: left; padding: 6px; font-size: 0.85rem;
    background: #1c1830; border: 1px solid rgba(160,140,255,0.3); border-radius: 6px; }
  /* narrower than the form so the hover preview has room beside it */
  /* Outer container = one popup holding two cards: the option list (left) and
     the sort/filter pip panel (right). */
  .isel-list { display: none; position: absolute; z-index: 40; left: 0; top: 100%; margin-top: 2px;
    width: min(100%, 520px); gap: 6px; background: #17132a; border: 1px solid rgba(160,140,255,0.35);
    border-radius: 8px; padding: 6px; box-shadow: 0 6px 18px rgba(0,0,0,0.55); }
  .isel.open .isel-list { display: flex; }
  .isel-opts { flex: 1 1 auto; min-width: 0; max-height: 280px; overflow-y: auto;
    border: 1px solid rgba(160,140,255,0.18); border-radius: 6px; padding: 3px; }
  .isel-opt { padding: 4px 7px; border-radius: 5px; font-size: 0.82rem; cursor: pointer;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .isel-opt:hover { background: rgba(120,90,255,0.28); }
  /* sort/filter pip card — itemA/itemB pickers only, its own card on the right */
  .isel-tools { flex: 0 0 auto; align-self: flex-start; display: flex; flex-direction: column; gap: 6px;
    background: #1c1830; border: 1px solid rgba(160,140,255,0.25); border-radius: 6px; padding: 6px; }
  .pipgrp { display: flex; flex-wrap: wrap; gap: 3px; }
  .pip { font-size: 0.68rem; padding: 2px 6px; border-radius: 999px; line-height: 1.2; white-space: nowrap;
    border: 1px solid rgba(160,140,255,0.3); background: #1c1830; color: #b0a2d9; cursor: pointer; }
  .pip:hover { background: rgba(120,90,255,0.28); color: #eae6f5; }
  .pip.on { background: rgba(120,90,255,0.4); border-color: rgba(160,140,255,0.7); color: #fff; }
  .isel-g { font-size: 0.7rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: #8a7fb0; padding: 5px 7px 2px; }
  .ipreview { position: fixed; z-index: 3100; width: 250px; pointer-events: none;
    filter: drop-shadow(0 6px 16px rgba(0,0,0,0.65)); }
  .ipreview .acts { display: none; }
  /* selected item(s) card above the craft form */
  .craftpick { background: rgba(24,20,40,0.9); border: 1px solid rgba(160,140,255,0.25);
    border-radius: 10px; padding: 10px; margin-bottom: 10px; }
  .craftpick-h { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase;
    color: #b0a2d9; margin-bottom: 8px; }
  .recombnote { font-size: 0.85rem; color: #cdbdf5; margin: -2px 0 8px; }
  /* drag-to-arrange craft sections */
  .csec { border: 1px solid rgba(160,140,255,0.18); border-radius: 9px; padding: 6px 8px 8px; margin-top: 8px; }
  .csec-h { display: flex; align-items: center; gap: 6px; }
  .csec-name { flex: 1; background: none; border: 1px solid transparent; border-radius: 6px;
    color: #b0a2d9; font: inherit; font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; padding: 2px 5px; }
  .csec-name:hover, .csec-name:focus { border-color: rgba(160,140,255,0.3); background: #1c1830; color: #eae6f5; outline: none; }
  .csec-del { background: none; border: 0; color: #8a7fb0; cursor: pointer; padding: 0 4px; font-size: 0.85rem; }
  .csec-del:hover { color: #ff8080; background: none; }
  .csec-body { min-height: 34px; border-radius: 7px; padding: 2px; }
  .csec-body.over { background: rgba(120,90,255,0.14); outline: 1px dashed rgba(160,140,255,0.5); }
  .csec-body [data-craft] { cursor: grab; }
  .muted { color: #8a7fb0; }
  #err { color: #ff8080; }
  #toasts { position: fixed; right: 14px; bottom: 14px; z-index: 3000; display: flex; flex-direction: column; gap: 8px; max-width: 360px; }
  .bagtoast { background: rgba(24,20,40,0.97); border: 1px solid #6f5ad9; border-radius: 10px;
    padding: 10px 12px; font-size: 0.85rem; box-shadow: 0 4px 14px rgba(0,0,0,0.5); }
  .bagtoast.cost { border-color: #d9a441; }
  .bagtoast b { color: #ffcf5a; }
  .bagtoast button { float: right; padding: 0 6px; margin: -2px -4px 0 8px; }
</style>
</head>
<body>
  <div id="hdr">
    <h1>🎒 Bag &amp; Crafting <button class="chip" style="cursor:pointer" onclick="load()" title="Refresh">🔄</button></h1>
    <div class="bar" id="cur"></div>
  </div>
  <div id="err"></div>

  <div id="nameItem"></div>
  <div id="veilChoice"></div>

  <h2>Crafting</h2>
  <div id="craftPick"></div>
  <div class="craft" id="craft"></div>

  <h2>Equipped</h2>
  <div class="grid" id="equipped"></div>

  <div class="bag-head">
    <h2 id="bagh" style="margin:0">Bag</h2>
    <label>Sort <select id="sortBy">
      <option value="tier">Tier</option>
      <option value="quality">Quality</option>
      <option value="roll">Best Roll</option>
      <option value="mods">Mod Count</option>
      <option value="durability">Durability (worn first)</option>
      <option value="name">Name</option>
      <option value="slot">Slot</option>
    </select></label>
    <label>Group <select id="groupBy">
      <option value="">None</option>
      <option value="slot">Slot</option>
      <option value="tier">Tier</option>
      <option value="quality">Quality</option>
      <option value="rarity">Rarity</option>
    </select></label>
    <button id="disAll" class="danger" title="Disenchant every bag item. 🔒 Keep-marked items are skipped. Can't be undone.">Disenchant All</button>
  </div>
  <div id="bag"></div>
  <div id="toasts"></div>

<script>
  const $ = (id) => document.getElementById(id);
  async function api(endpoint, fields) {
    // currency-capable actions (craft/veil/polish/reforge/disenchant) are stamped
    // so the main window's battle toast can flag deltas mixed with crafting
    // repair- (not toggle-auto-repair, which costs nothing) also moves dust
    if (/craft|disenchant|repair-/.test(endpoint)) localStorage.setItem('lastCraftAt', Date.now());
    let r;
    try {
      r = await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ endpoint, fields }) }).then(r => r.json());
    } catch { r = { ok: false, status: 'network' }; } // bridge down / non-JSON 500 — surface, don't die silently
    if (r.expired) { r.ok = false; $('err').textContent = 'Session expired — restart the app to log in again.'; }
    else if (!r.ok) $('err').textContent = `${endpoint} -> ${r.status}`;
    return r;
  }
  // Full HTML escaper — was quote-only, which left item names, mods and the
  // krangle nickname unescaped in text context (self-XSS: a nickname with a
  // <img onerror> ran in the renderer, which shares the bridge origin).
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  const tip = (s) => s ? ` data-tip="${esc(s)}"` : '';
  const SLOT_EMOJI = { weapon: '⚔️', helm: '🪖', body: '🛡️', gloves: '🧤', boots: '🥾' };
  const title = (s) => (s || '').charAt(0).toUpperCase() + (s || '').slice(1).toLowerCase();
  const slotOf = (s) => `${SLOT_EMOJI[(s || '').toLowerCase()] || ''} ${title(s)}`.trim();
  const qual = (it) => {
    const q = esc(it.quality || '');
    const inner = it.sacred || it.quality === 'Sacred' ? `<span class="sacredq">${q}</span>`
      : (it.quality || '').includes('Perfect') ? `<span class="perfect">${q}</span>` : q;
    return it.qtip ? `<span class="hint"${tip(it.qtip)}>${inner}</span>` : inner;
  };
  // Roll % → tier (T1 best). Percentile-from-top: T1 95-100, T2 90-94, T3 75-89,
  // T4 50-74, T5 35-49, T6 25-34, T7 15-24, T8 0-14. Gold when roll > 90.
  const rollOf = (t) => { const m = (t || '').match(/(\d+(?:\.\d+)?)\s*%/); return m ? +m[1] : null; };
  const tierOf = (r) => r >= 95 ? 1 : r >= 90 ? 2 : r >= 75 ? 3 : r >= 50 ? 4 : r >= 35 ? 5 : r >= 25 ? 6 : r >= 15 ? 7 : 8;
  const modLine = (m) => {
    const r = rollOf(m.tip);
    const mt = `<span class="mt${m.crit ? ' crit' : ''}">${esc(m.t)}</span>`;
    if (r == null) return `<div class="mline">${mt}</div>`;
    const t = tierOf(r);
    return `<div class="mline">${mt}` +
      `<span class="roll t${t}${r > 90 ? ' gold' : ''}">T${t} · ${r}%</span></div>`;
  };
  // Worn-down gear only. Indestructible items and anything still at 100% say nothing.
  const dura = (it) => {
    const d = it.durability;
    if (!d || d.indestructible || d.pct == null || d.pct >= 100) return '';
    return ` · <span class="dur${d.pct === 0 ? ' broke' : ''}"${tip(d.pct === 0 ? 'Broken — this item gives no bonus until repaired' : 'Durability')}>🔧 ${d.pct}%</span>`;
  };
  // The site renders no repair form at all when there's nothing to fix, so the
  // button simply isn't there — same rule as the site's own pages.
  const repairBtn = (it) => it.repair
    ? `<button data-rep="${esc(it.repair.endpoint)}" data-repf="${esc(it.repair.field)}" data-repv="${esc(it.repair.value)}"${it.repair.disabled ? ' disabled' : ''}` +
      ` title="${it.repair.disabled ? 'Not enough dust' : 'Repair this item with dust'}">🔧 Repair (${esc(it.repair.cost)}d)</button>`
    : '';
  const itemCard = (it, acts) => `
    <div class="item">
      <div class="n${it.krangled ? ' krangled' : it.sacred ? ' sacred' : it.unique ? ' unique' : ''}">${esc(it.name)} ${it.protected ? '<span class="locked">🔒</span>' : ''}</div>
      <div class="s">${slotOf(it.slot)} · ${esc(it.tier)} · ${qual(it)} · ${esc(it.primary || '')}${dura(it)}</div>
      ${(it.implicits || []).map(i => `<div class="imp${i.gold ? ' gold' : ''}">${esc(i.t)}</div>`).join('')}
      <div class="m">${(it.mods || []).map(modLine).join('')}</div>
      <div class="acts">${acts}</div>
    </div>`;

  // ---- action result toasts ----
  function toast(html, cls) {
    const el = document.createElement('div');
    el.className = 'bagtoast' + (cls ? ' ' + cls : '');
    el.innerHTML = html + ' <button title="Dismiss">✕</button>';
    el.querySelector('button').onclick = () => el.remove();
    $('toasts').appendChild(el);
    setTimeout(() => el.remove(), 9000);
  }
  const numCur = (v) => {
    if (v == null) return 0;
    const m = String(v).replace(/,/g, '').trim().match(/^([\d.]+)\s*([KM]?)/i);
    return m ? +m[1] * (/m/i.test(m[2]) ? 1e6 : /k/i.test(m[2]) ? 1e3 : 1) : 0;
  };
  const keyItems = (inv) => {
    const map = {};
    for (const it of [...(inv.equipped || []), ...(inv.bag || [])])
      map[it.id != null ? 'id:' + it.id : 'slot:' + it.slot] = it; // bag items have ids; equipped keyed by slot
    return map;
  };
  // Human summary of what an action changed. The game auto-battles, so dust/sand
  // drift constantly from loot & auto-repair — diffing them is only meaningful for
  // disenchant (opts.currency), where the gain dwarfs that noise; for crafts it's
  // pure noise. Tokens and gear mods/tier only move via crafts, so those are
  // reliable. New items (recombine result, unseen id) are skipped.
  function craftSummary(before, after, opts) {
    const parts = [];
    // Recombine is the only craft that CONSUMES its sources and emits a
    // brand-new-id item — the generic id/slot diff below skips new ids (loot
    // noise), so it always came back empty and toasted a false "no change".
    // Report the freshly-appeared bag item(s) directly instead.
    if (opts && opts.recombine) {
      opts.newItems = [];
      const bIds = new Set((before.bag || []).map(it => it.id));
      for (const it of (after.bag || [])) {
        if (bIds.has(it.id)) continue;
        opts.newItems.push(it);
        const crit = (it.mods || []).find(m => m.crit);
        parts.push(`Recombined → <b>${esc(it.name)}</b>${it.tier ? ` (T${esc(it.tier)})` : ''}` +
          (crit ? ` <span class="mt crit">+${esc(crit.t)} ✦ crit!</span>` : ''));
      }
      return parts; // empty ⇒ bag was full, result lost — the "no change" toast is then correct
    }
    if (opts && opts.currency) {
      const dust = Math.round(numCur(after.dust) - numCur(before.dust));
      const sand = Math.round(numCur(after.sand) - numCur(before.sand));
      if (dust) parts.push(`<b>${dust > 0 ? '+' : ''}${dust.toLocaleString()}</b> dust`);
      if (sand) parts.push(`<b>${sand > 0 ? '+' : ''}${sand.toLocaleString()}</b> sand`);
    }
    // Pill text is "🎫 Scour ×3", or "🎫 Celestial Shard → Celestial Conversion ×2"
    // for the shard tokens — the name is the part before the arrow.
    const toks = (inv) => { const m = {}; for (const t of (inv.tokens || [])) {
      const name = String(t).split('→')[0].replace(/[^A-Za-z ]/g, '').trim();
      const n = String(t).match(/[×x]\s*(\d+)/);
      if (name && n) m[name] = +n[1];
    } return m; };
    const tb = toks(before), ta = toks(after);
    for (const name of new Set([...Object.keys(tb), ...Object.keys(ta)])) {
      const d = (ta[name] || 0) - (tb[name] || 0);
      if (d) parts.push(`<b>${d > 0 ? '+' : ''}${d}</b> ${name}`);
    }
    const b = keyItems(before), a = keyItems(after);
    for (const k of Object.keys(a)) {
      const bi = b[k]; if (!bi) continue;
      const ai = a[k], had = new Set((bi.mods || []).map(m => m.t));
      for (const m of (ai.mods || [])) {
        if (had.has(m.t)) continue;
        const r = rollOf(m.tip);
        parts.push(`${esc(ai.name)}: ${m.crit ? `<span class="mt crit">${esc(m.t)} ✦ crit!</span>` : esc(m.t)}${r != null ? ` <b>(T${tierOf(r)}·${r}%)</b>` : ''}`);
      }
      if (ai.tier && bi.tier && ai.tier !== bi.tier) parts.push(`${esc(ai.name)}: ${esc(bi.tier)} → <b>${esc(ai.tier)}</b>`);
    }
    return parts;
  }
  // Run an action, then diff inventory before/after and toast what changed. Some
  // actions (reforge) reflect a beat after the POST returns, so if the first diff
  // is empty we retry once; a successful action always toasts something.
  async function craftAct(endpoint, fields, label, opts) {
    let before = null;
    try { before = await fetch('/api/inventory', { cache: 'no-store' }).then(r => r.json()); } catch {}
    const r = await api(endpoint, fields);
    if (!r.ok) { toast(`${label || endpoint} failed (${r.status})`, 'cost'); return r; }
    if (before) {
      let parts = [];
      for (let i = 0; i < 5; i++) { // read-after-write lag — up to ~3.2s before calling it rejected
        if (i) await new Promise(z => setTimeout(z, 800));
        let after; try { after = await fetch('/api/inventory', { cache: 'no-store' }).then(x => x.json()); } catch { continue; }
        // A veiled/token craft doesn't change the inventory — it parks a pending
        // 3-outcome choice. Don't sit in the retry loop: render it right away.
        if (after.veil && !before.veil) { toast('🔮 Veiled — pick your outcome below'); load(); return r; }
        parts = craftSummary(before, after, opts);
        if (parts.length) break;
      }
      // Empty diff is NOT success: the site 303s on business failures too (e.g.
      // not enough dust), so nothing changing usually means it was rejected.
      toast(parts.length ? `${label ? label + ': ' : ''}${parts.join(' · ')}`
        : `${label || 'Action'}: no change — likely rejected (not enough dust/tokens?)`, parts.length ? '' : 'cost');
    }
    return r;
  }

  async function load() {
    $('err').textContent = '';
    let inv, meData;
    try { [inv, meData] = await Promise.all([
      fetch('/api/inventory').then(r => r.json()),
      fetch('/api/me').then(r => r.json()).catch(() => ({})),
    ]); }
    catch { $('err').textContent = 'Can\'t reach the game right now'; return; }
    if (inv.expired || meData.expired) { $('err').textContent = 'Session expired — restart the app to log in again.'; return; }

    meName = meData.name || '';
    if (meData.name) document.title = `${GAME_NAME} — Bag — ${meData.name}`;
    const full = (v) => /^\d+$/.test(v) ? Number(v).toLocaleString('en-US') : v; // exact ints get commas
    const ad = inv.autoDisenchant;
    $('cur').innerHTML = `<span class="chip">💰 ${full(inv.dust)} dust</span><span class="chip">🪵 ${full(inv.sand)} sand</span>` +
      inv.tokens.map(t => `<span class="chip">${esc(t)}</span>`).join('') +
      `<button class="chip repair ${meData.autoRepair ? 'on' : 'off'}" id="autoRep"${tip(meData.autoRepairTip)}>🔧 Auto-Repair: ${meData.autoRepair ? 'On' : 'Off'}</button>` +
      // Site omits the whole form when nothing is damaged, so no chip either.
      (meData.repairAll ? `<button class="chip repair" data-repall="1"${meData.repairAll.disabled ? ' disabled' : ''}
        title="Repair every damaged equipped item">🔧 Repair All (${meData.repairAll.cost}d)</button>` : '') +
      (ad ? `<span class="chip autodis" title="Auto-disenchant new items below the chosen threshold (site-side setting)">
        <label style="display:inline-flex;align-items:center;gap:4px;cursor:pointer">
          <input type="checkbox" id="adOn" ${ad.enabled ? 'checked' : ''}> 🗑️ Auto Disenchant Below</label>
        <select id="adTier">${ad.options.map(o => `<option value="${o.value}"${o.value === ad.tier ? ' selected' : ''}>${o.label}</option>`).join('')}</select>
        <input type="number" id="adPct" min="1" max="100" value="${ad.minPercent}" title="Quality % floor — used when 'Quality %' is selected"
          style="display:${ad.tier === 'quality' ? '' : 'none'}"></span>` : '');
    $('autoRep').onclick = async () => { await api('toggle-auto-repair', {}); refresh(); };
    if (ad) {
      // mirror the site's form: every change posts the full state
      const saveAd = async () => {
        const fields = { tier: $('adTier').value, min_percent: $('adPct').value };
        if ($('adOn').checked) fields.enabled = 'on'; // unchecked = field omitted, like a real form
        await api('set-auto-disenchant', fields);
        refresh();
      };
      $('adOn').onchange = saveAd;
      $('adTier').onchange = () => { $('adPct').style.display = $('adTier').value === 'quality' ? '' : 'none'; saveAd(); };
      $('adPct').onchange = saveAd;
    }

    lastEquipped = inv.equipped;
    $('equipped').innerHTML = inv.equipped.map(it =>
      itemCard(it, `${eqBtn(it)} ${repairBtn(it)} ${shareBtn(it)}`)).join('') || '<p class="muted">Nothing equipped.</p>';

    // pending choice card: veiled/token craft picker OR the veiled-Chancing
    // wizard (multi-step). Choices replay the site's own forms verbatim.
    // NOTE: an option's % is the stat value, not a roll — no tier badge.
    if (inv.veil) {
      const v = inv.veil;
      pendChoices = v.choices || (v.options || []).map(o => // old-bridge shape (pre rev-72)
        ({ action: 'craft/choose-veil', fields: [['index', String(o.index)]], label: o.text }));
      $('veilChoice').innerHTML = `<div class="veilbox"><h2>${esc(v.title)}</h2>` +
        `<p class="muted">${esc(v.note || 'Pick one — the other options are discarded.')}</p><div class="acts">` +
        pendChoices.map((c, i) => `<button data-veilpick="${i}">${esc(c.label)}</button>`).join('') +
        `</div></div>`;
    } else { $('veilChoice').innerHTML = ''; pendChoices = null; }

    // Krangling earns the right to name the item, and the site asks once per
    // item. Submitting an empty name is how you decline — that records the
    // choice so it stops asking, which is why Skip posts rather than just
    // hiding the card.
    const ni = inv.nameItem;
    $('nameItem').innerHTML = !ni ? '' :
      `<div class="veilbox"><h2>🏷️ Name Your Krangled Item</h2>
        <p class="muted">You Krangled ${ni.name ? `a <b>${esc(ni.name)}</b>` : 'an item'} — give it a custom name if you like.
          It shows as ${ni.name ? esc(ni.name) : 'the item'} “Your Name” everywhere. Skip and you won't be asked again for this item.</p>
        <div class="acts">
          <input type="text" id="niName" maxlength="${ni.maxLen}" placeholder="e.g. Excalibur"
                 style="flex:1;min-width:180px;background:#1c1830;color:#eae6f5;border:1px solid rgba(160,140,255,0.3);border-radius:6px;padding:6px 8px;font:inherit">
          <button id="niSave">Save Name</button>
          <button id="niSkip" title="Won't be asked again for this item">Skip</button>
        </div></div>`;
    if (ni) {
      const send = async (nickname) => {
        await api('name-item', { item_id: ni.id, nickname });
        toast(nickname ? `🏷️ Named <b>${esc(nickname)}</b>` : 'Skipped naming');
        refresh();
      };
      const inp = $('niName');
      $('niSave').onclick = () => send(inp.value.trim());
      $('niSkip').onclick = () => send('');
      inp.onkeydown = (e) => { if (e.key === 'Enter') $('niSave').click(); };
      inp.focus();
    }

    lastCap = inv.bagCap;
    lastBag = inv.bag;
    renderBag();

    // crafting form — keep the selection across reloads AND app restarts (localStorage fallback)
    // Your in-page choice wins over the stored one, and the site's own
    // preselection (whatever you crafted last) is the final fallback — that's
    // what the game does when it re-renders after a craft.
    const siteSel = (inv.craft.options.find(o => o.selected) || {}).id;
    const prevA = $('itemA')?.value || localStorage.getItem('craftItemA') || siteSel;
    const prevB = $('itemB')?.value || localStorage.getItem('craftItemB');
    // Mirror the site's grouping: an "Equipped" group first, then one per slot.
    const opts = (list, lead) => {
      let out = lead || '', group = null;
      for (const o of list) {
        if (o.group !== group) { if (group !== null) out += '</optgroup>'; group = o.group; if (group) out += `<optgroup label="${esc(group)}">`; }
        out += `<option value="${o.id}">${esc(o.label)}</option>`;
      }
      return out + (group ? '</optgroup>' : '');
    };
    $('craft').innerHTML = `
      <label>Item A <select id="itemA">${opts(inv.craft.options)}</select></label>
      <label>Item B (Recombine) <select id="itemB">${opts(inv.craft.options, '<option value="">None</option>')}</select></label>
      <label class="hint"${tip(inv.craft.veilTip)}><input type="checkbox" id="veil"${cbGet('veil') ? ' checked' : ''}> Veil This Craft (+500 dust; Recombine also +500 per combined modifier)</label>
      ${inv.craft.hideoutKrangle ? `<label class="hint" title="Hideout Warrior only: leave checked to end on Krangle (permanently locks the item); uncheck to stop after Exalt"><input type="checkbox" id="hideoutK"${cbGet('hideoutK', inv.craft.hideoutKrangle.checked) ? ' checked' : ''}> Include Krangle (Hideout Warrior)</label>` : ''}
      <div class="acts" style="align-items:center;margin:10px 0 4px">
        <span class="muted">Polish / Reforge batch:</span>
        <label class="hint" title="Run Polishing/Reforge 5 times in one go"><input type="checkbox" class="batchx" value="5"${cbGet('batch') === 5 ? ' checked' : ''}> ×5</label>
        <label class="hint" title="Run Polishing/Reforge 10 times in one go"><input type="checkbox" class="batchx" value="10"${cbGet('batch') === 10 ? ' checked' : ''}> ×10</label>
        <label class="hint" title="Run Polishing/Reforge 50 times in one go — the site's cap. It stops early if you run out of sand/dust and reports how many landed"><input type="checkbox" class="batchx" value="50"${cbGet('batch') === 50 ? ' checked' : ''}> ×50</label>
      </div>
      <div id="craftSections"></div>`;
    renderSections(inv.craft.actions);
    // x5/x10 are mutually exclusive, like the site's batch-check boxes
    document.querySelectorAll('.batchx').forEach(b => b.onchange = () => {
      if (b.checked) document.querySelectorAll('.batchx').forEach(o => { if (o !== b) o.checked = false; });
      cbSet('batch', b.checked ? +b.value : 0);
      updateCosts();
    });
    const keep = (sel, v) => { if (v && [...sel.options].some(o => o.value === v)) sel.value = v; };
    keep($('itemA'), prevA); keep($('itemB'), prevB);

    lastCraft = inv.craft;
    updateCosts();
    $('itemA').onchange = () => {
      localStorage.setItem('craftItemA', $('itemA').value);
      const b = $('itemB');
      // Recombine can't pair an item with itself — clear B if it now equals A.
      if (b.value && b.value === $('itemA').value) { b.value = ''; localStorage.removeItem('craftItemB'); }
      b._rerender?.();
      updateCosts();
    };
    $('itemB').onchange = () => { localStorage.setItem('craftItemB', $('itemB').value); updateCosts(); };
    $('veil').onchange = () => { cbSet('veil', $('veil').checked); updateCosts(); };
    const hk = $('hideoutK');
    if (hk) hk.onchange = () => cbSet('hideoutK', hk.checked);

    dropdown($('itemA')); dropdown($('itemB'), () => $('itemA').value);

    // While a choice is pending the site rejects every craft — lock the form so
    // "nothing happened" clicks can't pile up, and point at the pending card.
    if (inv.veil) {
      $('craft').querySelectorAll('button,select,input').forEach(el => el.disabled = true);
      $('craft').insertAdjacentHTML('afterbegin',
        '<p class="muted">⏳ Crafting is locked until you finish the pending choice above.</p>');
    }
  }

  // ---- item picker with hover preview ----
  // An option id is the item id, which bag items carry directly. Equipped items
  // never print their item_id in the gear slot, so those match on the option
  // label's leading name ("Crude Blade (Weapon, T1, 1 mod)").
  const itemForOption = (id) => {
    if (!id) return null;
    const inBag = lastBag.find(i => i.id === id);
    if (inBag) return inBag;
    const o = (lastCraft.options || []).find(x => x.id === id);
    if (!o) return null;
    const name = o.label.replace(/\s*\(.*$/, '').replace(/[🔒✦]/g, '').trim();
    return lastEquipped.find(i => i.name === name)
        || lastEquipped.find(i => name.startsWith(i.name)) || null;
  };

  let previewEl = null;
  const hidePreview = () => { if (previewEl) previewEl.remove(); previewEl = null; };
  function showPreview(it, anchor) {
    hidePreview();
    if (!it) return;
    previewEl = document.createElement('div');
    previewEl.className = 'ipreview';
    previewEl.innerHTML = itemCard(it, '');
    document.body.appendChild(previewEl);
    // Beside the hovered row: right by default, left when that overflows, and
    // below it when neither side fits (narrow window) so it never covers the row.
    const r = anchor.getBoundingClientRect(), w = previewEl.offsetWidth, h = previewEl.offsetHeight;
    const fitsR = r.right + 8 + w <= innerWidth, fitsL = r.left - 8 - w >= 0;
    previewEl.style.left = (fitsR ? r.right + 8 : fitsL ? r.left - w - 8
      : Math.max(4, Math.min(r.left, innerWidth - w - 4))) + 'px';
    previewEl.style.top = (fitsR || fitsL
      ? Math.max(4, Math.min(r.top - 4, innerHeight - h - 4))
      : Math.min(r.bottom + 6, innerHeight - h - 4)) + 'px';
  }

  // Replace a <select>'s popup with an in-page list that fires hover events.
  // The <select> itself stays (hidden) — persistence, updateCosts and the craft
  // POST all read .value off it, and a dispatched change keeps them in sync.
  // Slot parsed from an option label like "Crude Blade (Weapon, T3, 2 mods)".
  const SLOTS = ['weapon', 'helm', 'body', 'gloves', 'boots'];
  const slotFromLabel = (l) => ((l || '').match(/\(([^,)]+)/) || [])[1]?.trim().toLowerCase() || '';

  // exclude: optional () => a value to hide from this list (itemB hides itemA).
  function dropdown(sel, exclude) {
    const wrap = document.createElement('div');
    wrap.className = 'isel';
    wrap.innerHTML = '<button type="button" class="isel-btn"></button>' +
      '<div class="isel-list"><div class="isel-opts"></div><div class="isel-tools"></div></div>';
    sel.after(wrap);
    sel.style.display = 'none';
    const btn = wrap.querySelector('.isel-btn'), list = wrap.querySelector('.isel-list');
    const tools = wrap.querySelector('.isel-tools'), opts = wrap.querySelector('.isel-opts');
    const sync = () => { btn.textContent = (sel.selectedOptions[0] || {}).textContent || 'None'; };
    const state = { sort: '', dir: 1, slots: new Set(), quals: new Set() }; // sort '' = grouped order; empty sets = all

    const SORTS = [['tier', 'Tier'], ['quality', 'Qual'], ['mods', 'Mods'], ['name', 'A–Z']];
    const QUALS = [['sacred', '✦', 'Sacred'], ['perfect', '🌟', 'Perfect'], ['plain', '◦', 'Plain (not sacred/perfect)']];
    function renderTools() {
      const pip = (on, attr, txt, title) => `<button type="button" class="pip${on ? ' on' : ''}" ${attr} title="${esc(title || '')}">${txt}</button>`;
      tools.innerHTML =
        '<span class="pipgrp">' + SORTS.map(([k, lbl]) =>
          pip(state.sort === k, `data-sort="${k}"`, lbl + (state.sort === k ? (state.dir > 0 ? ' ▼' : ' ▲') : ''))).join('') + '</span>' +
        '<span class="pipgrp">' + QUALS.map(([k, em, t]) =>
          pip(state.quals.has(k), `data-qual="${k}"`, em, t)).join('') + '</span>' +
        '<span class="pipgrp">' + SLOTS.map(s =>
          pip(state.slots.has(s), `data-slot="${s}"`, SLOT_EMOJI[s] || s, title(s))).join('') + '</span>';
    }
    // sacred (from the resolved item) / perfect (item or craft-option meta) / plain
    const rarityOf = (o, m) => { const it = itemForOption(o.value);
      if (it && (it.sacred || it.quality === 'Sacred')) return 'sacred';
      if ((it && (it.quality || '').includes('Perfect')) || m[o.value]?.perfect) return 'perfect';
      return 'plain'; };
    function renderOpts() {
      const m = Object.fromEntries((lastCraft.options || []).map(o => [o.id, o]));
      const ex = exclude ? exclude() : null;
      const rows = [...sel.options].filter(o => {
        if (!o.value) return true;                              // keep "None" always
        if (ex && o.value === ex) return false;
        if (state.slots.size) {
          const sl = slotFromLabel((m[o.value] || {}).label || o.textContent);
          if (!state.slots.has(sl)) return false;
        }
        if (state.quals.size && !state.quals.has(rarityOf(o, m))) return false;
        return true;
      });
      if (state.sort) {
        const val = (o) => { const md = m[o.value] || {};
          return state.sort === 'tier' ? (md.tier || 0) : state.sort === 'quality' ? (md.quality || 0)
            : state.sort === 'mods' ? (md.affixes || 0) : 0; };
        rows.sort((a, b) => {
          if (!a.value) return -1; if (!b.value) return 1;      // "None" stays first
          return state.dir * (state.sort === 'name' ? a.textContent.localeCompare(b.textContent) : val(b) - val(a));
        });
        opts.innerHTML = rows.map(o => `<div class="isel-opt" data-v="${esc(o.value)}">${esc(o.textContent)}</div>`).join('');
      } else {
        let group = null, html = '';
        for (const o of rows) { const g = (o.parentElement.label) || '';
          if (g !== group) { group = g; if (g) html += `<div class="isel-g">${esc(g)}</div>`; }
          html += `<div class="isel-opt" data-v="${esc(o.value)}">${esc(o.textContent)}</div>`; }
        opts.innerHTML = html;
      }
    }
    const rerender = () => { renderTools(); renderOpts(); sync(); };
    sel._rerender = rerender;                                   // itemA change re-filters itemB
    rerender();
    tools.onclick = (e) => {
      const sb = e.target.closest('[data-sort]'), fb = e.target.closest('[data-slot]'), qb = e.target.closest('[data-qual]');
      if (sb) { const k = sb.dataset.sort; if (state.sort === k) state.dir = -state.dir; else { state.sort = k; state.dir = 1; } }
      else if (fb) { const s = fb.dataset.slot; state.slots.has(s) ? state.slots.delete(s) : state.slots.add(s); }
      else if (qb) { const q = qb.dataset.qual; state.quals.has(q) ? state.quals.delete(q) : state.quals.add(q); }
      else return;
      renderTools(); renderOpts();
    };
    btn.onclick = () => {
      const open = !wrap.classList.contains('open');
      document.querySelectorAll('.isel.open').forEach(w => w.classList.remove('open'));
      wrap.classList.toggle('open', open);
      hidePreview();
      if (open) opts.querySelector(`[data-v="${CSS.escape(sel.value)}"]`)?.scrollIntoView({ block: 'nearest' });
    };
    opts.onmouseover = (e) => { const o = e.target.closest('.isel-opt'); if (o) showPreview(itemForOption(o.dataset.v), o); };
    list.onmouseleave = hidePreview;
    opts.onclick = (e) => {
      const o = e.target.closest('.isel-opt'); if (!o) return;
      sel.value = o.dataset.v; sync();
      wrap.classList.remove('open'); hidePreview();
      sel.dispatchEvent(new Event('change'));
    };
  }
  document.addEventListener('click', (e) => {
    if (e.target.closest('.isel')) return;
    document.querySelectorAll('.isel.open').forEach(w => w.classList.remove('open'));
    hidePreview();
  });

  // Persistent card above the craft form: whatever Item A (and the Recombine
  // partner) currently are, drawn exactly like Equipped/Bag. Selection itself
  // already survives reloads and restarts via localStorage, so this does too.
  let recombResult = null; // set after a recombine — {a, b, id} of the fresh result item
  function renderPick() {
    const aVal = $('itemA') && $('itemA').value;
    const items = [aVal, $('itemB') && $('itemB').value].map(itemForOption).filter(Boolean);
    // Only while the recombine result is still the selected Item A: name its
    // sources and flag the crit-granted modifier ("how it was affected").
    let note = '';
    if (recombResult && aVal === recombResult.id) {
      const made = itemForOption(aVal), crit = made && (made.mods || []).find(m => m.crit);
      note = `<div class="recombnote">Result of recombine: <b>${esc(recombResult.a || '?')}</b> + <b>${esc(recombResult.b || '?')}</b>` +
        (crit ? ` <span class="mt crit">+${esc(crit.t)} ✦ crit!</span>` : '') + `</div>`;
    }
    $('craftPick').innerHTML = !items.length ? '' :
      `<div class="craftpick"><div class="craftpick-h">Crafting</div>${note}
        <div class="grid">${items.map(it => itemCard(it, `${eqBtn(it)} ${lockBtn(it)} ${disBtn(it)} ${shareBtn(it)}`)).join('')}</div></div>`;
  }

  // ---- persisted checkbox state ----
  // Veil, Include Krangle and the batch multiplier survive reloads. Veil costs
  // extra, so it stays visibly checked rather than being silently remembered —
  // the cost preview on every button reflects it.
  const CB = 'craftFlags';
  const cbAll = () => { try { return JSON.parse(localStorage.getItem(CB)) || {}; } catch { return {}; } };
  const cbGet = (k, dflt) => { const v = cbAll()[k]; return v === undefined ? dflt : v; };
  const cbSet = (k, v) => { const o = cbAll(); o[k] = v; localStorage.setItem(CB, JSON.stringify(o)); };

  // ---- customizable craft sections ----
  // Same idea as the main window's toolbar: a persisted layout the user drags
  // into shape. Sections instead of dropdown groups — every button stays
  // visible, which is what you want mid-craft.
  const SEC = 'craftSections';
  const DEFAULT_SECTIONS = [
    { name: 'Modify', items: ['transmute', 'augment', 'regal', 'exalt'] },
    { name: 'Risky', items: ['scour', 'annulment', 'krangle', 'chancing'] },
    { name: 'Improve', items: ['polishing', 'reforge', 'recombine'] },
  ];
  const loadSections = () => { try { const s = JSON.parse(localStorage.getItem(SEC)); return Array.isArray(s) && s.length ? s : null; } catch { return null; } };
  const saveSections = (s) => localStorage.setItem(SEC, JSON.stringify(s));
  let sections = loadSections() || JSON.parse(JSON.stringify(DEFAULT_SECTIONS));
  let dragging = null, didDragCraft = false; // didDragCraft swallows the click a drag leaves behind

  function renderSections(actions) {
    const byAction = Object.fromEntries(actions.map(a => [a.action, a]));
    const placed = new Set();
    // The layout is PERSISTENT — an id stays in its section even when the game
    // isn't currently offering that craft (which crafts are valid depends on the
    // selected item, so this changes every craft). Dropping an unavailable id
    // here used to forget it, then re-add it as "new" into the last section on
    // its return, funnelling every button into one section over time. So only
    // dedupe within the layout; never remove an id for being unavailable.
    sections = sections.map(s => ({ name: s.name, items: (s.items || []).filter(id => {
      if (placed.has(id)) return false; placed.add(id); return true; }) }));
    // Genuinely new craft types — never seen in any section — join the last one.
    const extra = actions.filter(a => !placed.has(a.action)).map(a => a.action);
    if (extra.length) {
      const last = sections[sections.length - 1] || (sections[sections.length] = { name: 'More', items: [] });
      last.items.push(...extra);
    }
    // Render only the buttons currently offered; the rest keep their slot in the
    // saved layout for when the item makes them valid again.
    $('craftSections').innerHTML = sections.map((s, i) => `
      <div class="csec" data-sec="${i}">
        <div class="csec-h"><input class="csec-name" data-sec="${i}" value="${esc(s.name)}" maxlength="24"
          title="Rename this section"><button class="csec-del" data-del="${i}" title="Remove section (its buttons move to the one before)">✕</button></div>
        <div class="acts csec-body" data-sec="${i}">
          ${s.items.filter(id => byAction[id]).map(id => { const a = byAction[id];
            return `<button data-craft="${esc(a.action)}" draggable="true"${tip(a.tip)}>${esc(a.label)}</button>`; }).join('')
          || '<span class="muted" style="font-size:0.78rem">Drag a craft here</span>'}
        </div>
      </div>`).join('') +
      `<div class="acts" style="margin-top:6px"><button id="secAdd" class="chip" style="cursor:pointer">＋ Section</button>
        <button id="secReset" class="chip" style="cursor:pointer" title="Back to the default grouping">↺ Reset</button></div>`;
    wireSections(actions);
  }

  function wireSections(actions) {
    const commit = () => { saveSections(sections); renderSections(actions); updateCosts(); };
    $('craftSections').querySelectorAll('.csec-name').forEach(el => {
      el.onchange = () => { sections[+el.dataset.sec].name = el.value.trim() || 'Section'; saveSections(sections); };
      el.onkeydown = (e) => { if (e.key === 'Enter') el.blur(); };
    });
    $('craftSections').querySelectorAll('[data-del]').forEach(el => el.onclick = () => {
      const i = +el.dataset.del;
      if (sections.length < 2) return;                       // never leave zero sections
      const into = sections[i - 1] || sections[i + 1];        // buttons are never lost
      into.items.push(...sections[i].items);
      sections.splice(i, 1);
      commit();
    });
    $('secAdd').onclick = () => { sections.push({ name: 'Section', items: [] }); commit(); };
    $('secReset').onclick = () => { sections = JSON.parse(JSON.stringify(DEFAULT_SECTIONS)); commit(); };

    $('craftSections').querySelectorAll('[data-craft]').forEach(btn => {
      btn.ondragstart = (e) => { dragging = btn.dataset.craft; didDragCraft = true; btn.style.opacity = '0.4'; e.dataTransfer.effectAllowed = 'move'; };
      btn.ondragend = () => { dragging = null; btn.style.opacity = ''; setTimeout(() => { didDragCraft = false; }, 0); };
    });
    $('craftSections').querySelectorAll('.csec-body').forEach(body => {
      body.ondragover = (e) => { e.preventDefault(); body.classList.add('over'); };
      body.ondragleave = () => body.classList.remove('over');
      body.ondrop = (e) => {
        e.preventDefault(); body.classList.remove('over');
        if (!dragging) return;
        for (const s of sections) { const k = s.items.indexOf(dragging); if (k >= 0) s.items.splice(k, 1); }
        const target = sections[+body.dataset.sec];
        // Dropped onto a specific button: land before it, so order is editable
        // without needing a separate handle.
        const over = e.target.closest('[data-craft]');
        const at = over ? target.items.indexOf(over.dataset.craft) : -1;
        if (at >= 0) target.items.splice(at, 0, dragging); else target.items.push(dragging);
        commit();
      };
    });
  }

  // Replicate the live site's per-item cost calc so button costs are correct
  // for the selected item (base + 3*tier; veil extras; reforge 30*tier; polish
  // by quality). Token-based buttons (Regal/Krangle) keep the server label.
  let lastCraft = { options: [], actions: [] };
  let pendChoices = null; // pending-card choices, indexed by data-veilpick
  const batchTimes = () => +([...document.querySelectorAll('.batchx')].find(b => b.checked)?.value || 1);
  function updateCosts() {
    const byId = Object.fromEntries((lastCraft.options || []).map(o => [o.id, o]));
    const A = byId[$('itemA')?.value], B = byId[$('itemB')?.value];
    const tierA = A?.tier || 0, qualA = A?.quality || 0, perfA = !!A?.perfect;
    const pool = (A?.affixes || 0) + (B?.affixes || 0);
    const veiled = $('veil')?.checked;
    // ×N label suffix only — per-cast cost rises as quality/tier climb mid-batch,
    // so a multiplied total would be a lie; affordability stays per-cast.
    const xN = batchTimes() > 1 ? ` ×${batchTimes()}` : '';
    for (const a of lastCraft.actions || []) {
      const btn = document.querySelector(`[data-craft="${a.action}"]`);
      if (!btn) continue;
      if (a.polish) { const c = perfA ? 12 : Math.ceil(qualA / 10); btn.textContent = `Polishing (${c}s${xN})`; btn.disabled = (a.sand ?? 0) < c || A?.polishRoom === 0; continue; }
      if (a.reforge) { const c = 30 * tierA; btn.textContent = `Reforge (${c}d${xN})`; btn.disabled = (a.dust ?? 0) < c; continue; }
      if (a.base == null) { btn.textContent = a.label; btn.disabled = false; continue; } // Regal/Krangle: token label
      let cost = a.recombine ? a.base : a.base + 3 * tierA;
      if (veiled && a.veilExtra != null) { cost += a.veilExtra; if (a.recombine) cost += 500 * pool; }
      btn.textContent = `${a.dataLabel} (${cost > 0 ? cost + 'd' : 'Free'})`;
      btn.disabled = false;
    }
    renderPick();
  }

  // Refresh now, then once more after the server settles the action.
  // Single coalesced reload shortly after an action (covers post-redirect lag);
  // rapid actions collapse into one, and out-of-order renders can't happen.
  let refreshT = null;
  const refresh = () => { clearTimeout(refreshT); refreshT = setTimeout(load, 500); };

  // Bag rendering with sort/group (applied to the cached bag; no refetch).
  let lastBag = [], lastEquipped = [], lastCap = null, meName = '';
  const numTier = (i) => +(i.tier?.match(/\d+/) || [0])[0];
  const numQual = (i) => i.sacred || i.quality === 'Sacred' ? 102 : i.quality?.includes('Perfect') ? 101 : +(i.quality?.match(/\d+/) || [0])[0];
  const bestRoll = (i) => Math.max(0, ...(i.mods || []).map(m => rollOf(m.tip) || 0));
  const modCount = (i) => (i.mods || []).length;
  const durPct = (i) => i.durability?.indestructible ? 100 : (i.durability?.pct ?? 100);
  // Group definitions: key(it) buckets an item, label(key) is the header text,
  // order sorts the buckets. Grouping keeps the active sort's order within each.
  const GROUPERS = {
    slot: { key: (i) => i.slot, label: slotOf, order: (a, b) => String(a).localeCompare(String(b)) },
    tier: { key: numTier, label: (t) => `Tier ${t}`, order: (a, b) => b - a },
    quality: { key: numQual, label: (q) => q >= 102 ? 'Sacred' : q >= 101 ? 'Perfect' : `Quality ${q}`, order: (a, b) => b - a },
    rarity: { key: (i) => i.krangled ? 'Krangled' : i.sacred ? 'Sacred' : i.unique ? 'Unique' : 'Normal',
      label: (s) => s, order: (a, b) => String(a).localeCompare(String(b)) },
  };
  // chat-ready one-liner, e.g.
  // "✨ Ascended Hood 【Helm · T17 · ⭐92%】 +80 dps ➤ +50% dmg dealt (T5·45%)"
  // The two separators are also how the share handler splits the line back into
  // a header and its droppable mod list, so they live here as constants.
  const CHAT_LIMIT = 500, SHARE_ARROW = '  ➤  ', SHARE_SEP = '  |  ';
  // Header, then as many mods as fit alongside the (never-trimmed) link.
  const fitChat = (head, parts, link) => {
    const room = CHAT_LIMIT - (link ? link.length + 1 : 0);
    // No real item name gets near the budget on its own; clamp by code point
    // rather than by unit so the guard can't leave half a surrogate pair behind.
    let text = head.length <= room ? head : [...head].slice(0, room).join('');
    for (let i = 0; i < parts.length; i++) {
      const next = text + (i ? SHARE_SEP : SHARE_ARROW) + parts[i];
      if (next.length > room) break;
      text = next;
    }
    return link ? text + ' ' + link : text;
  };
  const shareText = (it) => {
    const t = (it.tier || '').replace('Tier ', 'T');
    const q = it.sacred ? '✦Sacred' : it.quality?.includes('Perfect') ? '🌟Perfect' : `⭐${(it.quality || '').replace('Quality ', '')}`;
    const mods = [
      ...(it.implicits || []).map(i => i.t),
      ...(it.mods || []).map(m => {
        const r = rollOf(m.tip);
        return r != null ? `${m.t} (T${tierOf(r)}·${r}%)` : m.t;
      }),
    ].join(SHARE_SEP);
    return `✨ ${it.name} 【${slotOf(it.slot)} · ${t} · ${q}】${it.primary ? ` ${it.primary}` : ''}${mods ? `${SHARE_ARROW}${mods}` : ''}`;
  };
  // Compact payload for the extension-readable item link — shape is the
  // "#pod-item=" contract in /item-codec.js (mirrored byte-for-byte in
  // extension/shared/, enforced by codec.test.mjs).
  const compactItem = (it) => ({
    n: it.name, s: (it.slot || '').toLowerCase(), t: numTier(it) || undefined,
    q: it.sacred ? 'Sacred' : it.quality || undefined, p: it.primary || undefined,
    im: (it.implicits || []).map(i => i.t),
    m: (it.mods || []).map(m => [m.t, rollOf(m.tip), m.crit ? 1 : 0]),
    f: { ...(it.sacred ? { sa: 1 } : {}), ...(it.unique ? { un: 1 } : {}), ...(it.krangled ? { kr: 1 } : {}) },
  });
  const shareBtn = (it) => `<button data-share="${esc(shareText(it))}" data-sjson="${esc(JSON.stringify(compactItem(it)))}" title="Copy for chat">Share</button>`;
  // An item_id is exactly what a bag item has and equipped gear doesn't, so it
  // also says which way the equip toggle goes.
  const eqBtn = (it) => it.id
    ? `<button data-eq="${it.id}">Equip</button>`
    : `<button data-un="${esc(it.slot)}">Unequip</button>`;
  // Bag items only — equipped gear carries no item_id, and the site offers
  // neither a Keep toggle nor a disenchant for it.
  const lockBtn = (it) => it.id
    ? `<button data-lock="${it.id}">${it.protected ? 'Unlock' : '🔒 Lock'}</button>`
    : '';
  const disBtn = (it) => it.id
    ? `<button class="danger" data-dis="${it.id}" data-name="${esc(it.name)}"${it.dust ? ` data-dmin="${it.dust.min}" data-dmax="${it.dust.max}"` : ''}>Disenchant</button>`
    : '';
  const bagCard = (it) => itemCard(it,
    `${eqBtn(it)}
     ${lockBtn(it)}
     ${disBtn(it)}
     ${repairBtn(it)} ${shareBtn(it)}`);
  function renderBag() {
    const items = [...lastBag];
    const cmp = { tier: (a, b) => numTier(b) - numTier(a), quality: (a, b) => numQual(b) - numQual(a),
      roll: (a, b) => bestRoll(b) - bestRoll(a), mods: (a, b) => modCount(b) - modCount(a),
      durability: (a, b) => durPct(a) - durPct(b), name: (a, b) => a.name.localeCompare(b.name),
      slot: (a, b) => a.slot.localeCompare(b.slot) }[$('sortBy').value] || (() => 0);
    items.sort(cmp);
    $('bagh').textContent = `Bag (${items.length}${lastCap ? '/' + lastCap : ''})`;
    if (!items.length) { $('bag').innerHTML = '<p class="muted">Empty.</p>'; return; }
    const gr = GROUPERS[$('groupBy').value];
    if (gr) {
      const g = new Map();
      for (const it of items) { const k = gr.key(it); (g.get(k) || g.set(k, []).get(k)).push(it); }
      $('bag').innerHTML = [...g.keys()].sort(gr.order).map(k =>
        `<h3 class="grouphdr">${gr.label(k)} (${g.get(k).length})</h3><div class="grid">${g.get(k).map(bagCard).join('')}</div>`).join('');
    } else {
      $('bag').innerHTML = `<div class="grid">${items.map(bagCard).join('')}</div>`;
    }
  }
  // remember the user's sort/group across reloads
  const sSel = document.getElementById('sortBy'), gSel = document.getElementById('groupBy');
  if (localStorage.getItem('bagSort')) sSel.value = localStorage.getItem('bagSort');
  if (localStorage.getItem('bagGroup')) gSel.value = localStorage.getItem('bagGroup');
  sSel.onchange = () => { localStorage.setItem('bagSort', sSel.value); renderBag(); };
  gSel.onchange = () => { localStorage.setItem('bagGroup', gSel.value); renderBag(); };

  // One delegated listener instead of re-binding every button after each render.
  document.addEventListener('click', async (e) => {
    const b = e.target.closest('[data-un],[data-eq],[data-lock],[data-dis],[data-veilpick],[data-share],[data-craft],[data-rep],[data-repall]');
    if (!b) return;
    const d = b.dataset;
    // Repair spends dust and the site answers with a bare 303 either way, so
    // diff the result like a craft does rather than claiming success blindly.
    if (d.rep !== undefined) {
      await craftAct(d.rep.replace(/^\//, ''), { [d.repf]: d.repv }, 'Repair', { currency: true });
      return refresh();
    }
    if (d.repall !== undefined) {
      await craftAct('repair-all', {}, 'Repair all', { currency: true });
      return refresh();
    }
    if (d.un !== undefined) { await api('unequip', { slot: d.un }); return refresh(); }
    if (d.eq !== undefined) { await api('equip', { item_id: d.eq }); return refresh(); }
    if (d.lock !== undefined) { await api('toggle-disenchant-protect', { item_id: d.lock, protect: 'on' }); return refresh(); }
    if (d.dis !== undefined) {
      // The site quotes the dust range in its own confirm; match it rather than
      // asking people to commit blind.
      const range = d.dmin ? ` for ${(+d.dmin).toLocaleString()}-${(+d.dmax).toLocaleString()} Thaumatergic Dust` : '';
      if (!confirm(`Disenchant ${d.name}${range}? Can't be undone.`)) return;
      await craftAct('disenchant', { item_id: d.dis }, 'Disenchant', { currency: true }); return refresh();
    }
    if (d.veilpick !== undefined) {
      // Replay the site's own form for this choice. No craftAct diffing: a
      // multi-step walk (Chancing) parks the NEXT step instead of changing the
      // inventory, which the diff would misread as "rejected" — just reload.
      const c = (pendChoices || [])[+d.veilpick];
      if (!c) return refresh();
      document.querySelectorAll('[data-veilpick]').forEach(el => el.disabled = true); // no double-submit — could auto-advance a wizard step
      const r = await api(c.action.replace(/^\//, ''), c.fields);
      if (r.ok) toast('✅ Choice submitted');
      return refresh();
    }
    if (d.share !== undefined) {
      // Twitch caps a message at 500 characters, and a fully loaded item's
      // prose alone can pass that. The link is the item's only complete,
      // self-contained copy (the extension rebuilds the whole card from it), so
      // it is built first and never trimmed — the prose is a preview that fills
      // whatever budget is left, losing mods off its tail one at a time.
      const [head, tail] = d.share.split(SHARE_ARROW);
      const parts = tail ? tail.split(SHARE_SEP) : [];
      let link = '';
      // Cosmetic-text-only fallback if encoding is unavailable.
      try {
        if (d.sjson && window.PodItemCodec) {
          const item = JSON.parse(d.sjson);
          const login = /^[a-z0-9_]{1,25}$/i.test(meName) ? meName.toLowerCase() : '';
          const { encodeItem, itemLink } = window.PodItemCodec;
          link = itemLink(await encodeItem(item), login);
          // Published extensions only match "1." links, so stay on version 1
          // while it fits and step down to the compact version 2 shape (and
          // then to the shorter site-root link) only when it doesn't.
          if (head.length + link.length + 1 > CHAT_LIMIT) {
            const p2 = await encodeItem(item, 2);
            link = itemLink(p2, login);
            if (head.length + link.length + 1 > CHAT_LIMIT) link = itemLink(p2, '');
          }
        }
      } catch {}
      const text = fitChat(head, parts, link);
      try { await navigator.clipboard.writeText(text); const o = b.textContent; b.textContent = 'Copied!'; setTimeout(() => b.textContent = o, 1200); }
      catch { $('err').textContent = 'Clipboard blocked'; }
      return;
    }
    if (d.craft !== undefined) {
      if (didDragCraft) { didDragCraft = false; return; } // a reorder drag ends in a click — don't craft
      const action = d.craft;
      const fields = { action, item_a: $('itemA').value };
      if (action === 'recombine' && $('itemB').value) fields.item_b = $('itemB').value;
      if ($('veil').checked) fields.veiled = '1';
      if (action === 'hideout warrior' && lastCraft.hideoutKrangle && $('hideoutK')?.checked)
        fields.hideout_krangle = lastCraft.hideoutKrangle.value; // unchecked = omitted, like a real form
      const times = batchTimes();
      if (times > 1 && (action === 'polishing' || action === 'reforge')) fields.times = String(times);
      // The site marks committing/destructive crafts itself (data-confirm);
      // scour/krangle stay as a fallback for an old bridge without that field.
      const aDef = (lastCraft.actions || []).find(x => x.action === action);
      if ((aDef?.confirm || action === 'scour' || action === 'krangle') &&
          !confirm(`${aDef?.dataLabel || title(action)} this item? Can't be undone.`)) return;
      if (action === 'recombine') {
        const aName = itemForOption($('itemA').value)?.name, bName = itemForOption($('itemB').value)?.name;
        const opts = { recombine: true };
        await craftAct('craft', fields, title(action), opts);
        const made = (opts.newItems || [])[0]; // recombine consumes A+B, emits one fresh item
        if (made) {
          recombResult = { a: aName, b: bName, id: made.id };
          localStorage.setItem('craftItemA', made.id); // select it on the reload below
          localStorage.removeItem('craftItemB');        // B was consumed
        }
      } else {
        await craftAct('craft', fields, title(action));
      }
      refresh();
    }
  });

  // Disenchant every bag item (server skips only 🔒 Keep items; Krangled included).
  document.getElementById('disAll').onclick = async () => {
    if (!confirm(`Disenchant ALL bag items? 🔒 Keep-marked items are skipped (Krangled items are included). Can't be undone.`)) return;
    await craftAct('disenchant-all', {}, 'Disenchant all', { currency: true });
    refresh();
  };

  load();
</script>
<script src="/item-codec.js"></script>
<script src="/tooltip.js"></script>
<script src="/autoreload.js"></script>
</body>
</html>
