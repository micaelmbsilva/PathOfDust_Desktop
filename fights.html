<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Path of Dust — Fight History</title>
<script src="/config.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: "Segoe UI", Arial, sans-serif;
    background: #0c0a16; color: #eae6f5; }
  h1 { font-size: 1.2rem; margin: 0; }
  h3 { font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: #8a7fb0; margin: 12px 0 4px; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { background: #1c1830; border: 1px solid rgba(160,140,255,0.25); border-radius: 8px;
    padding: 4px 10px; font-size: 0.85rem; }
  button.chip { cursor: pointer; color: #eae6f5; font: inherit; font-size: 0.85rem; }
  .fight { background: rgba(24,20,40,0.9); border: 1px solid rgba(160,140,255,0.25);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .fight > summary { cursor: pointer; font-weight: 700; list-style: none; }
  .fight > summary::-webkit-details-marker { display: none; }
  .fight .when { font-size: 0.75rem; color: #8a7fb0; font-weight: 400; }
  .won { color: #7fdba3; } .lost { color: #ff8080; }
  ul { margin: 0; padding-left: 20px; font-size: 0.85rem; line-height: 1.5; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 0.8rem; width: 100%; }
  th, td { text-align: left; padding: 4px 10px; white-space: nowrap;
    border-bottom: 1px solid rgba(160,140,255,0.10); }
  th { color: #8a7fb0; font-weight: 600; position: sticky; top: 0; background: #14101f;
    cursor: pointer; user-select: none; border-bottom-color: rgba(160,140,255,0.3); }
  th:hover { color: #cdc2ee; }
  th.sorted { color: #b98bff; }
  /* zebra striping does the heavy lifting for scanning a 36-row party */
  tbody tr:nth-child(even) { background: rgba(0,0,0,0.28); }
  tbody tr:hover { background: rgba(120,90,255,0.16); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.mine td { color: #ffd76b; font-weight: 700; }
  tr.mine { background: rgba(255,215,107,0.10) !important; }
  .rolechips { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
  .rolechips .chip.pf { cursor: pointer; font-size: 0.78rem; padding: 3px 10px; }
  .rolechips .chip.pf:hover { border-color: rgba(160,140,255,0.6); }
  .rolechips .chip.pf.on { border-color: #7c5cff; color: #b98bff; }
  .rolechips .chip.muted { cursor: help; }
  .muted { color: #8a7fb0; }
  #err { color: #ff8080; }
</style>
</head>
<body>
  <div class="bar">
    <h1>📜 Fight History</h1>
    <button class="chip" id="reload" title="Refresh now">🔄</button>
    <button class="chip" id="follow"></button>
    <button class="chip" id="help" title="Following means this list refreshes on its own the moment a fight ends, and jumps to the newest one — which is opened for you. Pause it if you're reading an older fight and don't want the page moving under you; anything that happens while paused is counted on the button, and resuming loads it straight away. The 🔄 button always refreshes regardless.">?</button>
    <span class="chip muted" id="source"></span>
  </div>
  <div id="err"></div>
  <div id="list"><p class="muted">Loading… the game rebuilds this page from every logged fight, so it takes a few seconds.</p></div>

<script src="/feed.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const list = (arr, empty) => arr.length
    ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
    : `<p class="muted">${empty}</p>`;
  const fmtN = PodFeed.fmtN;
  // Loot outcomes arrive as Rust's Debug formatting — "AutoDisenchanted { dust:
  // 1665 }" — because the page prints the enum with {:?}. Read it as English.
  const prettyLoot = (s) => String(s).replace(
    /([A-Z][A-Za-z]*)\s*\{\s*([a-z_]+):\s*(\d+)\s*\}/g,
    (_, name, field, n) => `${name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase()} +${(+n).toLocaleString()} ${field}`);

  async function load() {
    $('err').textContent = '';
    let d;
    try { d = await fetch('/api/fights', { cache: 'no-store' }).then(r => r.json()); }
    catch { $('err').textContent = 'Can\'t reach the game right now'; return; }
    if (d.expired) { $('err').textContent = 'Session expired — restart the app to log in again.'; return; }
    // Everything below comes from the game's own summary tier. The app's live
    // capture is deliberately NOT used as a fallback here: the overlay thinning
    // trims it, and this pane exists to be exact.
    if (d.gated) { $('list').innerHTML = `<p class="muted">The game isn't serving fight history to this account.</p>`; return; }
    if (!d.fights.length) { $('list').innerHTML = '<p class="muted">No fights recorded yet.</p>'; return; }
    // A render fault used to leave this pane simply blank, with the reason only
    // visible in a devtools console nobody has open. Say it on the page.
    if (d.source === 'summary') {
      try { return renderSummary(d.fights); }
      catch (e) {
        $('err').textContent = `Couldn't render fight history: ${e.message}`;
        $('list').innerHTML = '';
        fetch('/api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ level: 'error', message: 'fights render: ' + e.message }) }).catch(() => {});
        return;
      }
    }
    $('source').textContent = "The site's own breakdown — the last 10 encounters.";
    // First fight open, the rest collapsed — ten full breakdowns is a lot of page.
    $('list').innerHTML = d.fights.map((f, i) => `
      <details class="fight"${i ? '' : ' open'}>
        <summary><span class="${f.won ? 'won' : 'lost'}">${esc(f.title)}</span>
          <div class="when">${esc(f.meta)}</div></summary>
        ${f.boss.length ? `<h3>Boss Stats</h3>${list(f.boss, '')}` : ''}
        <h3>Battle Report</h3>${list(f.report, 'Nothing recorded.')}
        <h3>Loot</h3>${list(f.loot.map(prettyLoot), 'None.')}
        <h3>Broken Gear</h3>${list(f.broken, 'None.')}
        <h3>Skills Cast</h3>${list(f.skills, 'None logged.')}
        ${f.buffs.length ? `<h3>Buff / Debuff Stack Activity</h3><div class="scroll"><table>
          <tr><th>Unit</th><th>Buff/Debuff</th><th>Samples</th><th>Avg</th><th>Peak</th></tr>
          ${f.buffs.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}
        </table></div>` : ''}
      </details>`).join('');
  }
  // ---- the game's own per-fight summary tier ----
  // Per-player aggregates built from the complete event log before the overlay
  // thinning runs, so unlike anything derived from the live feed these totals
  // are exact. Every participant gets a row, including the ones who did nothing.
  // In the summary tier `outcome` is real JSON, not the Debug string the HTML
  // page printed — either "kept" or { autoDisenchanted: { dust: N } }.
  const outcomeText = (o) => !o ? '' : typeof o === 'string'
    ? o.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase()
    : Object.entries(o).map(([k, v]) => k.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase() +
        (v && v.dust ? ` +${(+v.dust).toLocaleString()} dust` : '')).join(', ');
  let myName = '';
  fetch('/api/me').then(r => r.json()).then(m => { if (m.name && m.name !== myName) { myName = m.name; load(); } }).catch(() => {});

  // Class per player, so the role filter reflects the actual kit rather than
  // being inferred from a fight's numbers. Cached bridge-side; a miss just
  // leaves that row unfiltered rather than guessing at it.
  let roster = {};
  fetch('/api/roster-classes').then(r => r.json())
    .then(r => { if (r && !r.expired) { roster = r; if (Object.keys(roster).length) renderAll(); } }).catch(() => {});
  const classOf = (n) => (roster[String(n || '').toLowerCase()] || {}).cls || '';
  const rolesOf = (n) => PodFeed.rolesOf(classOf(n));

  // Sort and role filter, both persisted — they are a reading preference, not
  // per-fight state, so they apply to every fight card at once.
  const COLS = [
    { key: 'damageDealt', label: 'Damage', num: true },
    { key: 'dps', label: 'DPS', num: true },
    { key: 'damageTaken', label: 'Taken', num: true },
    { key: 'healingDone', label: 'Healing', num: true },
  ];
  const getSort = () => localStorage.getItem('fhSort') || 'damageDealt';
  const getRole = () => localStorage.getItem('fhRole') || 'all';
  const valOf = (p, key, secs) => key === 'dps' ? (p.damageDealt || 0) / secs : (p[key] || 0);

  function filterBar() {
    const role = getRole();
    const chip = (v, l) => `<span class="chip pf${role === v ? ' on' : ''}" data-role="${v}">${l}</span>`;
    return `<div class="rolechips">${chip('all', 'Everyone')}` +
      `${chip('dps', `${PodFeed.ROLE_ICON.dps} DPS`)}${chip('heal', `${PodFeed.ROLE_ICON.heal} Heal`)}` +
      `${chip('tank', `${PodFeed.ROLE_ICON.tank} Tank`)}` +
      `<span class="chip muted" title="Roles come from each character's class kit, read off the roster — dual-role classes (Warrior, Paladin, Druid, Monk) appear under both. Anyone whose class hasn't loaded yet is always shown. Click a column heading to sort; the choice sticks across fights and restarts.">?</span></div>`;
  }
  let lastFights = null;
  const renderAll = () => { if (lastFights) renderSummary(lastFights); };


  // Same guard as load(): a bad payload must name the error on the page, not
  // blank the pane and strand dead handlers with only a console nobody reads.
  function safeRender(fights) {
    try { renderSummary(fights); }
    catch (e) { $('err').textContent = `Couldn't render fight history: ${e.message}`; }
  }
  function renderSummary(fights) {
    lastFights = fights;
    $('source').textContent = `The game's own per-fight summary — exact totals, last ${fights.length}.`;
    const when = (ms) => ms ? new Date(ms).toLocaleString() : 'time unknown';
    const sortKey = getSort(), role = getRole();
    // Which fights were expanded — keyed by fight identity (startedAtUnixMs), not
    // child index, so a filter/sort re-render can't shift the open card by one
    // (the filter bar is child 0). A new-fight follow ignores this and opens only
    // the newest, collapsing the rest.
    const wasOpen = new Set([...$('list').querySelectorAll('details.fight[data-fid]')]
      .filter(d => d.open).map(d => d.dataset.fid));
    $('list').innerHTML = filterBar() + fights.map((f, i) => {
      const secs = Math.max(1, (f.displayDurationMs || 0) / 1000);
      const rows = [...(f.players || [])]
        // Unknown class stays visible: hiding a row because the roster hasn't
        // loaded would quietly under-report the party.
        .filter(p => { const r = rolesOf(p.displayName); return role === 'all' || !r || r.includes(role); })
        .sort((a, b) => valOf(b, sortKey, secs) - valOf(a, sortKey, secs));
      const total = rows.reduce((n, p) => n + (p.damageDealt || 0), 0);
      const mine = rows.find(p => (p.displayName || '').toLowerCase() === myName.toLowerCase());
      // The summary reports only the FIRST death (firstToDie) — no per-player
      // death flag exists, so a member who went down later can't be marked.
      const died = (name) => f.firstToDie && (name || '').toLowerCase() === f.firstToDie.toLowerCase();
      return `<details class="fight" data-fid="${esc(f.startedAtUnixMs || i)}">
        <summary><span class="${f.won ? 'won' : 'lost'}">${f.won ? '🏆 Won' : '💀 Lost'} — Stage ${esc(f.stage)}${f.kind === 'boss' ? ' 💀 Boss' : ''}</span>
          <div class="when">${esc(when(f.startedAtUnixMs))} · ${esc(f.participants)} in the party${
            mine ? ` · you dealt ${fmtN(mine.damageDealt || 0)}${total ? ` (${((mine.damageDealt || 0) / total * 100).toFixed(1)}%)` : ''}${died(myName) ? ' · 💀 you went down first' : ''}` : ' · you sat this one out'}</div></summary>
        <h3>Party${role === 'all' ? '' : ` — ${PodFeed.ROLE_ICON[role]} ${role}`} (${rows.length})</h3>
        <div class="scroll"><table>
          <thead><tr><th>#</th><th>Player</th><th>Class</th>${COLS.map(c =>
            `<th class="num${c.key === sortKey ? ' sorted' : ''}" data-sort="${c.key}" title="Sort by ${c.label}">${c.label}${c.key === sortKey ? ' ▾' : ''}</th>`).join('')}</tr></thead>
          <tbody>${rows.map((p, n) => {
            const r = rolesOf(p.displayName);
            return `<tr${(p.displayName || '').toLowerCase() === myName.toLowerCase() ? ' class="mine"' : ''}>
            <td>${n + 1}</td><td>${esc(p.displayName)}${died(p.displayName) ? ' <span title="First to go down this fight">💀</span>' : ''}</td>
            <td>${esc(classOf(p.displayName))} ${(r || []).map(x => PodFeed.ROLE_ICON[x]).join('')}</td>
            ${COLS.map(c => `<td class="num">${fmtN(valOf(p, c.key, secs))}</td>`).join('')}</tr>`;
          }).join('')}</tbody>
        </table></div>
        <p class="muted" style="font-size:0.7rem;margin:4px 0 0">Healing includes absorbed shielding — the game totals them together and doesn't report them apart.</p>
        ${f.firstToDie ? `<h3>First Down</h3><p>💀 ${esc(f.firstToDie)}</p>` : ''}
        <h3>Loot</h3>${list((f.loot || []).map(l =>
          `${l.displayName} — ${l.itemName} T${l.tier} (${l.slot}${l.outcome ? ', ' + outcomeText(l.outcome) : ''})`), 'None.')}
        <h3>Broken Gear</h3>${list((f.broken || []).map(b => `${b.displayName} — ${b.itemName}`), 'None.')}
      </details>`;
    }).join('');
    // Reapply expansion by fight id. On a new-fight follow, open only the newest
    // (first card) and collapse everything else; otherwise keep whatever was
    // open, and on the very first load fall back to newest-open.
    const cards = [...$('list').querySelectorAll('details.fight[data-fid]')];
    const freshFollow = pendingFreshFollow; pendingFreshFollow = false;
    cards.forEach((d, n) => {
      d.open = freshFollow ? n === 0
        : wasOpen.size ? wasOpen.has(d.dataset.fid)
        : n === 0;
    });
    $('list').querySelectorAll('[data-role]').forEach(el => el.onclick = () => {
      localStorage.setItem('fhRole', el.dataset.role); safeRender(fights);
    });
    $('list').querySelectorAll('[data-sort]').forEach(el => el.onclick = () => {
      localStorage.setItem('fhSort', el.dataset.sort); safeRender(fights);
    });
  }


  // ---- follow the latest fight ----
  // The main window broadcasts when an encounter resolves; the game writes its
  // summary before broadcasting, so the fight is already fetchable when we hear
  // about it. Nothing here opens a socket of its own — the encounter payload is
  // megabytes, and one listener for it is enough.
  const FOLLOW = 'fightsFollow';
  const following = () => localStorage.getItem(FOLLOW) !== '0';
  let missed = 0;
  // Set for the one render that a new-fight broadcast triggers, so it opens only
  // the newest fight instead of preserving what was expanded.
  let pendingFreshFollow = false;

  function renderFollow() {
    const b = $('follow');
    b.textContent = following() ? '⏸ Following' : `▶ Paused${missed ? ` (${missed})` : ''}`;
    b.title = following()
      ? 'Refreshing automatically when a fight ends — click to pause'
      : `Not refreshing on its own${missed ? ` · ${missed} fight${missed > 1 ? 's' : ''} since you paused` : ''} — click to resume`;
    b.style.borderColor = following() ? '#4a8a5a' : (missed ? '#d9a441' : '');
  }
  $('follow').onclick = () => {
    const now = !following();
    localStorage.setItem(FOLLOW, now ? '1' : '0');
    renderFollow();
    if (now && missed) { missed = 0; load(); }   // resuming catches you up at once
  };

  if (typeof BroadcastChannel === 'function') {
    new BroadcastChannel('pod').onmessage = (e) => {
      if (!e.data || e.data.type !== 'encounter') return;
      // Jump back to the top and open only the newest fight — collapse whatever
      // was expanded, so the page shows the fight that just happened.
      if (following()) { pendingFreshFollow = true; load().then(() => scrollTo({ top: 0, behavior: 'smooth' })); }
      else { missed++; renderFollow(); }
    };
  }

  $('reload').onclick = () => { missed = 0; renderFollow(); load(); };
  document.title = `${GAME_NAME} — Fight History`;
  renderFollow();
  load();
</script>
<script src="/autoreload.js"></script>
</body>
</html>
