<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Path of Dust — Fight History</title>
<script src="/config.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; font-family: "Segoe UI", Arial, sans-serif;
    background: #0c0a16; color: #eae6f5; }
  h1 { font-size: 1.2rem; margin: 0; }
  h3 { font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase;
    color: #8a7fb0; margin: 12px 0 4px; }
  .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { background: #1c1830; border: 1px solid rgba(160,140,255,0.25); border-radius: 8px;
    padding: 4px 10px; font-size: 0.85rem; }
  button.chip { cursor: pointer; color: #eae6f5; font: inherit; font-size: 0.85rem; }
  /* feed category chips (feed.js emits .rolechips > .chip.pf) */
  .rolechips { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 4px; }
  .rolechips .chip.pf { cursor: pointer; font-size: 0.75rem; padding: 2px 8px; }
  .rolechips .chip.pf.on { border-color: #7c5cff; color: #b98bff; }
  .fight { background: rgba(24,20,40,0.9); border: 1px solid rgba(160,140,255,0.25);
    border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .fight > summary { cursor: pointer; font-weight: 700; list-style: none; }
  .fight > summary::-webkit-details-marker { display: none; }
  .fight .when { font-size: 0.75rem; color: #8a7fb0; font-weight: 400; }
  .won { color: #7fdba3; } .lost { color: #ff8080; }
  ul { margin: 0; padding-left: 20px; font-size: 0.85rem; line-height: 1.5; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; font-size: 0.8rem; }
  th, td { text-align: left; padding: 3px 10px 3px 0; white-space: nowrap; }
  th { color: #8a7fb0; font-weight: 600; }
  tr.mine td { color: #ffd76b; font-weight: 700; }
  .muted { color: #8a7fb0; }
  #err { color: #ff8080; }
</style>
</head>
<body>
  <div class="bar">
    <h1>📜 Fight History</h1>
    <button class="chip" id="reload" title="Refresh">🔄</button>
    <span class="chip muted" id="source"></span>
  </div>
  <div id="err"></div>
  <div id="list"><p class="muted">Loading… the game rebuilds this page from every logged fight, so it takes a few seconds.</p></div>

<script src="/feed.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const list = (arr, empty) => arr.length
    ? `<ul>${arr.map(x => `<li>${esc(x)}</li>`).join('')}</ul>`
    : `<p class="muted">${empty}</p>`;
  // Loot outcomes arrive as Rust's Debug formatting — "AutoDisenchanted { dust:
  // 1665 }" — because the page prints the enum with {:?}. Read it as English.
  const prettyLoot = (s) => String(s).replace(
    /([A-Z][A-Za-z]*)\s*\{\s*([a-z_]+):\s*(\d+)\s*\}/g,
    (_, name, field, n) => `${name.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase()} +${(+n).toLocaleString()} ${field}`);

  async function load() {
    $('err').textContent = '';
    let d;
    try { d = await fetch('/api/fights', { cache: 'no-store' }).then(r => r.json()); }
    catch { $('err').textContent = 'Can\'t reach the game right now'; return; }
    if (d.expired) { $('err').textContent = 'Session expired — restart the app to log in again.'; return; }
    // The game hardcodes a single allowed login for /fights and 404s everyone
    // else, so for almost every player this page has no server data at all.
    // Fall back to what the app recorded itself off the live fight feed.
    if (d.gated || !d.fights.length) return renderLocal(d.gated);
    if (d.source === 'summary') return renderSummary(d.fights);
    $('source').textContent = "The site's own breakdown — the last 10 encounters.";
    // First fight open, the rest collapsed — ten full breakdowns is a lot of page.
    $('list').innerHTML = d.fights.map((f, i) => `
      <details class="fight"${i ? '' : ' open'}>
        <summary><span class="${f.won ? 'won' : 'lost'}">${esc(f.title)}</span>
          <div class="when">${esc(f.meta)}</div></summary>
        ${f.boss.length ? `<h3>Boss Stats</h3>${list(f.boss, '')}` : ''}
        <h3>Battle Report</h3>${list(f.report, 'Nothing recorded.')}
        <h3>Loot</h3>${list(f.loot.map(prettyLoot), 'None.')}
        <h3>Broken Gear</h3>${list(f.broken, 'None.')}
        <h3>Skills Cast</h3>${list(f.skills, 'None logged.')}
        ${f.buffs.length ? `<h3>Buff / Debuff Stack Activity</h3><div class="scroll"><table>
          <tr><th>Unit</th><th>Buff/Debuff</th><th>Samples</th><th>Avg</th><th>Peak</th></tr>
          ${f.buffs.map(r => `<tr>${r.map(c => `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}
        </table></div>` : ''}
      </details>`).join('');
  }
  // ---- the game's own per-fight summary tier ----
  // Per-player aggregates built from the complete event log before the overlay
  // thinning runs, so unlike anything derived from the live feed these totals
  // are exact. Every participant gets a row, including the ones who did nothing.
  // In the summary tier `outcome` is real JSON, not the Debug string the HTML
  // page printed — either "kept" or { autoDisenchanted: { dust: N } }.
  const outcomeText = (o) => !o ? '' : typeof o === 'string'
    ? o.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase()
    : Object.entries(o).map(([k, v]) => k.replace(/([a-z])([A-Z])/g, '$1-$2').toLowerCase() +
        (v && v.dust ? ` +${(+v.dust).toLocaleString()} dust` : '')).join(', ');
  let myName = '';
  fetch('/api/me').then(r => r.json()).then(m => { if (m.name && m.name !== myName) { myName = m.name; load(); } }).catch(() => {});

  // The summary tier carries exact totals but no events, so the personal blow-
  // by-blow has to come from what this app captured live off the socket. Both
  // sides timestamp the same instant — the game saves the fight immediately
  // before broadcasting it — so matching on stage plus a tight time window is
  // unambiguous even during rampage, where fights land 60s apart.
  function localFeedFor(f) {
    let log = [];
    try { log = JSON.parse(localStorage.getItem('battleLog')) || []; } catch {}
    if (!Array.isArray(log) || !f.startedAtUnixMs) return null;
    let best = null, bestGap = Infinity;
    for (const rep of log) {
      if (!rep || !rep.feed || rep.stage !== f.stage) continue;
      const gap = Math.abs((rep.at || 0) - f.startedAtUnixMs);
      if (gap < bestGap) { bestGap = gap; best = rep; }
    }
    return bestGap <= 60000 && best ? best : null;
  }
  const feedCat = () => localStorage.getItem('podFeedCat') || 'all';

  function renderSummary(fights) {
    $('source').textContent = `The game's own per-fight summary — exact totals, last ${fights.length}.`;
    const when = (ms) => ms ? new Date(ms).toLocaleString() : 'time unknown';
    $('list').innerHTML = fights.map((f, i) => {
      const secs = Math.max(1, (f.displayDurationMs || 0) / 1000);
      const rows = [...(f.players || [])].sort((a, b) => (b.damageDealt || 0) - (a.damageDealt || 0));
      const total = rows.reduce((n, p) => n + (p.damageDealt || 0), 0);
      const mine = rows.find(p => (p.displayName || '').toLowerCase() === myName.toLowerCase());
      const rep = localFeedFor(f);
      return `<details class="fight"${i ? '' : ' open'}>
        <summary><span class="${f.won ? 'won' : 'lost'}">${f.won ? '🏆 Won' : '💀 Lost'} — Stage ${esc(f.stage)}${f.kind === 'boss' ? ' 💀 Boss' : ''}</span>
          <div class="when">${esc(when(f.startedAtUnixMs))} · ${esc(f.participants)} in the party${
            mine ? ` · you dealt ${fmtN(mine.damageDealt || 0)}${total ? ` (${((mine.damageDealt || 0) / total * 100).toFixed(1)}%)` : ''}` : ' · you sat this one out'}</div></summary>
        <h3>Party</h3>
        <div class="scroll"><table>
          <tr><th>#</th><th>Player</th><th>Damage</th><th>DPS</th><th>Taken</th><th>Healing</th><th>Hits</th><th>Crit</th></tr>
          ${rows.map((p, n) => `<tr${(p.displayName || '').toLowerCase() === myName.toLowerCase() ? ' class="mine"' : ''}>
            <td>${n + 1}</td><td>${esc(p.displayName)}</td>
            <td>${fmtN(p.damageDealt || 0)}</td><td>${fmtN((p.damageDealt || 0) / secs)}</td>
            <td>${fmtN(p.damageTaken || 0)}</td><td>${fmtN(p.healingDone || 0)}</td>
            <td>${p.hits || 0}</td><td>${p.hits ? Math.round((p.crits || 0) / p.hits * 100) : 0}%</td></tr>`).join('')}
        </table></div>
        ${!mine ? '' : rep && rep.feed.length
          ? `<h3>Your Fight Log (${rep.feed.length})</h3>${PodFeed.chips(feedCat())}
             <div class="pod-feed" style="max-height:260px">${PodFeed.lines(rep.feed, feedCat()) || '<p class="muted">Nothing in this category.</p>'}</div>
             <p class="muted" style="font-size:0.7rem">Captured live by this app. The game trims its live feed, so a busy fight may be missing some of your hits — the totals above are unaffected.</p>`
          : `<p class="muted" style="font-size:0.75rem">📜 No personal log — the app wasn't running for this fight.</p>`}
        ${f.firstToDie ? `<h3>First Down</h3><p>💀 ${esc(f.firstToDie)}</p>` : ''}
        <h3>Loot</h3>${list((f.loot || []).map(l =>
          `${l.displayName} — ${l.itemName} T${l.tier} (${l.slot}${l.outcome ? ', ' + outcomeText(l.outcome) : ''})`), 'None.')}
        <h3>Broken Gear</h3>${list((f.broken || []).map(b => `${b.displayName} — ${b.itemName}`), 'None.')}
      </details>`;
    }).join('');
    // Category chips re-render in place; <details> keep their own open state
    // because we rebuild the same markup, so only the scroll position is lost.
    PodFeed.bindChips($('list'), (cat) => {
      const open = [...$('list').children].map(d => d.open);
      localStorage.setItem('podFeedCat', cat);
      renderSummary(fights);
      [...$('list').children].forEach((d, n) => { d.open = open[n] ?? false; });
    });
  }

  // ---- fallback: the fights this app recorded itself ----
  // Same localStorage the Combat History panel reads (same origin), deliberately
  // rendered thin — outcome, your line, loot. The full view (fight logs, party
  // leaderboards, filters) already exists in that panel, so this links to it
  // instead of growing a second copy.
  const fmtN = (n) => n >= 1e12 ? (n / 1e12).toFixed(1) + 'T' : n >= 1e9 ? (n / 1e9).toFixed(1) + 'B'
    : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n));
  const ago = (t) => { const m = Math.round((Date.now() - t) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m}m ago` : `${Math.floor(m / 60)}h${m % 60 ? ` ${m % 60}m` : ''} ago`; };
  // The main window hosts this page (panel iframe) or opened it (pop-out).
  const host = () => { try { return window.parent !== window ? window.parent : window.opener; } catch { return null; } };

  function renderLocal(gated) {
    $('source').textContent = gated
      ? "The game only serves its own breakdown to the streamer — showing the fights this app recorded instead."
      : "The game has no fights logged — showing the ones this app recorded.";
    let log = [];
    try { log = JSON.parse(localStorage.getItem('battleLog')) || []; } catch {}
    const actions = `<div class="bar" style="margin-top:10px">
      ${host() ? '<button class="chip" id="openHist">Open Combat History →</button>' : ''}
      <button class="chip" id="openLogs">📂 Open Logs Folder</button></div>`;
    if (!Array.isArray(log) || !log.length) {
      $('list').innerHTML = '<p class="muted">Nothing recorded yet — the app logs each fight while it\'s running, so reports appear after the next battle.</p>' + actions;
    } else {
      $('list').innerHTML = log.map(rep => {
        const m = rep.me || {}, secs = Math.max(1, (rep.durMs || 0) / 1000);
        const idle = !m.hits && !m.dmg && !m.taken && !m.heal && !m.healRecv;
        return `<details class="fight">
          <summary><span class="${rep.won ? 'won' : 'lost'}">${rep.won ? '🏆 Won' : '💀 Lost'} — Stage ${esc(rep.stage)}${rep.kind && rep.kind !== 'basic' ? ' 💀 Boss' : ''}</span>
            <div class="when">${Math.round(secs)}s · ${rep.partySize || 0} in the party · ${ago(rep.at)}</div></summary>
          ${idle ? '<p class="muted">🪦 You sat this one out — downed, retreated, or joined late.</p>' : `
          <h3>You</h3><ul>
            <li>Damage dealt: ${fmtN(m.dmg)} (${((m.share || 0) * 100).toFixed(1)}% of the party) · ${fmtN(m.dmg / secs)}/s</li>
            <li>Damage taken: ${fmtN(m.taken)}</li>
            <li>Healing done: ${fmtN(m.heal)} · received: ${fmtN(m.healRecv)}</li>
            <li>Crit rate: ${m.hits ? Math.round(m.crits / m.hits * 100) : 0}% of ${m.hits || 0} hits${m.evaded ? ` · evaded ${m.evaded}×` : ''}</li>
          </ul>`}
          ${(rep.deaths || []).length ? `<h3>Party Deaths</h3>${list(rep.deaths, '')}` : ''}
          <h3>Your Loot</h3>${list((rep.myLoot || []).map(l => `${l.item} (${l.slot}, ${l.outcome})`), 'None.')}
        </details>`;
      }).join('') + actions;
    }
    const oh = $('openHist');
    // Same-origin, so the host window's own toggle is callable directly.
    if (oh) oh.onclick = () => { try { host().toggleModal('battles', true); host().focus(); } catch {} };
    // The bridge only has a logs folder when the packaged shell handed it one.
    $('openLogs').onclick = async () => {
      const r = await fetch('/api/open-logs', { method: 'POST' }).then(x => x.json()).catch(() => ({}));
      if (!r.ok) $('err').textContent = 'No fight-logs folder yet — turn on "Save Fight Logs to Disk" in Settings.';
    };
  }

  $('reload').onclick = load;
  document.title = `${GAME_NAME} — Fight History`;
  load();
</script>
<script src="/autoreload.js"></script>
</body>
</html>
