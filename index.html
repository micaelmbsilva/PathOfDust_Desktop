<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Path of Dust</title>
<script src="/config.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden;
    font-family: "Segoe UI", Arial, sans-serif; color: #eae6f5;
    background: #1a1a1a; } /* matches the overlay's own bg so zoom-out margins blend */

  /* overlay fills everything, behind the chrome. display-only (cross-origin),
     so pointer-events off — a capture layer above it handles zoom. Its INTERNAL
     size is changed inversely + scaled back, so the scene stays full-bleed while
     the content (characters) shrinks/grows. Anchored top-left (ground at bottom). */
  #overlay { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; z-index: 0;
    pointer-events: none; transform-origin: 0 0; }
  #zoomcapture { position: fixed; inset: 0; z-index: 10; cursor: grab; }
  #zoomcapture.grabbing { cursor: grabbing; }

  /* top button bar */
  #topbar { position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 20;
    display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: linear-gradient(#1c1830ee, #1c183099); backdrop-filter: blur(4px);
    border-bottom: 1px solid rgba(160,140,255,0.25); }
  #topbar .title { font-weight: 600; color: #c9bdf0; font-size: 0.95rem; }
  #topbar .ver { color: #8a7fb0; font-size: 0.72rem; margin-right: auto; }
  .tbtn { background: rgba(120,90,255,0.18); color: #eae6f5; border: 1px solid rgba(160,140,255,0.35);
    border-radius: 8px; padding: 6px 14px; font-size: 0.9rem; cursor: pointer; }
  .tbtn:hover { background: rgba(120,90,255,0.34); }

  /* draggable stats modal */
  #stats { position: fixed; top: 64px; left: 16px; z-index: 30; width: 260px;
    background: rgba(24,20,40,0.92); border: 1px solid rgba(160,140,255,0.3);
    border-radius: 12px; backdrop-filter: blur(6px); box-shadow: 0 8px 30px #0008;
    user-select: none; resize: both; overflow: hidden; min-width: 200px; min-height: 110px;
    display: flex; flex-direction: column; }
  #stats.collapsed { height: auto !important; min-height: 0 !important; resize: none; }
  #stats .bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; cursor: grab;
    border-bottom: 1px solid rgba(160,140,255,0.2); }
  #stats.collapsed .bar { border-bottom: 0; }
  #stats .bar.grabbing { cursor: grabbing; }
  #stats .hname { font-weight: 700; }
  #stats .hsub { font-size: 0.72rem; color: #b0a2d9; margin-left: auto; white-space: nowrap; }
  #stats .toggle { background: none; border: 0; color: #c9bdf0; cursor: pointer; font-size: 1rem;
    line-height: 1; padding: 2px 4px; }
  #stats .rows { flex: 1; min-height: 0; max-height: 70vh; overflow-y: auto; padding: 6px 10px 10px; }
  #stats.collapsed .rows { display: none; }
  .srow { display: flex; justify-content: space-between; gap: 10px; font-size: 0.83rem; padding: 2px 0; }
  .srow .l { color: #b0a2d9; } .srow .v { font-weight: 600; }
  .srow[title] { cursor: help; } .tmods span[title] { cursor: help; }
  .srow.repair { cursor: pointer; border-bottom: 1px solid rgba(160,140,255,0.15); margin-bottom: 3px; padding-bottom: 4px; }
  .srow.repair.on .v { color: #7fdba3; } .srow.repair.off .v { color: #ff8080; }
  .muted { color: #8a7fb0; font-size: 0.8rem; }

  /* new-item notifications */
  #toasts { position: fixed; top: 56px; right: 16px; z-index: 40; width: 300px;
    display: flex; flex-direction: column; gap: 10px; }
  .toast { background: rgba(24,20,40,0.96); border: 1px solid rgba(160,140,255,0.4);
    border-radius: 12px; padding: 12px; box-shadow: 0 8px 30px #0009; animation: pop .18s ease-out; }
  @keyframes pop { from { transform: translateY(-6px); opacity: 0; } }
  .toast .th { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; }
  .toast .tn { font-weight: 700; } .toast .ts { font-size: 0.72rem; color: #b0a2d9; margin-left: auto; }
  .toast .perfect { color: #ffcf5a; font-weight: 700; }
  .toast.reforge, .toast.reforge-result { border-color: #d9a441; background: rgba(60,44,20,0.96); }
  .toast.reforge .tn, .toast.reforge-result .tn { color: #ffcf5a; }
  .toast .tmods { font-size: 0.8rem; color: #c9bdf0; margin: 2px 0 8px; }
  .toast .tmods span { display: block; }
  .toast .tacts { display: flex; flex-wrap: wrap; gap: 6px; }
  .toast button { border-radius: 7px; padding: 5px 10px; font-size: 0.8rem; cursor: pointer;
    border: 1px solid rgba(160,140,255,0.35); background: rgba(120,90,255,0.18); color: #eae6f5; }
  .toast button:hover { background: rgba(120,90,255,0.34); }
  .toast button.danger { border-color: #a04a4a; background: rgba(200,70,70,0.18); }
  .toast button.danger:hover { background: rgba(200,70,70,0.34); }
  .toast button:disabled { opacity: 0.5; cursor: default; }
  /* dismiss-all: shown only when >2 toasts (toggled in JS) */
  #dismissAll { display: none; align-self: flex-end; cursor: pointer;
    background: rgba(200,70,70,0.2); border: 1px solid #a04a4a; color: #eae6f5;
    border-radius: 8px; padding: 5px 12px; font-size: 0.8rem; }
  #dismissAll:hover { background: rgba(200,70,70,0.36); }

  /* Twitch chat — draggable/collapsible modal, like the stats modal.
     The embed includes the channel-points redeem button. */
  #chatpanel { position: fixed; top: 60px; right: 16px; z-index: 36; width: 360px; height: 560px;
    display: none; flex-direction: column; background: rgba(24,20,40,0.96);
    border: 1px solid rgba(160,140,255,0.3); border-radius: 12px; overflow: hidden;
    box-shadow: 0 8px 30px #0009; resize: both; min-width: 280px; min-height: 260px; }
  #chatpanel.open { display: flex; }
  #chatpanel .cbar { display: flex; align-items: center; gap: 8px; padding: 8px 10px;
    cursor: grab; user-select: none; border-bottom: 1px solid rgba(160,140,255,0.2); }
  #chatpanel .cbar.grabbing { cursor: grabbing; }
  #chatpanel.collapsed .cbar { border-bottom: 0; }
  #chatpanel .ctitle { font-weight: 700; font-size: 0.9rem; }
  #chatpanel .cbtns { margin-left: auto; display: flex; gap: 2px; }
  #chatpanel .cbtns button { background: none; border: 0; color: #c9bdf0; cursor: pointer;
    font-size: 1rem; line-height: 1; padding: 2px 6px; }
  #chatpanel .cwrap { flex: 1; min-height: 0; }
  #chatpanel.collapsed { height: auto !important; min-height: 0 !important; resize: none; }
  #chatpanel.collapsed .cwrap { display: none; }
  #chatpanel iframe { width: 100%; height: 100%; border: 0; }
  #topbar .tbtn.active { background: rgba(120,90,255,0.45); }
</style>
</head>
<body>
<iframe id="overlay" src="https://adventure.lokati.net/overlay"></iframe>
<div id="zoomcapture" title="Wheel to zoom · double-click to reset"></div>

<div id="topbar">
  <span class="title" id="appTitle"></span>
  <span class="ver" id="ver" title="App version — updates automatically on launch"></span>
  <button class="tbtn" onclick="openWin('/bag.html','bag',1140,880)">🎒 Bag</button>
  <button class="tbtn" onclick="openWin('/passives.html','passives',1840,860)">🌳 Passives</button>
  <button class="tbtn" id="chatBtn" onclick="toggleChat()">💬 Chat</button>
  <button class="tbtn" id="hlBtn" onclick="toggleHighlight()" title="Dim other players, highlight your character">✨ Highlight me</button>
  <button class="tbtn" title="Refresh now" onclick="loadStats(); pollBag()">🔄 Refresh</button>
  <button class="tbtn" id="updateBtn" title="Check for updates" onclick="updateAction()">Check for Updates</button>
  <button class="tbtn" title="Send feedback / report a bug" onclick="sendFeedback()">🐛 Feedback</button>
</div>

<div id="chatpanel">
  <div class="cbar" id="chatbar">
    <span class="ctitle">💬 Twitch Chat</span>
    <span class="cbtns">
      <button id="chatPop" title="pop out to its own window">⧉</button>
      <button id="chatCollapse" title="collapse">▾</button>
      <button id="chatCloseBtn" title="close" onclick="toggleChat(false)">✕</button>
    </span>
  </div>
  <div class="cwrap"><iframe id="chatFrame" title="Twitch chat"></iframe></div>
</div>

<div id="stats">
  <div class="bar" id="statsbar">
    <span class="hname" id="hname">Character</span>
    <span class="hsub" id="hsub"></span>
    <button class="toggle" id="toggle" title="collapse">▾</button>
  </div>
  <div class="rows" id="rows"><p class="muted">Loading…</p></div>
</div>

<div id="toasts"><button id="dismissAll">✕ Dismiss all</button></div>

<script>
  document.getElementById('appTitle').textContent = GAME_NAME;
  let appVersion = '';
  const setTitle = (name) => {
    document.title = GAME_NAME + (appVersion ? ` v${appVersion}` : '') + (name ? ` — ${name}` : '');
  };
  setTitle();

  // open a custom page in its own app-style window
  function openWin(path, name, w = 1000, h = 800) {
    window.open(path, name, `width=${w},height=${h},menubar=no,toolbar=no`);
  }

  // ---- layout persistence (panel positions/sizes/collapse + overlay zoom) ----
  const LS = {
    get: (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch { return d; } },
    set: (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  // Restore a draggable/resizable/collapsible panel's geometry, and return a
  // save() to call after drags/collapses (resizes autosave via ResizeObserver).
  function persistPanel(el, key) {
    const s = LS.get(key, null);
    if (s) {
      if (s.left != null) { el.style.left = s.left + 'px'; el.style.right = 'auto'; }
      if (s.top != null) el.style.top = s.top + 'px';
      if (s.width) el.style.width = s.width + 'px';
      if (s.height && !s.collapsed) el.style.height = s.height + 'px';
      if (s.collapsed) el.classList.add('collapsed');
    }
    const save = () => {
      if (!el.offsetWidth) return; // hidden (e.g. chat closed) — don't store zeros
      const r = el.getBoundingClientRect(), prev = LS.get(key, {}), collapsed = el.classList.contains('collapsed');
      LS.set(key, {
        left: Math.round(r.left), top: Math.round(r.top), width: Math.round(el.offsetWidth),
        height: collapsed ? (prev.height || 0) : Math.round(el.offsetHeight), // keep expanded height while collapsed
        collapsed,
      });
    };
    new ResizeObserver(save).observe(el);
    return save;
  }

  // Overlay source: plain, or ?highlight=<name> to dim other players (lokati's
  // feature). Toggle persists; needs our character name (from /api/me).
  const OVERLAY = 'https://adventure.lokati.net/overlay';
  let myName = '';
  function applyHighlight() {
    const on = localStorage.getItem('highlight') === '1';
    const src = on && myName ? `${OVERLAY}?highlight=${encodeURIComponent(myName)}` : OVERLAY;
    const ov = document.getElementById('overlay');
    if (ov.getAttribute('src') !== src) ov.setAttribute('src', src); // reload only if changed
    document.getElementById('hlBtn').classList.toggle('active', on);
  }
  function toggleHighlight() {
    localStorage.setItem('highlight', localStorage.getItem('highlight') === '1' ? '0' : '1');
    applyHighlight();
  }

  // Twitch chat panel — embed loads lazily; `parent` must be the serving host.
  const TWITCH_LOGIN = 'lokati_gaming';
  function toggleChat(show) {
    const p = document.getElementById('chatpanel'), b = document.getElementById('chatBtn'),
          f = document.getElementById('chatFrame');
    const open = show === undefined ? !p.classList.contains('open') : show;
    if (open && !f.getAttribute('src'))
      // full popout chat (send-capable) — the app strips Twitch's frame headers so it loads
      f.src = `https://www.twitch.tv/popout/${TWITCH_LOGIN}/chat?popout=`;
    p.classList.toggle('open', open);
    b.classList.toggle('active', open);
  }
  // collapse + drag, same pattern as the stats modal
  (function () {
    const panel = document.getElementById('chatpanel');
    const bar = document.getElementById('chatbar');
    const cbtn = document.getElementById('chatCollapse');
    const saveChat = persistPanel(panel, 'lay.chat');
    cbtn.textContent = panel.classList.contains('collapsed') ? '▸' : '▾'; // reflect restored state
    cbtn.onclick = () => {
      panel.classList.toggle('collapsed');
      cbtn.textContent = panel.classList.contains('collapsed') ? '▸' : '▾';
      saveChat();
    };
    // pop out into a real window — fully interactive Twitch chat, no iframe quirks
    document.getElementById('chatPop').onclick = () => {
      window.open(`https://www.twitch.tv/popout/${TWITCH_LOGIN}/chat?popout=`, 'pdchat', 'width=420,height=640');
      toggleChat(false);
    };
    let drag = false, dx = 0, dy = 0;
    bar.addEventListener('pointerdown', (e) => {
      if (e.target.closest('.cbtns')) return;
      drag = true; bar.classList.add('grabbing'); bar.setPointerCapture(e.pointerId);
      const r = panel.getBoundingClientRect();
      dx = e.clientX - r.left; dy = e.clientY - r.top; panel.style.right = 'auto';
    });
    bar.addEventListener('pointermove', (e) => {
      if (!drag) return;
      panel.style.left = Math.max(0, Math.min(innerWidth - 60, e.clientX - dx)) + 'px';
      panel.style.top = Math.max(44, Math.min(innerHeight - 40, e.clientY - dy)) + 'px';
    });
    bar.addEventListener('pointerup', (e) => { drag = false; bar.classList.remove('grabbing'); bar.releasePointerCapture(e.pointerId); saveChat(); });
  })();

  // ---- overlay zoom (wheel) ----
  // The frame always fills the window; we change its INTERNAL size inversely
  // and scale it back, so the overlay's own canvas reflows the scene smaller
  // (zoom out) or larger (zoom in) with no dead margins.
  const ov = document.getElementById('overlay');
  const cap = document.getElementById('zoomcapture');
  let z = 1, panX = 0, panY = 0;
  { const s = LS.get('lay.zoom', null); if (s) { z = s.z || 1; panX = s.panX || 0; panY = s.panY || 0; } } // restore
  const MIN = 0.4, MAX = 3;
  // Reflow zoom (internal size inverse + scale back → aspect-preserved, full-bleed),
  // plus a translate so you can hold-drag to move the camera.
  let zsaveT;
  const applyZoom = () => {
    ov.style.width = ov.style.height = (100 / z) + '%';
    ov.style.transform = `translate(${panX}px,${panY}px) scale(${z})`;
    clearTimeout(zsaveT); zsaveT = setTimeout(() => LS.set('lay.zoom', { z, panX, panY }), 400);
  };
  applyZoom(); // apply restored zoom/pan on load
  cap.addEventListener('wheel', (e) => {
    e.preventDefault();
    z = Math.min(MAX, Math.max(MIN, z * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
    applyZoom();
  }, { passive: false });
  // hold + drag to move the camera
  let panning = false, sx = 0, sy = 0;
  cap.addEventListener('pointerdown', (e) => {
    panning = true; sx = e.clientX - panX; sy = e.clientY - panY;
    cap.setPointerCapture(e.pointerId); cap.classList.add('grabbing');
  });
  cap.addEventListener('pointermove', (e) => {
    if (!panning) return;
    panX = e.clientX - sx; panY = e.clientY - sy; applyZoom();
  });
  cap.addEventListener('pointerup', (e) => { panning = false; cap.classList.remove('grabbing'); cap.releasePointerCapture(e.pointerId); });
  cap.addEventListener('dblclick', () => { z = 1; panX = 0; panY = 0; applyZoom(); });

  // ---- stats modal: load + refresh ----
  let statsBusy = false; // in-flight guard: a slow fetch mustn't stack more
  async function loadStats() {
    if (statsBusy) return;
    statsBusy = true;
    try {
      const r = await fetch('/api/me').then(r => r.json());
      document.getElementById('hname').textContent = r.name;
      if (r.name) setTitle(r.name);
      if (r.name && r.name !== myName) { myName = r.name; applyHighlight(); } // enable highlight once we know the name
      // just the archetype — dust/sand already appear in the rows below
      document.getElementById('hsub').textContent = r.nav.replace(/^Lv \d+ /, '').split('·')[0].trim();
      const arRow = `<div class="srow repair ${r.autoRepair ? 'on' : 'off'}" id="arRow"` +
        `${r.autoRepairTip ? ` data-tip="${r.autoRepairTip.replace(/"/g, '&quot;')}"` : ''}>` +
        `<span class="l">🔧 Auto-repair</span><span class="v">${r.autoRepair ? 'On' : 'Off'}</span></div>`;
      document.getElementById('rows').innerHTML = arRow + r.stats.map(s =>
        `<div class="srow"${s.tip ? ` data-tip="${s.tip.replace(/"/g, '&quot;')}"` : ''}>` +
        `<span class="l">${s.label}</span><span class="v">${s.value}</span></div>`).join('');
      document.getElementById('arRow').onclick = async () => { await action('toggle-auto-repair', {}); loadStats(); };
      reconcileReforge(r.reforge);
    } catch {
      document.getElementById('rows').innerHTML = '<p class="muted">Bridge offline — run server.mjs</p>';
    } finally { statsBusy = false; }
  }
  loadStats();

  // ---- new-item notifications ----
  // Known-item ids persist so a page reload doesn't re-toast the whole bag.
  // First successful poll seeds silently; only ids new after that pop a toast.
  const KEY = 'knownBagItems';
  let known = new Set(JSON.parse(localStorage.getItem(KEY) || '[]'));
  let seeded = known.size > 0;
  const saveKnown = () => localStorage.setItem(KEY, JSON.stringify([...known]));

  let bagBusy = false;
  async function pollBag() {
    if (bagBusy) return;
    bagBusy = true;
    let bag;
    try { bag = await fetch('/api/bag').then(r => r.json()); }
    catch { return; } // bridge offline — try again next tick
    finally { bagBusy = false; }
    const ids = new Set(bag.items.map(i => i.id));
    if (!seeded) { known = ids; seeded = true; saveKnown(); return; } // silent seed
    for (const item of bag.items) {
      if (!known.has(item.id)) { known.add(item.id); toast(item); }
    }
    // forget ids no longer in the bag so they'd re-notify if they come back
    known = new Set([...known].filter(id => ids.has(id)));
    saveKnown();
  }
  pollBag();

  // One poll loop for stats + bag. While the event WebSocket below is healthy it
  // pushes changes near-instantly, so polling backs off to a 30s safety net;
  // without it (offline, WS down) we poll every 3s as before.
  let wsOk = false, pollTick = 0;
  setInterval(() => { if (wsOk && ++pollTick % 10) return; loadStats(); pollBag(); }, 3000);

  // Event-driven refresh: the server pushes to /ws whenever something happens
  // (fights, drops). Refresh stats+bag on push (debounced) so changes show
  // near-instantly without polling harder. Falls back to the idle poll above.
  function watchEvents() {
    let ws, t = null;
    try { ws = new WebSocket('wss://adventure.lokati.net/ws'); } catch { return; }
    ws.onopen = () => { wsOk = true; };
    ws.onmessage = () => { clearTimeout(t); t = setTimeout(() => { loadStats(); pollBag(); }, 700); };
    ws.onclose = () => { wsOk = false; setTimeout(watchEvents, 3000); };
    ws.onerror = () => ws.close();
  }
  watchEvents();

  async function action(endpoint, fields) {
    return fetch('/api/action', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint, fields }),
    }).then(r => r.json());
  }

  function toast(item) {
    const el = document.createElement('div');
    el.className = 'toast';
    const mods = item.mods?.length ? `<div class="tmods">${item.mods.map(m => `<span data-tip="${(m.tip || '').replace(/"/g, '&quot;')}">${m.t}</span>`).join('')}</div>` : '';
    el.innerHTML = `
      <div class="th"><span class="tn">${item.name}</span>
        <span class="ts">${item.slot} · ${item.tier} · ${item.quality && item.quality.includes('Perfect') ? `<span class="perfect">${item.quality}</span>` : item.quality}</span></div>
      ${mods}
      <div class="tacts">
        <button class="danger" data-act="dis">Disenchant</button>
        <button data-act="lock">🔒 Lock</button>
        <button data-act="bag">Bag</button>
        <button data-act="x">Dismiss</button>
      </div>`;
    const close = () => { el.remove(); updateDismissAll(); };
    el.querySelector('[data-act="x"]').onclick = close;
    el.querySelector('[data-act="bag"]').onclick = () => openWin('/bag.html', 'bag');
    el.querySelector('[data-act="lock"]').onclick = async (e) => {
      e.target.disabled = true;
      await action('toggle-disenchant-protect', { item_id: item.id, protect: 'on' });
      e.target.textContent = '🔒 Locked';
    };
    el.querySelector('[data-act="dis"]').onclick = async (e) => {
      if (!confirm(`Disenchant ${item.name}? This can't be undone.`)) return;
      e.target.disabled = true;
      const dust = () => fetch('/api/inventory', { cache: 'no-store' })
        .then(r => r.json()).then(i => +String(i.dust).replace(/[^\d]/g, '') || 0).catch(() => null);
      const before = await dust();
      await action('disenchant', { item_id: item.id });
      if (before != null) { const after = await dust(); if (after > before) infoToast(`💰 +${(after - before).toLocaleString()} dust from ${item.name}`); }
      close();
    };
    const dismissAll = document.getElementById('dismissAll');
    dismissAll.after(el); // newest just below the dismiss-all bar
    updateDismissAll();
  }

  // show "Dismiss all" only when more than 2 notifications are stacked
  function updateDismissAll() {
    const n = document.querySelectorAll('#toasts .toast').length;
    document.getElementById('dismissAll').style.display = n > 2 ? 'block' : 'none';
  }
  document.getElementById('dismissAll').onclick = () => {
    document.querySelectorAll('#toasts .toast').forEach(t => t.remove());
    updateDismissAll();
  };

  // ---- Reforge Gear reminder: once per hour, shared between a 1k-dust option
  // and the 1k channel-points redemption. Driven by the live card state from
  // /api/me (see reconcileReforge) — shown while available, one at a time.
  function showReforge(rf) {
    document.querySelectorAll('.toast.reforge').forEach(t => t.remove());
    const el = document.createElement('div');
    el.className = 'toast reforge';
    const dustBtn = (rf.canDust && rf.action) ? `<button data-act="dust">${rf.label || 'Reforge (1k dust)'}</button>` : '';
    el.innerHTML = `
      <div class="th"><span class="tn">⚒️ Reforge Gear ready</span><span class="ts">once per hour</span></div>
      <div class="tmods"><span>Upgrade a random equipped item 2–4 tiers — 1k dust or 1k channel points.</span></div>
      <div class="tacts">
        ${dustBtn}
        <button data-act="chat">Redeem (points)</button>
        <button data-act="x">Dismiss</button>
      </div>`;
    el.querySelector('[data-act="x"]').onclick = () => { el.remove(); updateDismissAll(); };
    el.querySelector('[data-act="chat"]').onclick = () => toggleChat(true);
    const db = el.querySelector('[data-act="dust"]');
    if (db) db.onclick = async () => {
      db.disabled = true;
      // Snapshot equipped tiers, reforge, re-snapshot: the site shows no result
      // flash, so we detect the upgraded item by which slot's tier went up.
      const snap = () => fetch('/api/inventory', { cache: 'no-store' }).then(r => r.json()).catch(() => null);
      const before = await snap();
      const res = await action(rf.action, {}).catch(() => null);
      if (!res || !res.ok) { reforgeToast('⚒️ Reforge failed', 'Could not reach the game — try again.'); loadStats(); return; }
      let hit = reforgeDiff(before, await snap());
      if (!hit) { await new Promise(r => setTimeout(r, 700)); hit = reforgeDiff(before, await snap()); } // read-after-write retry
      if (hit) reforgeToast(`⚒️ Reforged ${hit.name}`, `${hit.from} → ${hit.to} (+${hit.d} tiers)`, hit.slot);
      else reforgeToast('⚒️ Reforge done', "Submitted — couldn't detect the upgraded item.");
      loadStats();
    };
    document.getElementById('dismissAll').after(el);
    updateDismissAll();
  }
  // Which equipped slot jumped 2–4 tiers between snapshots (reforge upgrades one
  // equipped item by 2–4). Requires exactly one such candidate so we never guess.
  // ponytail: keyed by slot, not item id — equipped markup carries no item id, and
  // a concurrent gear swap could misattribute; fine for a cosmetic toast.
  function reforgeDiff(before, after) {
    if (!before?.equipped || !after?.equipped) return null;
    const tnum = (t) => { const m = String(t).match(/(\d+)/); return m ? +m[1] : null; };
    const prev = Object.fromEntries(before.equipped.map(e => [e.slot, e]));
    const hits = [];
    for (const e of after.equipped) {
      const p = prev[e.slot]; if (!p) continue;
      const a = tnum(p.tier), b = tnum(e.tier);
      if (a == null || b == null) continue;
      if (b - a >= 2 && b - a <= 4) hits.push({ name: e.name, slot: e.slot, from: p.tier, to: e.tier, d: b - a });
    }
    return hits.length === 1 ? hits[0] : null;
  }
  // Distinct class from the reminder toast: reconcileReforge reaps `.toast.reforge`
  // on cooldown, which would delete this result the instant loadStats() runs.
  function reforgeToast(title, body, slot) {
    const el = document.createElement('div');
    el.className = 'toast reforge-result';
    el.innerHTML = `
      <div class="th"><span class="tn">${title}</span>${slot ? `<span class="ts">${slot}</span>` : ''}</div>
      <div class="tmods"><span>${body}</span></div>
      <div class="tacts"><button data-act="x">Dismiss</button></div>`;
    el.querySelector('[data-act="x"]').onclick = () => { el.remove(); updateDismissAll(); };
    document.getElementById('dismissAll').after(el);
    updateDismissAll();
  }
  // Show the reforge toast while available; remove it once used/on cooldown.
  function reconcileReforge(rf) {
    const cur = document.querySelector('.toast.reforge');
    if (rf && rf.available) { if (!cur) showReforge(rf); }
    else if (cur) { cur.remove(); updateDismissAll(); }
  }

  // ---- collapse ----
  const stats = document.getElementById('stats'), toggle = document.getElementById('toggle');
  const saveStats = persistPanel(stats, 'lay.stats');
  toggle.textContent = stats.classList.contains('collapsed') ? '▸' : '▾'; // reflect restored state
  toggle.onclick = () => {
    stats.classList.toggle('collapsed');
    toggle.textContent = stats.classList.contains('collapsed') ? '▸' : '▾';
    saveStats();
  };

  // ---- drag by the bar ----
  const bar = document.getElementById('statsbar');
  let dragging = false, dx = 0, dy = 0;
  bar.addEventListener('pointerdown', (e) => {
    if (e.target === toggle) return;
    dragging = true; bar.classList.add('grabbing'); bar.setPointerCapture(e.pointerId);
    const r = stats.getBoundingClientRect();
    dx = e.clientX - r.left; dy = e.clientY - r.top;
    stats.style.right = 'auto'; // switch to left-anchored
  });
  bar.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const x = Math.max(0, Math.min(window.innerWidth - 60, e.clientX - dx));
    const y = Math.max(44, Math.min(window.innerHeight - 40, e.clientY - dy));
    stats.style.left = x + 'px'; stats.style.top = y + 'px';
  });
  bar.addEventListener('pointerup', (e) => { dragging = false; bar.classList.remove('grabbing'); bar.releasePointerCapture(e.pointerId); saveStats(); });

  // ---- version + auto-update feedback ----
  fetch('/api/version', { cache: 'no-store' }).then(r => r.json()).then(v => {
    appVersion = v.version;
    document.getElementById('ver').textContent = 'v' + v.version;
    const n = document.getElementById('hname').textContent;
    setTitle(n && n !== 'Character' ? n : '');
    if (v.autoUpdate !== true) showLegacyBanner(); // old portable shell — no auto-updates
  }).catch(() => {});

  // Old portable builds still hot-update their web UI but can't update the app
  // shell (this bridge doesn't report autoUpdate). Warn them to install the new
  // one, or they're frozen on this shell forever.
  function showLegacyBanner() {
    if (document.getElementById('legacyBanner')) return;
    const el = document.createElement('div');
    el.id = 'legacyBanner';
    el.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:2000;background:#d9a441;color:#1a1205;' +
      'font-weight:700;padding:10px 16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.5)';
    el.innerHTML = '⚠️ This version no longer receives updates. ' +
      '<a href="https://github.com/micaelmbsilva/PathOfDust_Desktop/releases/latest" target="_blank" ' +
      'style="color:#1a1205;text-decoration:underline">Download the new installer</a> ' +
      '— install once, then updates are automatic. ' +
      '<button id="legacyX" style="margin-left:10px;background:#1a1205;color:#ffcf5a;border:0;border-radius:4px;padding:3px 9px;cursor:pointer">Dismiss</button>';
    document.body.appendChild(el);
    document.getElementById('legacyX').onclick = () => el.remove();
  }

  function infoToast(msg) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<div class="th"><span class="tn">${msg}</span></div><div class="tacts"><button data-act="x">OK</button></div>`;
    const close = () => { el.remove(); updateDismissAll(); };
    el.querySelector('[data-act="x"]').onclick = close;
    document.getElementById('dismissAll').after(el); updateDismissAll(); setTimeout(close, 8000);
  }
  // "Check for Updates" button — ask electron-updater to look now, then report
  // using the app's semver. Interface changes apply silently on launch.
  async function updateAction() {
    infoToast('🔄 Checking for updates…');
    try { await fetch('/api/check-update', { cache: 'no-store' }); } catch { infoToast('Update check failed'); return; }
    await new Promise(r => setTimeout(r, 2500)); // give the updater a moment to respond
    let u; try { u = await fetch('/api/update-status', { cache: 'no-store' }).then(r => r.json()); } catch {}
    if (u && u.status === 'ready') showShellUpdateToast(u.version);
    else if (u && u.status === 'downloading') infoToast(`⬆️ Update v${u.version} downloading…`);
    else infoToast(`✅ Up to date (v${appVersion})`);
  }

  // ---- shell (installer) update via electron-updater: toast when downloading /
  // ready, and let the user restart to apply.
  let _shellSeen = '';
  function showShellUpdateToast(v) {
    document.querySelectorAll('.toast.update').forEach(t => t.remove());
    const el = document.createElement('div');
    el.className = 'toast update';
    el.innerHTML = `<div class="th"><span class="tn">⬆️ Update v${v} ready</span></div>` +
      `<div class="tmods"><span>Restart to install — your login and layout are kept.</span></div>` +
      `<div class="tacts"><button data-act="restart">Restart &amp; update</button><button data-act="x">Later</button></div>`;
    el.querySelector('[data-act="x"]').onclick = () => { el.remove(); updateDismissAll(); };
    el.querySelector('[data-act="restart"]').onclick = () => fetch('/api/apply-update', { method: 'POST' });
    document.getElementById('dismissAll').after(el); updateDismissAll();
  }
  async function checkShellUpdate() {
    let u; try { u = await fetch('/api/update-status', { cache: 'no-store' }).then(r => r.json()); } catch { return; }
    if (!u || !u.version) return;
    const tag = u.status + ':' + u.version;
    if (_shellSeen === tag) return;
    _shellSeen = tag;
    if (u.status === 'ready') showShellUpdateToast(u.version);
    else if (u.status === 'downloading') infoToast(`⬆️ Update v${u.version} downloading…`);
  }
  setTimeout(checkShellUpdate, 5000);
  setInterval(checkShellUpdate, 30000);

  // ---- feedback + error reporting (anonymous, to the telemetry backend) ----
  function sendFeedback() {
    const msg = prompt('Send feedback or report a bug (anonymous — no name is sent):');
    if (!msg) return;
    fetch('/api/feedback', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: msg }) })
      .then(r => r.json()).then(r => infoToast(r.ok ? '✅ Thanks — sent.' : 'Feedback isn\'t set up yet.'))
      .catch(() => infoToast('Could not send feedback.'));
  }
  let _lastLog = 0;
  function logRemote(level, message) {
    const now = Date.now(); if (now - _lastLog < 2000) return; _lastLog = now; // throttle
    fetch('/api/log', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ level, message: String(message).slice(0, 2000) }) }).catch(() => {});
  }
  window.addEventListener('error', (e) => logRemote('error', `${e.message} @ ${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', (e) => logRemote('error', 'unhandled: ' + (e.reason && e.reason.message || e.reason)));
  const _upd = new URLSearchParams(location.search).get('updated');
  if (_upd) {
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<div class="th"><span class="tn">✨ Interface updated</span></div>` +
      `<div class="tmods"><span>You're on the latest — the app updates itself on launch.</span></div>` +
      `<div class="tacts"><button data-act="x">Dismiss</button></div>`;
    const close = () => { el.remove(); updateDismissAll(); };
    el.querySelector('[data-act="x"]').onclick = close;
    document.getElementById('dismissAll').after(el);
    updateDismissAll();
    setTimeout(close, 12000);
  }
</script>
<script src="/tooltip.js"></script>
</body>
</html>
