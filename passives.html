<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Path of Dust — Passives</title>
<script src="/config.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px 12px; font-family: "Segoe UI", Arial, sans-serif;
    background: #0c0a16; color: #eae6f5; }
  /* Visual language ported 1:1 from the live site's passives page (its own
     .ptree-page rules): red #ff3b4e invested dots, gold #ffd76b spec point,
     pill chips/buttons, per-state name colors. Layout stays ours. */
  h1 { font-size: 1.1rem; margin: 0 0 6px; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(160,140,255,0.18); border-radius: 999px; padding: 6px 14px;
    font-size: 0.85rem; color: #a394c7; white-space: nowrap; }
  .chip strong { color: #ff8a8a; font-variant-numeric: tabular-nums; }
  .btn-save { font: inherit; font-size: 0.78rem; font-weight: 600; color: #0c0a16; background: #ff8a8a;
    border: 1px solid #ff8a8a; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .btn-save:hover:not(:disabled) { background: #ffa3a3; border-color: #ffa3a3; }
  .btn-respec { font: inherit; font-size: 0.78rem; color: #a394c7; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(160,140,255,0.18); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .btn-respec:hover { border-color: rgba(160,140,255,0.5); color: #eae6f5; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  /* tree canvas + legend styling lives in tree.js — shared with character.html */
  h2 { font-size: 0.95rem; margin: 18px 0 6px; color: #a394c7; }
  select { background: #1c1830; color: #eae6f5; border: 1px solid rgba(160,140,255,0.3);
    border-radius: 6px; padding: 2px 6px; font-size: 0.78rem; max-width: 340px; }
  .muted { color: #8a7fb0; } #err { color: #ff8080; }
</style>
</head>
<body>
  <h1>🌳 Passives <button class="chip" style="cursor:pointer" onclick="load()" title="Refresh">🔄</button></h1>
  <div class="bar" id="bar"></div>
  <div id="legend"></div>
  <div id="err"></div>
  <div id="stage"></div>
  <div id="secBar" class="bar"></div>
  <div id="secStage"></div>

<script src="/tree.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  $('legend').innerHTML = PodTree.legend;

  async function api(endpoint, fields) {
    const r = await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint, fields }) }).then(r => r.json());
    if (!r.ok) $('err').textContent = `${endpoint} -> ${r.status}`;
    return r;
  }
  // refresh now, then again once the server settles the action
  const refresh = () => { load(); setTimeout(load, 800); };

  // Archetype switcher — the site's /change-archetype select, as a bar chip.
  // Re-added after every bar re-render (load() wipes #bar's innerHTML).
  async function loadArchetype() {
    let me; try { me = await fetch('/api/me').then(r => r.json()); } catch { return; }
    if (me.name) document.title = `${GAME_NAME} — Passives — ${me.name}`;
    const a = me.archetype;
    if (!a || !a.options?.length || $('archSel')) return;
    const cur = a.options.find(o => o.selected)?.value;
    const wrap = document.createElement('span');
    wrap.className = 'chip';
    wrap.innerHTML = `Class <select id="archSel">` +
      a.options.map(o => `<option value="${o.value}"${o.selected ? ' selected' : ''}>${o.label}</option>`).join('') + `</select>`;
    $('bar').appendChild(wrap);
    $('archSel').onchange = async () => {
      const v = $('archSel').value;
      if (v === cur) return;
      if (!confirm(`Change archetype to ${v}?`)) { $('archSel').value = cur; return; }
      await api('change-archetype', { archetype: v });
      location.reload(); // whole tree changes with the class
    };
  }

  async function load() {
    $('err').textContent = '';
    let p;
    try { p = await fetch('/api/passives').then(r => r.json()); }
    catch { $('err').textContent = 'Can\'t reach the game right now'; loadArchetype(); return; } // still sets the title (+ class chip) if /api/me works

    $('bar').innerHTML =
      `<span class="chip">🪓 <strong>${p.points}</strong></span>
       <button class="btn-save" id="save" ${p.canSave ? '' : 'disabled'}>Save Changes</button>
       ${p.canReset ? '<button class="btn-respec" id="reset">Reset Preview</button>' : ''}
       <button class="btn-respec" id="respec">${p.respecLabel}</button>
       ${p.dirty ? '<span class="chip" style="color:#ffd76b;border-color:rgba(255,215,107,0.4)">Unsaved Changes</span>' : ''}`;
    $('save').onclick = async () => { await api('passives/save', {}); refresh(); };
    loadArchetype(); // class switcher chip (async, appended to the bar)
    const rst = $('reset');
    if (rst) rst.onclick = async () => { await api('passives/reset', {}); refresh(); }; // discard unsaved allocations
    $('respec').onclick = async () => { if (confirm('Respec — reset all points?')) { await api('passives/respec', {}); refresh(); } };

    // Both trees allocate through the same endpoint; `secondary` is the only
    // thing that tells the server which one the point lands in.
    const onAllocate = async (n, delta) => (await api('passives/allocate',
      { node_key: n.key, secondary: n.secondary ? 'true' : 'false', delta: String(delta) })).ok;
    const wiring = { onAllocate, onDone: refresh };
    PodTree.render($('stage'), p, wiring);
    renderSecondary(p.secondary, wiring);
  }

  // 2nd class (Split Personality). The site only renders this while the unique
  // is equipped, so `null` means "no such thing right now" — not an error.
  function renderSecondary(s, wiring) {
    if (!s) { $('secBar').innerHTML = ''; PodTree.render($('secStage'), { stage: { w: 0, h: 0 }, nodes: [] }); return; }
    const cur = s.options.find(o => o.selected)?.value || '';
    $('secBar').innerHTML = `<h2 style="width:100%">🧠 2nd Class — Split Personality</h2>
      <span class="chip">Class <select id="secSel">
        ${cur ? '' : '<option value="">— pick one —</option>'}
        ${s.options.map(o => `<option value="${o.value}"${o.selected ? ' selected' : ''}>${o.label}</option>`).join('')}
      </select></span>
      <span class="chip muted">Points come from the same pool as your primary tree.</span>`;
    $('secSel').onchange = async () => {
      const v = $('secSel').value;
      if (!v || v === cur) return;
      if (!confirm(`Set your 2nd class to ${v}?`)) { $('secSel').value = cur; return; }
      const r = await api('passives/set-secondary', { archetype: v });
      // The site reports refusals by bouncing to /passives?passive_failed=<reason>
      const why = (r.location || '').match(/passive_failed=([^&]*)/);
      if (why) { $('err').textContent = decodeURIComponent(why[1].replace(/\+/g, ' ')); $('secSel').value = cur; return; }
      refresh();
    };
    PodTree.render($('secStage'), s, wiring);
  }
  load();
</script>
<script src="/tooltip.js"></script>
</body>
</html>
