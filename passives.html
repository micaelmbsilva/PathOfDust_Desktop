<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Path of Dust — Passives</title>
<script src="/config.js"></script>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 10px 12px; font-family: "Segoe UI", Arial, sans-serif;
    background: #0c0a16; color: #eae6f5; }
  /* Visual language ported 1:1 from the live site's passives page (its own
     .ptree-page rules): red #ff3b4e invested dots, gold #ffd76b spec point,
     pill chips/buttons, per-state name colors. Layout stays ours. */
  h1 { font-size: 1.1rem; margin: 0 0 6px; }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.04);
    border: 1px solid rgba(160,140,255,0.18); border-radius: 999px; padding: 6px 14px;
    font-size: 0.85rem; color: #a394c7; white-space: nowrap; }
  .chip strong { color: #ff8a8a; font-variant-numeric: tabular-nums; }
  .btn-save { font: inherit; font-size: 0.78rem; font-weight: 600; color: #0c0a16; background: #ff8a8a;
    border: 1px solid #ff8a8a; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .btn-save:hover:not(:disabled) { background: #ffa3a3; border-color: #ffa3a3; }
  .btn-respec { font: inherit; font-size: 0.78rem; color: #a394c7; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(160,140,255,0.18); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .btn-respec:hover { border-color: rgba(160,140,255,0.5); color: #eae6f5; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  /* tree canvas + legend styling lives in tree.js — shared with character.html */
  h2 { font-size: 0.95rem; margin: 18px 0 6px; color: #a394c7; }
  select { background: #1c1830; color: #eae6f5; border: 1px solid rgba(160,140,255,0.3);
    border-radius: 6px; padding: 2px 6px; font-size: 0.78rem; max-width: 340px; }
  .muted { color: #8a7fb0; } #err { color: #ff8080; } #note { color: #ffd76b; font-size: 0.82rem; }
  /* Memories — saved builds. One card per slot, kept to the same pill/chip
     language as the bar so the page still reads as one thing. */
  .mem { display: flex; gap: 10px; flex-wrap: wrap; margin: 0 0 12px; }
  .slot { flex: 1 1 240px; min-width: 240px; background: rgba(255,255,255,0.02);
    border: 1px solid rgba(160,140,255,0.18); border-radius: 10px; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 6px; }
  .slot.filled { border-color: rgba(255,215,107,0.35); }
  .shead { display: flex; align-items: center; gap: 8px; }
  .num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px;
    border-radius: 50%; background: rgba(160,140,255,0.15); color: #a394c7; font-size: 0.7rem; flex: none; }
  .snm { font-weight: 700; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot.filled .snm { color: #ffd76b; }
  .meta { font-size: 0.72rem; color: #8a7fb0; }
  .srow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: auto; }
  .srow .btn-respec, .srow .btn-go { padding: 4px 10px; font-size: 0.72rem; }
  /* Three roles, three colours: violet commits (Load, Save Build), outline is
     secondary (Overwrite, Rename), red is destructive (Delete). Load used to
     borrow .btn-save's salmon, which put the safe action and the irreversible
     one in the same red family — the salmon stays on the bar's Save Changes,
     which is the tree's own primary and a different thing entirely. */
  .btn-go { font: inherit; font-size: 0.78rem; font-weight: 600; color: #fff; background: #7c5cff;
    border: 1px solid #7c5cff; border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .btn-go:hover:not(:disabled) { background: #9375ff; border-color: #9375ff; }
  .danger { color: #ff6b6b; border-color: rgba(255,59,78,0.45); }
  .danger:hover { background: #ff3b4e; border-color: #ff3b4e; color: #fff; }
  .mname { flex: 1 1 120px; min-width: 0; background: #1c1830; color: #eae6f5;
    border: 1px solid rgba(160,140,255,0.3); border-radius: 999px; padding: 4px 10px; font-size: 0.72rem; }
</style>
</head>
<body>
  <h1>🌳 Passives <button class="chip" style="cursor:pointer" onclick="load()" title="Refresh">🔄</button></h1>
  <div class="bar" id="bar"></div>
  <div id="err"></div>
  <div id="note"></div>
  <h2 id="memHead" style="display:none">🧠 Memories <span class="muted" style="font-weight:400">— saved builds, free to swap out of combat</span></h2>
  <div class="mem" id="mem"></div>
  <h2 id="golemHead" style="display:none">🗿 Golem Slots <span class="muted" style="font-weight:400">— Elementalist only, one type per Golem Master slot</span></h2>
  <div class="mem" id="golems"></div>
  <div id="legend"></div>
  <div id="stage"></div>
  <div id="secBar" class="bar"></div>
  <div id="secStage"></div>

<script src="/tree.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  $('legend').innerHTML = PodTree.legend;

  async function api(endpoint, fields) {
    const r = await fetch('/api/action', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ endpoint, fields }) }).then(r => r.json());
    // The bridge decodes the site's ?passive_failed= redirect into `reason` —
    // without it a refused allocate/load looked like a success and did nothing.
    if (!r.ok) $('err').textContent = r.reason || `${endpoint} -> ${r.status}`;
    return r;
  }
  // refresh now, then again once the server settles the action
  const refresh = () => { load(); setTimeout(load, 800); };

  // Archetype switcher — the site's /change-archetype select, as a bar chip.
  // Re-added after every bar re-render (load() wipes #bar's innerHTML).
  //
  // /api/me is a full scrape of the game's dashboard (~290ms, ~16KB measured),
  // and the only thing this page wants from it is the class list, which cannot
  // change without a reload — picking a new class calls location.reload(), and
  // nothing else here touches it. So fetch it ONCE and rebuild the chip from
  // the cached copy on every later load. refresh() runs load() twice, so this
  // was four dashboard scrapes per action for a dropdown that never moved.
  let meCache = null;
  async function loadArchetype() {
    let me = meCache;
    if (!me) { try { me = meCache = await fetch('/api/me').then(r => r.json()); } catch { return; } }
    if (me.name) document.title = `${GAME_NAME} — Passives — ${me.name}`;
    const a = me.archetype;
    if (!a || !a.options?.length || $('archSel')) return;
    const cur = a.options.find(o => o.selected)?.value;
    const wrap = document.createElement('span');
    wrap.className = 'chip';
    wrap.innerHTML = `Class <select id="archSel">` +
      a.options.map(o => `<option value="${esc(o.value)}"${o.selected ? ' selected' : ''}>${esc(o.label)}</option>`).join('') + `</select>`;
    $('bar').appendChild(wrap);
    $('archSel').onchange = async () => {
      const v = $('archSel').value;
      if (v === cur) return;
      if (!confirm(`Change archetype to ${v}?`)) { $('archSel').value = cur; return; }
      await api('change-archetype', { archetype: v });
      location.reload(); // whole tree changes with the class
    };
  }

  async function load() {
    $('err').textContent = '';
    let p;
    try { p = await fetch('/api/passives').then(r => r.json()); }
    catch { $('err').textContent = 'Can\'t reach the game right now'; loadArchetype(); return; } // still sets the title (+ class chip) if /api/me works

    $('bar').innerHTML =
      `<span class="chip">🪓 <strong>${esc(p.points)}</strong></span>
       <span id="zoom"></span>
       <button class="btn-save" id="save" ${p.canSave ? '' : 'disabled'}>Save Changes</button>
       ${p.canReset ? '<button class="btn-respec" id="reset">Reset Preview</button>' : ''}
       <button class="btn-respec" id="respec">${esc(p.respecLabel)}</button>
       ${p.dirty ? '<span class="chip" style="color:#ffd76b;border-color:rgba(255,215,107,0.4)">Unsaved Changes</span>' : ''}`;
    PodTree.mountZoom($('zoom')); // tree-only zoom; both trees share one level
    $('save').onclick = async () => { await api('passives/save', {}); refresh(); };
    loadArchetype(); // class switcher chip (async, appended to the bar)
    const rst = $('reset');
    if (rst) rst.onclick = async () => { await api('passives/reset', {}); refresh(); }; // discard unsaved allocations
    // Respec warning: the game clears the PRIMARY tree only (a known,
    // owner-acknowledged bug in respec_passive_tree) while charging the full
    // free-token/1000-dust cost, so a Split Personality build loses the dust
    // and keeps its 2nd-class points spent against the shared pool. Say so
    // before the click rather than after the refund doesn't arrive.
    const secondarySpent = (p.secondary?.nodes || [])
      .some(n => +(String(n.rank || '').match(/^(\d+)\s*\//) || [])[1] > 0);
    $('respec').onclick = async () => {
      const warn = secondarySpent
        ? '\n\nWarning: the game only refunds your PRIMARY tree. Points already spent in your 2nd class tree stay spent, and you are charged in full either way.'
        : '';
      if (!confirm('Respec — reset all points?' + warn)) return;
      await api('passives/respec', {}); refresh();
    };
    renderMemories(p.memories);
    renderGolems(p.golems);

    // Both trees allocate through the same endpoint; `secondary` is the only
    // thing that tells the server which one the point lands in.
    const onAllocate = async (n, delta) => (await api('passives/allocate',
      { node_key: n.key, secondary: n.secondary ? 'true' : 'false', delta: String(delta) })).ok;
    const wiring = { onAllocate, onDone: refresh };
    PodTree.render($('stage'), p, wiring);
    renderSecondary(p.secondary, wiring);
  }

  // 2nd class (Split Personality). The site only renders this while the unique
  // is equipped, so `null` means "no such thing right now" — not an error.
  function renderSecondary(s, wiring) {
    if (!s) { $('secBar').innerHTML = ''; PodTree.render($('secStage'), { stage: { w: 0, h: 0 }, nodes: [] }); return; }
    const cur = s.options.find(o => o.selected)?.value || '';
    $('secBar').innerHTML = `<h2 style="width:100%">🧠 2nd Class — Split Personality</h2>
      <span class="chip">Class <select id="secSel">
        ${cur ? '' : '<option value="">— pick one —</option>'}
        ${s.options.map(o => `<option value="${esc(o.value)}"${o.selected ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
      </select></span>
      <span class="chip muted">Points come from the same pool as your primary tree.</span>`;
    $('secSel').onchange = async () => {
      const v = $('secSel').value;
      if (!v || v === cur) return;
      if (!confirm(`Set your 2nd class to ${v}?`)) { $('secSel').value = cur; return; }
      // Refusals arrive as ?passive_failed=<reason>; the bridge decodes that
      // into r.reason for every endpoint now, and api() has already shown it.
      const r = await api('passives/set-secondary', { archetype: v });
      if (!r.ok) { $('secSel').value = cur; return; }
      refresh();
    };
    PodTree.render($('secStage'), s, wiring);
  }
  // Memories — the site's saved-build slots (docs/memories_spec.md). Slot
  // identity comes from the site, never from our array index: an empty slot 1
  // beside a filled slot 3 has to stay slot 3. Empty slots always render —
  // they're the feature's only entry point.
  function renderMemories(mem) {
    const has = !!(mem && mem.length);
    $('memHead').style.display = has ? '' : 'none';
    $('mem').innerHTML = !has ? '' : mem.map(m => m.filled ? `
      <div class="slot filled">
        <div class="shead"><span class="num">${m.slot + 1}</span><span class="snm" title="${esc(m.name)}">${esc(m.name)}</span></div>
        <div class="meta">${esc(m.meta)}</div>
        <div class="srow">
          <button class="btn-go" data-act="load" data-slot="${m.slot}">Load</button>
          <button class="btn-respec" data-act="over" data-slot="${m.slot}" data-name="${esc(m.name)}">Overwrite</button>
          <button class="btn-respec danger" data-act="del" data-slot="${m.slot}">Delete</button>
        </div>
        <div class="srow">
          <input class="mname" id="mn${m.slot}" maxlength="150" value="${esc(m.name)}" aria-label="Rename Memory ${m.slot + 1}">
          <button class="btn-respec" data-act="rename" data-slot="${m.slot}" data-name="${esc(m.name)}">Rename</button>
        </div>
      </div>` : `
      <div class="slot empty">
        <div class="shead"><span class="num">${m.slot + 1}</span><span class="snm muted">Empty slot</span></div>
        <div class="meta">Saves your class, both trees and golem types.</div>
        <div class="srow">
          <input class="mname" id="mn${m.slot}" maxlength="150" placeholder="${esc(m.placeholder)}">
          <button class="btn-go" data-act="save" data-slot="${m.slot}">Save Build</button>
        </div>
      </div>`).join('');
    $('mem').querySelectorAll('button[data-act]').forEach(b => b.onclick = () => memAction(b));
  }

  // Golem slots — Elementalist only, and only once Golem Master is ranked, so
  // the whole card stays hidden for every other class. Same slot-identity rule
  // as Memories: the number comes from the site, never from our index. Setting
  // a type is instant and free, so no confirm.
  function renderGolems(golems) {
    const has = !!(golems && golems.length);
    $('golemHead').style.display = has ? '' : 'none';
    $('golems').innerHTML = !has ? '' : golems.map(g => `
      <div class="slot filled">
        <div class="shead"><span class="num">${g.slot + 1}</span><span class="snm">${esc(g.label)}</span></div>
        <div class="srow">
          <select class="mname" id="gt${g.slot}" aria-label="Type for ${esc(g.label)}">
            ${g.options.map(o => `<option value="${esc(o.value)}"${o.value === g.type ? ' selected' : ''}>${esc(o.label)}</option>`).join('')}
          </select>
          <button class="btn-go" data-golem="${g.slot}">Set</button>
        </div>
      </div>`).join('');
    $('golems').querySelectorAll('button[data-golem]').forEach(b => b.onclick = async () => {
      const slot = b.dataset.golem;
      await api('passives/set-golem-type', { slot, golem_type: $('gt' + slot).value });
      refresh();
    });
  }

  // One handler for all five slot actions — they differ only in endpoint,
  // fields and which confirmation they need. A load can succeed and STILL have
  // something to say (class changed, stale nodes refunded, 2nd tree skipped
  // because Split Personality came off), which arrives as r.note.
  async function memAction(b) {
    const slot = b.dataset.slot, act = b.dataset.act;
    $('note').textContent = '';
    let endpoint, fields;
    if (act === 'load') { endpoint = 'passives/memories/load'; fields = { slot }; }
    else if (act === 'save') { endpoint = 'passives/memories/save'; fields = { slot, name: ($('mn' + slot).value || '').trim() }; }
    else if (act === 'over') {
      if (!confirm('Overwrite this Memory with your current build?')) return;
      endpoint = 'passives/memories/save'; fields = { slot, name: b.dataset.name };
    } else if (act === 'rename') {
      // An inline input, NOT window.prompt() — Electron doesn't implement prompt
      // and silently no-ops it, which is exactly how this shipped broken. Same
      // note lives on index.html's feedback composer.
      const v = ($('mn' + slot).value || '').trim();
      if (!v || v === b.dataset.name) return; // nothing typed, or unchanged
      endpoint = 'passives/memories/rename'; fields = { slot, name: v };
    } else {
      if (!confirm('Delete this Memory? This cannot be undone.')) return;
      endpoint = 'passives/memories/delete'; fields = { slot };
    }
    const r = await api(endpoint, fields);
    refresh();
    if (r.note) $('note').textContent = r.note; // survives load(), which only clears #err
  }

  load();
</script>
<script src="/tooltip.js"></script>
<script src="/autoreload.js"></script>
</body>
</html>
