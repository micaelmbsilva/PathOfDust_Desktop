<!-- Path of Dust — public ladder & builds. Single file, no build step, no deps.
     Served by server/index.js (express.static). Data: /api/ladder, /api/build/:name.
     Everything rendered here is player-supplied → DOM APIs only, no innerHTML. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path of Dust — Ladder</title>
<style>
  /* Committed dark look (poe.ninja-adjacent). Chart colors per dataviz palette. */
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --border: rgba(255,255,255,0.10);
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --baseline: #383835;
    --series-1: #3987e5; /* class bars */ --series-2: #d95926; /* level bars */
    --accent: #3987e5;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink-2);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { color: var(--ink); font-size: 22px; margin: 0 0 4px; }
  h1 a { color: var(--ink); }
  h2 { color: var(--ink); font-size: 15px; margin: 28px 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  .card { background: var(--surface); border: 1px solid var(--border);
          border-radius: 8px; padding: 14px 16px; }
  .status { color: var(--muted); padding: 40px 0; text-align: center; }
  #fbadge { position: fixed; right: 16px; bottom: 16px; z-index: 9; text-decoration: none;
            background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
            padding: 8px 14px; box-shadow: 0 4px 16px rgba(0,0,0,.35); }

  /* CSS bar chart: label | track | count. Thin bars, rounded data end. */
  .chart { display: grid; grid-template-columns: max-content 1fr max-content;
           gap: 6px 10px; align-items: center; }
  .chart .lbl { color: var(--ink-2); }
  .chart .num { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chart .track { border-left: 2px solid var(--baseline); height: 12px; }
  .chart .bar { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
       border-bottom: 1px solid var(--baseline); padding: 6px 8px; }
  td { padding: 7px 8px; border-bottom: 1px solid var(--grid); }
  td.r, th.r { text-align: right; font-variant-numeric: tabular-nums; }
  tr:hover td { background: rgba(255,255,255,0.03); }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 700px) { .grid2 { grid-template-columns: 1fr; } }

  /* Build page */
  .statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
              gap: 4px 24px; }
  .statgrid div { display: flex; justify-content: space-between; gap: 12px;
                  border-bottom: 1px solid var(--grid); padding: 3px 0; }
  .statgrid b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }
  .gear { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .item .slot { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .item .name { color: var(--ink); font-weight: 600; margin: 2px 0 6px; }
  .item .mod { color: var(--accent); font-size: 13px; }
  .item .implicit { color: var(--ink-2); font-size: 13px; font-style: italic; }
  .item .primary { color: var(--ink-2); font-size: 13px; }
  .badge { display: inline-block; font-size: 11px; color: var(--ink-2);
           border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; margin-left: 6px; }
  .badge.sacred { color: #7fd4ff; border-color: #7fd4ff55; }
  .badge.unique { color: #ffd76b; border-color: #ffd76b55; } /* game's .gear-name-unique gold */
  .item .implicit.gold { color: #ffd76b; font-style: normal; } /* unique (Celestial) line */
  .badge.krangled { color: #d55181; border-color: #d5518155; }
  .passives li { padding: 2px 0; }
  .passives .rank { color: var(--muted); }

  /* Builds, OP watchlist, tree browser */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-block; font-size: 12px; color: var(--ink-2); background: rgba(255,255,255,0.04);
          border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; }
  a.chip { color: var(--accent); }
  span.chip { cursor: pointer; }
  .chip.on { color: var(--accent); border-color: var(--accent); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  .bname { color: var(--ink); font-weight: 600; font-size: 15px; }
  .btag { color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  .card p { margin: 10px 0 0; }
  .gearline b { color: var(--ink); font-weight: 600; }
  .stack { display: grid; gap: 12px; }
  details.skill { padding: 0; }
  details.skill summary { cursor: pointer; padding: 12px 16px; color: var(--ink-2); }
  details.skill summary b { color: var(--ink); }
  details.skill[open] summary { border-bottom: 1px solid var(--grid); }
  .spec { padding: 10px 16px 12px 28px; border-bottom: 1px solid var(--grid); }
  .spec:last-child { border-bottom: 0; }
  .spec b { color: var(--accent); }
  .modn { margin: 6px 0 0 20px; font-size: 13px; }
  .modn b { color: var(--ink-2); }

  /* Game-replica tree canvas (colors ported from the game's own /passives page) */
  .gwrap { overflow-x: auto; background: #0c0a16; border: 1px solid var(--border); border-radius: 10px; padding: 18px 10px; }
  .gstage { position: relative; margin: 0 auto; }
  .gstage svg { position: absolute; left: 0; top: 0; pointer-events: none; shape-rendering: crispEdges; }
  .gnode { position: absolute; transform: translate(-50%, -50%); background: #1c1830;
           border: 1.5px solid rgba(160,140,255,0.18); border-radius: 10px; padding: 6px 8px;
           text-align: center; cursor: help; color: #eae6f5; }
  .gnode .gname { font-weight: 700; font-size: 12.5px; line-height: 1.2; }
  .gnode.kind-skill .gname { font-size: 13.5px; }
  .gnode.kind-mod .gname { font-size: 11.5px; }
  .gnode .gkind { font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: #766a99; }
  .gnode.kind-root { background: linear-gradient(160deg, rgba(255,59,78,0.16), rgba(28,24,48,0.9));
                     border-color: rgba(255,59,78,0.5); padding: 10px 14px; }
  .gnode.pick { border-color: rgba(255,59,78,0.55); box-shadow: 0 0 0 1px rgba(255,59,78,0.12), 0 8px 22px rgba(255,59,78,0.12); }
  .gnode.pick.gold { border-color: rgba(255,215,107,0.6); box-shadow: 0 0 0 1px rgba(255,215,107,0.15), 0 8px 22px rgba(255,215,107,0.12); }
  .gnode.dead { opacity: 0.45; border-style: dashed; }
  .gdots { display: flex; justify-content: center; gap: 3px; margin-top: 5px; }
  .gdot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid #766a99; }
  .gdot.on { background: #ff3b4e; border-color: #ff3b4e; box-shadow: 0 0 6px rgba(255,59,78,0.7); }
  .gdot.gold { background: #ffd76b; border-color: #ffd76b; box-shadow: 0 0 6px rgba(255,215,107,0.7); }

  /* Visual passive tree */
  .tskill { padding: 14px 16px; }
  .tnode { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 8px;
           padding: 6px 10px; font-size: 13px; cursor: help; }
  .tnode b { color: var(--ink); font-size: 13px; }
  .tnode .max { color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
  .tnode.pick { border-color: var(--series-1); box-shadow: 0 0 0 1px #3987e533; }
  .tnode.pick .take { color: var(--series-1); font-weight: 600; margin-left: 6px; }
  .tnode.dead { border-style: dashed; opacity: 0.55; }
  .tskill > .tnode { display: inline-block; margin-bottom: 4px; }
  .tspecs { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .tcol { padding: 10px 0 0 12px; border-left: 2px solid var(--baseline); display: grid; gap: 6px; align-content: start; }
  .tcol .tnode.mod { margin-left: 14px; font-size: 12.5px; }

  /* Build progression + roll priority */
  .lvrow { display: flex; align-items: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  button { font: inherit; color: var(--ink); background: var(--surface); cursor: pointer;
           border: 1px solid var(--border); border-radius: 8px; padding: 8px 14px; }
  button:disabled { color: var(--muted); cursor: default; }
  /* Admin panel: tab bar above every keyed page, and the overview's stat tiles. */
  .adminnav { margin: 0 0 20px; padding-bottom: 12px; border-bottom: 1px solid var(--grid); }
  .lvrow input.wide { width: auto; flex: 1 1 220px; } /* .lvrow input is 70px — a name needs room */
  .tile { display: block; text-decoration: none; }
  .tile .big { color: var(--ink); font-size: 26px; font-weight: 600; margin-top: 4px; }
  a.tile:hover { border-color: var(--accent); }
  .lvrow input { width: 70px; background: var(--surface); color: var(--ink); border: 1px solid var(--border);
                 border-radius: 6px; padding: 4px 8px; font: inherit; }
  .steps { list-style: none; margin: 8px 0 0; padding: 0; }
  .steps li { padding: 3px 0 3px 22px; position: relative; }
  .steps li::before { content: '○'; position: absolute; left: 2px; color: var(--muted); }
  .steps li.done::before { content: '●'; color: var(--series-1); }
  .steps li.part::before { content: '◐'; color: var(--series-2); }
  .steps li.done b { color: var(--ink); }
  .steps li.todo { color: var(--muted); }
  .steps .lvat { color: var(--series-2); font-size: 12px; }
  .rolls { margin: 6px 0 0; padding-left: 20px; }
  .rolls li { margin: 6px 0; }
  .rolls b { color: var(--ink); }
  .rolls .why { color: var(--ink-2); font-size: 13px; }
  .badge.top { color: #eda100; border-color: #eda10055; margin-left: 8px; }
</style>
</head>
<body>
<main id="app"><p class="status">Loading…</p></main>
<footer id="foot" class="sub" style="max-width:900px;margin:0 auto;padding:0 16px 28px;border-top:1px solid var(--grid);padding-top:12px"></footer>
<script>
'use strict';
const app = document.getElementById('app');

// DOM builder — attacker-controlled strings only ever become text nodes or
// setAttribute values, never markup.
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) n.setAttribute(k, String(v));
  for (const kid of kids.flat(Infinity)) if (kid != null && kid !== false && kid !== '')
    n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
}
// Keyed pages are tabs of the admin panel, so the nav belongs to view() itself —
// a page that re-renders in place (the advisor's role chips) would otherwise
// drop it. adminNav is defined further down; view only calls it at render time.
const KEYED_ROUTE = /^#\/(admin|feedback|watchlist|intel|advisor\/)/;
const view = (...kids) => {
  app.replaceChildren(el('div', null, kids));
  if (KEYED_ROUTE.test(location.hash)) app.prepend(adminNav());
};
const arr = (x) => Array.isArray(x) ? x : [];
const str = (x) => (typeof x === 'string' || typeof x === 'number') ? String(x) : '';

function seenDay(ts) { // last_seen arrives day-truncated
  const d = new Date(ts); if (isNaN(d)) return '';
  const days = Math.floor((Date.now() - d) / 86400000);
  return days <= 0 ? 'today' : days === 1 ? 'yesterday' : days < 60 ? days + 'd ago'
       : d.toISOString().slice(0, 10);
}

function barChart(rows, color) { // rows: [{label: string|Node, count, num?}]
  const max = Math.max(1, ...rows.map(r => r.count));
  return el('div', { class: 'chart' }, rows.map(r => [
    el('span', { class: 'lbl' }, r.label instanceof Node ? r.label : str(r.label) || '—'),
    el('div', { class: 'track' },
      el('div', { class: 'bar', style: `width:${(100 * r.count / max).toFixed(1)}%;background:${color}` })),
    el('span', { class: 'num' }, r.num != null ? r.num : r.count),
  ]));
}
const classLink = (a) => el('a', { href: '#/class/' + encodeURIComponent(str(a)) }, str(a));

// Static curated data (builds.json = suggestions + OP watchlist, passives.json = full trees)
let STATIC;
function staticData() {
  const j = (u) => fetch(u).then(r => r.ok ? r.json() : null).catch(() => null);
  return STATIC || (STATIC = Promise.all([j('builds.json'), j('passives.json')])
    .then(([builds, passives]) => ({ builds, passives })));
}

// Role-aware "power" score: LVL alone doesn't explain who's on top.
// Classes can fill multiple roles (kit-derived from the trees); the first entry
// is the default. Cleric heals but has no self-mitigation — healer only.
const ROLES = { Warrior: ['tank', 'dps'], Paladin: ['healer', 'tank'], Druid: ['healer', 'tank'],
  Monk: ['dps', 'tank'], Cleric: ['healer'] };
const rolesOf = (cls, passives) => (Object.hasOwn(ROLES, cls) ? ROLES[cls] : null)
  || ((passives && passives[cls] && passives[cls].role) === 'Support' ? ['healer'] : ['dps']);
// The single role used for the Power metric / stat buckets — data-driven for
// hybrids: an actively-healing Paladin/Druid shows eHPS, a tank-specced one eHP.
const displayRole = (p, passives) => {
  const rs = rolesOf(p.archetype, passives);
  const s = (p.stats && typeof p.stats === 'object') ? p.stats : {};
  if (rs.includes('healer') && (rs.length === 1 || num(s.HPS) > num(s.DPS))) return 'healer';
  return rs.find(x => x !== 'healer') || rs[0];
};
const num = (v) => { const m = String(v == null ? '' : v).replace(/,/g, '').match(/^([\d.]+)\s*([KMB])?/i);
  return m ? +m[1] * ({ K: 1e3, M: 1e6, B: 1e9 }[(m[2] || '').toUpperCase()] || 1) : 0; };
const fmt = (n) => n >= 1e9 ? (n / 1e9).toFixed(1) + 'B' : n >= 1e6 ? (n / 1e6).toFixed(1) + 'M'
  : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(Math.round(n));
function power(p, passives) {
  const s = (p.stats && typeof p.stats === 'object') ? p.stats : {};
  const role = displayRole(p, passives);
  if (role === 'healer') {
    const val = num(s.HPS) * (1 + num(s['Lingering Effect']) / 100);
    return { val, unit: 'eHPS', why: `Healer: HPS ${s.HPS || '0'} × (1 + lingering ${s['Lingering Effect'] || '0'}). Healing power (${s['Healing Power'] || '?'}) is already baked into HPS.` };
  }
  if (role === 'tank') {
    const val = num(s.Health) * (1 + num(s['Reduced Dmg Taken']) / 100) * (1 + num(s.Block) / 200)
      * (1 + num(s.Evasion) / 100) * (1 + num(s.Intervene) / 100);
    return { val, unit: 'eHP', why: `Tank: HP ${s.Health || '0'} × dmg reduction ${s['Reduced Dmg Taken'] || '0'} × block ${s.Block || '0'} (half weight — blocked hits still land) × evasion ${s.Evasion || '0'} × intervene ${s.Intervene || '0'}.` };
  }
  return { val: num(s.DPS), unit: 'DPS', why: `DPS role: raw DPS ${s.DPS || '0'}.` };
}

// Per-role stat averages ("advanced view"): avg + best of the stats that matter
// for each role, computed from the same ladder rows.
function advStats(players, passives) {
  const SETS = {
    dps: ['DPS', 'Health', 'Crit Chance', 'Increased Dmg Dealt', 'Increased Crit Dmg Dealt', 'Splash', 'Evasion'],
    tank: ['Health', 'Reduced Dmg Taken', 'Block', 'Evasion', 'Intervene', 'DPS'],
    healer: ['HPS', 'Healing Power', 'Lingering Effect', 'Health', 'Intervene', 'DPS'],
  };
  const TITLES = { dps: 'DPS players', tank: 'Tanks', healer: 'Healers' };
  const byRole = { dps: [], tank: [], healer: [] };
  for (const p of players) byRole[displayRole(p, passives)].push(p);
  const cards = Object.keys(SETS).map(role => {
    const ps = byRole[role];
    if (!ps.length) return null;
    const rows = SETS[role].map(key => {
      const vals = ps.map(p => p.stats && p.stats[key]).filter(v => v != null && v !== '');
      if (!vals.length) return null;
      const nums = vals.map(num);
      const pct = vals.filter(v => /%/.test(v)).length > vals.length / 2;
      const show = n => pct ? (Math.round(n * 10) / 10) + '%' : fmt(n);
      return el('tr', null, el('td', null, key),
        el('td', { class: 'r' }, show(nums.reduce((a, b) => a + b, 0) / nums.length)),
        el('td', { class: 'r' }, show(Math.max(...nums))));
    }).filter(Boolean);
    if (!rows.length) return null;
    return el('div', { class: 'card' },
      el('div', { class: 'bname' }, `${TITLES[role]} · ${ps.length}`),
      el('table', null,
        el('thead', null, el('tr', null, el('th', null, 'Stat'), el('th', { class: 'r' }, 'Avg'), el('th', { class: 'r' }, 'Best'))),
        el('tbody', null, rows)));
  }).filter(Boolean);
  if (!cards.length) return null;
  return el('details', { class: 'card skill' },
    el('summary', null, el('b', null, 'Advanced stats'), ' — per-role averages across all tracked players'),
    el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;padding:14px 16px' }, cards));
}

function playersTable(players, passives) {
  const rows = players.map((p, i) => ({ p, rank: i + 1, pw: power(p, passives) }));
  const classes = [...new Set(rows.map(r => str(r.p.archetype)).filter(Boolean))];
  const wrap = el('div', null);
  let sortKey = 'level', dir = -1, cls = null, roleF = null;
  const ROLES = [['dps', '🗡️ DPS'], ['tank', '🛡️ Tanks'], ['healer', '🩹 Healers']];
  const get = (r, k) => k === 'name' ? str(r.p.name).toLowerCase() : k === 'class' ? str(r.p.archetype)
    : k === 'power' ? r.pw.val : k === 'seen' ? str(r.p.last_seen) : (+r.p.level || 0);
  function render() {
    const shown = rows.filter(r => (!cls || str(r.p.archetype) === cls)
        && (!roleF || rolesOf(r.p.archetype, passives).includes(roleF)))
      .sort((a, b) => (get(a, sortKey) > get(b, sortKey) ? 1 : get(a, sortKey) < get(b, sortKey) ? -1 : 0) * dir);
    const th = (label, key, right) => {
      const e = el('th', { class: (right ? 'r ' : '') + 'sortable' }, label, sortKey === key ? (dir < 0 ? ' ▾' : ' ▴') : '');
      e.onclick = () => { dir = sortKey === key ? -dir : -1; sortKey = key; render(); };
      return e;
    };
    wrap.replaceChildren(
      el('div', { class: 'chips', style: 'margin:0 0 10px' }, [
        ...[[null, 'All'], ...ROLES].map(([r, label]) => {
          const e = el('span', { class: 'chip' + (r === roleF && (r || !cls) ? ' on' : '') }, label);
          e.onclick = () => { roleF = r; if (!r) cls = null; render(); };
          return e;
        }),
        ...classes.map(c => {
          const e = el('span', { class: 'chip' + (c === cls ? ' on' : '') }, c);
          e.onclick = () => { cls = c === cls ? null : c; render(); };
          return e;
        })]),
      el('table', null,
        el('thead', null, el('tr', null, th('Name', 'name'),
          th('Class', 'class'), th('Level', 'level', true), th('Power', 'power', true), th('Last seen', 'seen'))),
        el('tbody', null, shown.map(r => el('tr', null,
          el('td', null, el('a', { href: '#/build/' + encodeURIComponent(str(r.p.name)) }, str(r.p.name))),
          el('td', null, r.p.archetype ? classLink(r.p.archetype) : '—'),
          el('td', { class: 'r' }, str(r.p.level) || '—'),
          el('td', { class: 'r', title: r.pw.why }, r.pw.val ? fmt(r.pw.val) + ' ' + r.pw.unit : '—'),
          el('td', null, seenDay(r.p.last_seen)))))));
  }
  render();
  return wrap;
}

function agoText(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '—';
  const mins = Math.max(0, Math.round((Date.now() - d) / 60000));
  const rel = mins < 1 ? 'just now' : mins < 60 ? `${mins} min ago` : mins < 2880 ? `${Math.round(mins / 60)}h ago` : `${Math.round(mins / 1440)}d ago`;
  return `${d.toLocaleString()} (${rel})`;
}
// Just the relative half — what a stat tile has room for.
const agoShort = (iso) => agoText(iso).replace(/^.*\((.*)\)$/, '$1');
const plural = (n, one) => `${n} ${one}${n === 1 ? '' : 's'}`;

// Watermark footer on every page: deploy rev, app interface rev, and data freshness.
let META = null;
async function renderFoot() {
  if (!META) { try { const r = await fetch('api/meta'); if (r.ok) META = await r.json(); } catch {} }
  if (!META) return;
  document.getElementById('foot').textContent =
    `rev ${str(META.rev)}${META.appRev ? ' · app interface v' + str(META.appRev) : ''}` +
    ` · site updated ${agoText(META.deployed)} · data fetched ${agoText(META.lastScrape || META.dbLatest)}`;
}

async function ladder() {
  const [r, { builds, passives }] = await Promise.all([fetch('api/ladder'), staticData()]);
  if (!r.ok) throw new Error('ladder ' + r.status);
  const { players, byClass, levels, total } = await r.json();
  view(
    el('h1', null, 'Path of Dust — Ladder'),
    el('p', { class: 'sub' }, `${total} players tracked · updates as players play`),
    passives ? el('div', { class: 'chips', style: 'margin:0 0 20px' },
      Object.keys(passives).map(c => el('a', { class: 'chip', href: '#/class/' + encodeURIComponent(c) }, c))) : null,
    el('div', { class: 'grid2' },
      el('div', { class: 'card' }, el('h2', { style: 'margin-top:0' }, 'Classes'),
        barChart(arr(byClass).map(c => ({ label: c.archetype ? classLink(c.archetype) : '—', count: c.count })), 'var(--series-1)')),
      el('div', { class: 'card' }, el('h2', { style: 'margin-top:0' }, 'Levels'),
        barChart(arr(levels).map(l => ({ label: `${l.bucket}–${l.bucket + 9}`, count: l.count })), 'var(--series-2)'))),

    playersTable(arr(players), passives),

}

// Hidden routes are keyed: append ?key=<SITE_KEY> once (e.g. #/watchlist?key=…),
// it's remembered locally and stripped from the URL. Server enforces it for the
// watchlist data; the advisor shares the same gate.
// Two keys: the site key opens the operator pages, the owner key opens the
// investigation on top of that (?owner=… once, same capture as ?key=…).
const siteKey = () => localStorage.getItem('pod.key') || '';
const ownerKey = () => localStorage.getItem('pod.owner') || '';
// The owner key rides in a header, not the query string — it is the privileged
// one, and query strings end up in proxy and access logs.
const ownerFetch = (path, opts) => fetch(path, { ...opts, headers: { 'x-pod-owner': ownerKey() } });
const keyDenied = () => view(el('p', { class: 'status' }, 'This page needs a key — open it once with ?key=… appended (owner pages: ?owner=…).'));
const ownerDenied = () => view(el('p', { class: 'status' }, 'Owner-only. Open once with ?owner=… appended.'));

// The keyed pages are one admin panel: route() prepends this bar to each of
// them, so they read as tabs rather than as unrelated hidden URLs.
const ADMIN_TABS = [['#/admin', 'Overview'], ['#/feedback', 'Feedback'],
  ['#/watchlist', 'Watchlist', true], ['#/intel', 'Investigation', true]];
const adminNav = () => el('div', { class: 'chips adminnav' },
  ADMIN_TABS.filter(([, , owner]) => !owner || ownerKey()).map(([href, label]) => el('a',
    { class: 'chip' + (location.hash === href ? ' on' : ''), href }, label)),
  el('a', { class: 'chip', href: '#/' }, '← Ladder'));

// Hidden route: #/watchlist — the OP interactions list, no nav links to it.
// Owner-only (x-pod-owner header, like #/intel). Filterable by type and class.
async function watchlist() {
  const r = await ownerFetch('api/watchlist');
  if (r.status === 403) return keyDenied();
  if (!r.ok) throw new Error('watchlist ' + r.status);
  const { interactions } = await r.json();
  const items = arr(interactions);
  const types = [...new Set(items.map(i => str(i.type)).filter(Boolean))];
  const classes = [...new Set(items.flatMap(i => arr(i.classes).map(str)))].sort();
  let typeF = null, clsF = null;
  const wrap = el('div', null);
  function render() {
    const shown = items.filter(i => (!typeF || str(i.type) === typeF) && (!clsF || arr(i.classes).map(str).includes(clsF)));
    const chip = (label, on, fn) => { const e = el('span', { class: 'chip' + (on ? ' on' : '') }, label); e.onclick = fn; return e; };
    wrap.replaceChildren(
      el('div', { class: 'chips', style: 'margin:0 0 8px' }, [
        chip('All types', !typeF, () => { typeF = null; render(); }),
        ...types.map(t => chip(t, typeF === t, () => { typeF = typeF === t ? null : t; render(); }))]),
      el('div', { class: 'chips', style: 'margin:0 0 14px' }, [
        chip('All classes', !clsF, () => { clsF = null; render(); }),
        ...classes.map(c => chip(c, clsF === c, () => { clsF = clsF === c ? null : c; render(); }))]),
      shown.length
        ? el('div', { class: 'stack' }, shown.map(i => el('div', { class: 'card' },
            el('div', { class: 'bname' }, str(i.title)),
            el('div', { class: 'chips', style: 'margin:6px 0 0' },
              i.type ? el('span', { class: 'chip' }, str(i.type)) : null,
              arr(i.classes).map(c => el('a', { class: 'chip', href: '#/class/' + encodeURIComponent(str(c)) }, str(c)))),
            el('p', null, str(i.text)))))
        : el('p', { class: 'status' }, 'Nothing matches this filter.'));
  }
  render();
  view(el('h1', null, 'OP interactions watchlist'), wrap); // back link lives in the admin nav
}

// Hidden route: #/feedback — operator inbox for in-app feedback plus recent app
// errors. Same key gate as the watchlist; no nav links to it.
async function feedbackData(since) {
  const r = await fetch('api/feedback?key=' + encodeURIComponent(siteKey())
    + (since == null ? '' : '&since=' + since));
  if (r.status === 403) return null;
  if (!r.ok) throw new Error('feedback ' + r.status);
  return r.json();
}

function feedbackCard(x, kind) {
  return el('div', { class: 'card' },
    el('div', { class: 'bname' }, agoText(x.ts)),

async function feedbackView() {

// Unread pill, bottom-right of every page — only appears when a key is stored.
function badge(n) {
  const b = document.getElementById('fbadge');
  if (!n) return b && b.remove();
  (b || document.body.appendChild(el('a', { id: 'fbadge', href: '#/feedback' })))

}
async function checkFeedback() {
  if (!siteKey() || location.hash === '#/feedback') return;

// Hidden route: #/intel — the investigation console. Rescrapes every public
// source on demand and shows the newest findings; the analysis itself runs in
// Claude Code (the pod-investigate skill reads api/dossier and posts back to
// api/findings), so nothing here spends API credit. Keyed, no nav links to it.
async function intelData() {
  if (!ownerKey()) return null;
  const r = await ownerFetch('api/intel');
  if (r.status === 403) return null;
  if (!r.ok) throw new Error('intel ' + r.status);
  return r.json();
}

async function intel() {
  const d = await intelData();
  if (!d) return ownerDenied();
  const wrap = el('div', null);
  const paint = (data) => {
    const latest = data.latest;
    const btn = el('button', data.scraping ? { disabled: 'disabled' } : null,
      data.scraping ? 'Pulling…' : 'Pull fresh game data');
    btn.onclick = async () => {
      btn.disabled = true;
      await ownerFetch('api/rescrape', { method: 'POST' });
      poll();
    };
    // Wrapped in one element: replaceChildren stringifies arrays and nulls,
    // el() flattens them.
    wrap.replaceChildren(el('div', null, [
      el('div', { class: 'card' },
        el('div', { class: 'lvrow' }, btn,
          el('span', { class: 'sub', style: 'margin:0' },
            data.scraping ? 'walking the roster, wiki and patch notes — a couple of minutes'
              : data.lastScrape ? `game data last pulled ${agoText(data.lastScrape)}`
              : 'no scrape has completed yet')),
        // Each scrape logs and swallows its own failure, so name what is missing
        // rather than letting an analysis run against a half-empty dossier.
        (data.sources && (!data.sources.wikiLoaded || !data.sources.patchNoteDates))
          ? el('p', { style: 'margin:12px 0 0' }, '⚠ ' + [
              !data.sources.wikiLoaded && 'the wiki has not loaded',
              !data.sources.patchNoteDates && 'no patch notes have loaded',
            ].filter(Boolean).join(' and ') + ' — the dossier is incomplete until a pull succeeds.') : null,
        el('p', { class: 'sub', style: 'margin:12px 0 0' },
          'Then run /pod-investigate in Claude Code: it reads the compiled dossier, hunts broken and OP interactions, and posts the findings back here — they become the watchlist and steer the advisor.'),
        latest ? el('p', { style: 'margin:12px 0 0' }, str(latest.summary)) : null,
        latest ? el('p', { class: 'sub', style: 'margin:8px 0 0' },
          `last investigation ${agoText(latest.ts)} · ${str(latest.model)}`)
          : el('p', { class: 'sub', style: 'margin:8px 0 0' }, 'No investigation yet — the watchlist is still the hand-curated file.')),
      latest && arr(latest.interactions).length ? [
        el('h2', null, `Interactions (${arr(latest.interactions).length})`),
        el('div', { class: 'stack' }, arr(latest.interactions).map(i => el('div', { class: 'card' },
          el('div', { class: 'bname' }, str(i.title)),
          el('div', { class: 'chips', style: 'margin:6px 0 0' },
            el('span', { class: 'chip' + (str(i.impact) === 'high' ? ' on' : '') }, str(i.impact)),
            i.type ? el('span', { class: 'chip' }, str(i.type)) : null,
            arr(i.classes).map(c => el('a', { class: 'chip', href: '#/class/' + encodeURIComponent(str(c)) }, str(c))),
            arr(i.rolls).map(r => el('span', { class: 'chip' }, str(r)))),
          el('p', null, str(i.text)),
          str(i.evidence) ? el('p', { class: 'sub', style: 'margin:8px 0 0' }, 'evidence: ' + str(i.evidence)) : null))),
      ] : null,
      latest && arr(latest.patterns).length ? [
        el('h2', null, 'Patterns'),
        el('div', { class: 'stack' }, arr(latest.patterns).map(p => el('div', { class: 'card' },
          el('div', { class: 'bname' }, str(p.title)),
          el('p', null, str(p.text)),
          str(p.evidence) ? el('p', { class: 'sub', style: 'margin:8px 0 0' }, 'evidence: ' + str(p.evidence)) : null))),
      ] : null,
      arr(data.patchNotes).length ? [
        el('h2', null, 'Patch notes'),
        el('div', { class: 'stack' }, arr(data.patchNotes).slice(0, 8).map(dt => el('div', { class: 'card' },
          el('div', { class: 'bname' }, str(dt.date)),
          arr(dt.entries).map(e => el('p', null, el('b', null, str(e.title)), ' — ', str(e.text)))))),
      ] : null,
    ]));
  };
  // Poll only while a scrape is in flight, and only while this page is open.
  async function poll() {
    if (location.hash !== '#/intel') return;
    try {
      const data = await intelData();
      if (!data) return;
      paint(data);
      if (data.scraping) setTimeout(poll, 10000);
    } catch {}
  }
  paint(d);
  if (d.scraping) setTimeout(poll, 10000);
  view(el('h1', null, 'Investigation'), wrap);
}

// Hidden route: #/admin — the panel's front page. Every number here is a link
// to the tab that acts on it; nothing is edited from this view.
async function admin() {
  const key = encodeURIComponent(siteKey());
  const seen = +localStorage.getItem('pod.fbseen') || 0;
  const owner = ownerKey();
  const [allR, unreadR, intelR, watchR] = await Promise.all([
    fetch('api/feedback?key=' + key + '&since=0'),
    fetch('api/feedback?key=' + key + '&since=' + seen),
    // Investigation and watchlist are owner-only: without that key the panel
    // simply doesn't mention them, rather than showing "unavailable" tiles.
    owner ? ownerFetch('api/intel') : Promise.resolve({ ok: false, status: 403 }),
    owner ? ownerFetch('api/watchlist') : Promise.resolve({ ok: false, status: 403 })]);
  if (allR.status === 403) return keyDenied();
  // null means the endpoint failed — say so rather than showing a confident zero.
  const body = async (r) => r.ok ? r.json().catch(() => null) : null;
  const [all, unreadJ, intel, watch] = await Promise.all([allR, unreadR, intelR, watchR].map(body));
  const total = all && +all.unread || (all ? 0 : null);
  const unread = unreadJ && +unreadJ.unread || (unreadJ ? 0 : null);
  const items = watch ? arr(watch.interactions) : null;
  const latest = intel && intel.latest;
  const byImpact = ['high', 'medium', 'low']
    .map(k => [k, arr(items).filter(i => str(i.impact) === k).length]).filter(([, n]) => n);

  // Jump straight to a player's advisor page — the one keyed view that needs an
  // argument, so it can't be a plain tab.
  const who = el('input', { type: 'text', placeholder: 'player name', class: 'wide' });
  const go = el('button', null, 'Open advisor');
  const open = () => { if (who.value.trim()) location.hash = '#/advisor/' + encodeURIComponent(who.value.trim()); };
  go.onclick = open;
  who.onkeydown = (e) => { if (e.key === 'Enter') open(); };

  const tile = (href, label, big, sub) => el('a', { class: 'card tile', href },
    el('div', { class: 'sub', style: 'margin:0' }, label),
    el('div', { class: 'big' }, big),
    el('div', { class: 'sub', style: 'margin:6px 0 0' }, sub));

  view(
    el('h1', null, 'Admin'),
    el('p', { class: 'sub' }, 'Admin tools in one place — watchlist, advisor and investigation need the owner key (?owner=…).'),
    el('div', { class: 'grid2' },
      tile('#/feedback', 'Feedback',
        total == null ? '—' : unread ? `${unread} new` : String(total),
        total == null ? 'unavailable' : unread ? `${total} total` : total ? 'all read' : 'nothing yet'),
      !owner ? null : tile('#/watchlist', 'Watchlist', items ? String(items.length) : '—',
        !items ? 'unavailable'
          : byImpact.length ? byImpact.map(([k, n]) => `${n} ${k}`).join(' · ') : 'hand-curated file'),
      !owner ? null : tile('#/intel', 'Investigation', latest ? agoShort(latest.ts) : '—',
        !intel ? 'unavailable'
          : latest ? `${plural(arr(latest.interactions).length, 'interaction')} · ${plural(arr(latest.patterns).length, 'pattern')}`
          : 'no investigation run yet'),
      !owner ? null : tile('#/intel', 'Game data',
        !intel ? '—' : intel.scraping ? 'pulling…' : intel.lastScrape ? agoShort(intel.lastScrape) : '—',
        !intel ? 'unavailable'
          : !intel.sources ? 'source status unknown'
          : (!intel.sources.wikiLoaded || !intel.sources.patchNoteDates) ? '⚠ wiki or patch notes missing'
          : `wiki loaded · ${plural(intel.sources.patchNoteDates, 'patch-note date')}`)),
    !owner ? null : [el('h2', null, 'Advisor'),
      el('div', { class: 'card' },
        el('div', { class: 'lvrow' }, who, go),
        el('p', { class: 'sub', style: 'margin:0' },
          'Scores every class against that player\'s actual gear, including the watchlist findings that name it.'))],
    owner && latest && str(latest.summary) ? [el('h2', null, 'Latest investigation'),
      el('div', { class: 'card' }, el('p', { style: 'margin:0' }, str(latest.summary)),
        el('p', { class: 'sub', style: 'margin:8px 0 0' }, `${agoText(latest.ts)} · ${str(latest.model)}`))] : null);
}

function itemCard(it) {

async function build(name) {

// Passive points by level (fitted empirically: lv67=17, lv84/85=22, lv91=23).
const PTS = (lv) => 1 + Math.floor(Math.max(1, +lv || 1) / 4);

function buildCards(archetype, builds) {
  const b = builds && builds.classes && builds.classes[archetype];
  if (!b || !arr(b.builds).length) return null;
  const input = el('input', { type: 'number', min: 1, max: 120, value: localStorage.getItem('pod.lv') || 85 });
  const holder = el('div', { class: 'stack' });
  function render() {
    const pts = PTS(input.value);
    localStorage.setItem('pod.lv', input.value);
    holder.replaceChildren(...arr(b.builds).map(x => {
      let used = 0;
      const steps = arr(x.order).map(st => {
        const from = used; used += (+st.r || 0);
        const state = used <= pts ? 'done' : from < pts ? 'part' : 'todo';
        return el('li', { class: 'step ' + state },
          el('b', null, str(st.n)), ` ${state === 'done' ? st.r : state === 'part' ? pts - from : 0}/${str(st.r)}`,
          state !== 'done' ? el('span', { class: 'lvat' }, ` — full at Lv ${(used - 1) * 4}`) : null);
      });
      return el('div', { class: 'card' },
        el('div', { class: 'bname' }, str(x.name)),
        el('div', { class: 'btag' }, str(x.tagline)),
        el('p', null, str(x.why)),
        el('p', { class: 'sub', style: 'margin:12px 0 0' }, `Tree order — ${pts} points at Lv ${str(input.value)}:`),
        el('ol', { class: 'steps' }, steps),
        el('p', { class: 'sub', style: 'margin:12px 0 0' }, 'Roll priority on gear (in order):'),
        el('ol', { class: 'rolls' }, arr(x.rolls).map(r => el('li', null,
          el('b', null, str(r.s)), r.top ? el('span', { class: 'badge top' }, 'biggest impact') : null,
          el('div', { class: 'why' }, str(r.why))))));
    }));
  }
  input.oninput = render;
  render();
  return [el('h2', null, 'Suggested builds'),
    el('div', { class: 'lvrow' }, 'Your level:', input, el('span', { class: 'sub', style: 'margin:0' }, '(1 point per 4 levels, +1)')),
    holder];
}

// Hidden route: #/advisor/<player> — scores each class's roll priorities against
// the player's actual gear mods and recommends what to play. No nav links to it.
const ROLL_KW = { 'Block': ['block'], 'Evasion': ['evasion'], 'Attack Speed': ['attack speed'],
  'Crit Chance': ['crit chance'], 'Increased Crit Dmg Dealt': ['crit dmg'], 'Increased Dmg Dealt': ['dmg dealt'],
  'Max HP': ['max hp'], 'Healing Power': ['healing power'], 'Splash': ['splash'], 'Intervene': ['intervene'],
  'Lingering Effect': ['lingering'], 'Leech': ['leech'], 'Reduced Dmg Taken': ['dmg taken reduction', 'reduced dmg'] };
const rankNum = (r) => +(String(r == null ? '' : r).match(/^\d+/) || [0])[0];
const OP_W = { high: 3, medium: 1.5, low: 0.5 }; // watchlist impact → advisor score weight

async function advisor(name) {
  // Owner-only (x-pod-owner header, like #/intel) — the advisor reads the
  // watchlist and bag data, both privileged.
  const watchR = await ownerFetch('api/watchlist');
  if (watchR.status === 403) return keyDenied();
  // Investigation findings steer the pick: an OP interaction this player's gear
  // already supports counts for more than one they would have to build toward.
  const watch = watchR.ok ? arr((await watchR.json()).interactions) : [];
  const [r, { builds, passives }, ratesR, gearR, core, model] = await Promise.all([
    fetch('api/build/' + encodeURIComponent(name)), staticData(), ownerFetch('api/affix-rates'),
    ownerFetch('api/advisor-gear/' + encodeURIComponent(name)),
    import('./advisor-core.mjs'), fetch('game-model.json').then(q => q.json())]);
  if (!r.ok || !builds) { view(el('p', { class: 'status' }, 'Player not found. ', el('a', { href: '#/' }, 'Ladder'))); return; }
  const b = await r.json();
  const bag = gearR.ok ? arr((await gearR.json()).bag) : [];
  const rates = ratesR.ok ? arr((await ratesR.json()).rates) : [];
  const rateOf = (kws) => { // exact affix name first, substring fallback
    for (const kw of kws) { const x = rates.find(q => str(q.affix) === kw); if (x) return +x.per_tier; }
    for (const kw of kws) { const x = rates.find(q => str(q.affix).includes(kw)); if (x) return +x.per_tier; }
    return 0;
  };
  // Worn mods weigh 1.0; bag mods 0.5 — owned potential, but not equipped.
  const worn = arr(b.equipped).flatMap(it => arr(it.mods).map(m => str(m && m.t).toLowerCase()))
    .concat(arr(b.equipped).flatMap(it => arr(it.implicits).map(i => str(i && i.t).toLowerCase())).filter(Boolean));
  const entries = worn.map(t => ({ t, w: 1 }))
    .concat(bag.flatMap(it => arr(it.mods).map(m => ({ t: str(m && m.t).toLowerCase(), w: 0.5 }))));
  const hit = (t, kws) => kws.some(kw => t.includes(kw)) && !(kws[0] === 'dmg dealt' && t.includes('crit dmg'));
  // A match's weight = its rolled value in "t100 average mod" units (a t100 avg
  // roll ≈ 1.0) × the worn/bag factor. Affixes with no rate data fall back to 0.5.
  // Capped stats (roll.sat, in %) stop scoring past saturation — the tree's
  // overflow channels are full there and extra copies barely pay.
  const matchWeight = (kws, sat) => { const rate = rateOf(kws);
    const es = entries.filter(e => hit(e.t, kws));
    const raw = es.reduce((s, e) => s + e.w * num(e.t.match(/[\d.]+/)?.[0]), 0);
    const v = sat ? Math.min(raw, sat) : raw;
    if (rate) return v / (rate * 100);
    // no rate data: 0.5 per match, scaled down past saturation
    return es.reduce((s, e) => s + e.w * 0.5, 0) * (raw > v ? v / raw : 1); };

  const lvl = num(b.level) || 1;
  // Empirical per-tier map for the model (covers a live balance-toml override);
  // "max hp" is skipped — the rates table mixes its flat and % variants.
  const empirical = {};
  for (const a of model.affixes) {
    if (a.match === 'max hp') continue;
    const q = rates.find(x => str(x.affix).includes(a.match));
    if (q) empirical[a.match] = +q.per_tier;
  }
  // Craftable base per slot: the highest-tier UNKRANGLED, non-unique item the
  // player owns for that slot (equipped or bag) — a krangled item is locked out
  // of every craft action, so plans must land on something craftable.
  const tnum = (it) => +str(it && it.tier).replace(/\D/g, '') || 0;
  const SLOT_KEYS = ['weapon', 'helm', 'body', 'gloves', 'boots'];
  const slotOf = (it) => SLOT_KEYS.find(k => str(it && it.slot).toLowerCase().includes(k));
  const basesBySlot = {};
  for (const it of arr(b.equipped).concat(bag)) {
    const k = slotOf(it);
    if (!k || it.krangled || it.unique) continue;
    if (!basesBySlot[k] || tnum(it) > tnum(basesBySlot[k])) basesBySlot[k] = it;
  }

  let role = null; // null = auto; 'dps' | 'tank' | 'healer'
  function render() {
    // Source-grounded scoring: evaluate each class's closed-form power
    // (game-model.json cites the PathofDust formulas) over the best loadout
    // pickable from this player's equipped+bag gear at their actual level,
    // under the 4-mods+Sacred / no-uniques ruleset. Normalized best=100;
    // the watchlist bonus (max +3 per high-impact interaction) breaks ties
    // toward classes with a known-strong line this gear already supports.
    const ranked = Object.entries(builds.classes)
      .filter(([cls]) => !role || rolesOf(cls, passives).includes(role))
      .map(([cls, cb]) => {
        const build = arr(cb.builds)[0];
        const loadout = core.bestLoadout(arr(b.equipped), bag, cls, lvl, model);
        const cs = core.classScore(cls, loadout.buckets, lvl, model);
        const ops = watch.filter(i => arr(i.classes).map(str).includes(cls));
        let bonus = 0;
        ops.forEach(i => {
          const w = arr(i.rolls).reduce((s, r) => s + matchWeight(ROLL_KW[r] || [str(r).toLowerCase()], 0), 0);
          bonus += (OP_W[str(i.impact)] || 0.5) * (arr(i.rolls).length ? Math.min(1, w) : 0.25);
        });
        return { cls, build, raw: cs.score, cs, loadout, bonus, ops };
      }).filter(x => x.build);
    const maxRaw = Math.max(1, ...ranked.map(x => x.raw));
    ranked.forEach(x => { x.score = Math.round((100 * x.raw / maxRaw + x.bonus) * 10) / 10; });
    ranked.sort((a, z) => z.score - a.score);
    const best = ranked[0];

    // Passive respec plan vs the pick's tree order, cut to the point budget
    const budget = 1 + Math.floor(lvl / 4);
    const alloc = new Map(arr(b.passives && b.passives.nodes).filter(n => rankNum(n.rank) > 0)
      .map(n => [str(n.name), rankNum(n.rank)]));
    const target = new Map(core.trimOrder(arr(best && best.build.order), budget).map(o => [str(o.n), +o.r]));
    const toGet = [...target].filter(([n, tr]) => (alloc.get(n) || 0) < tr).map(([n, tr]) => `${n} ${alloc.get(n) || 0}→${tr}`);
    const toDrop = [...alloc].filter(([n]) => !target.has(n)).map(([n, tr]) => `${n} ${tr}`);

    // Derived craft plan: per slot, the 4 crafted mods (+ one Sacred wish)
    // with the biggest marginal score gain at this player's best gear tier.
    // Per-slot plan tier: the tier of the item the crafting would actually
    // happen ON — the worn item if craftable, else the best unkrangled base
    // owned for that slot (mods roll at ITEM tier, so a global average lies).
    const wornBySlot = {};
    for (const it of arr(best ? best.loadout.items : [])) { const k = slotOf(it); if (k) wornBySlot[k] = it; }
    const craftBase = (k) => {
      const worn = wornBySlot[k];
      if (worn && !worn.krangled) return { it: worn, worn: true };
      return basesBySlot[k] ? { it: basesBySlot[k], worn: false } : null;
    };
    const planTiers = Object.fromEntries(SLOT_KEYS.map(k => {
      const cb = craftBase(k);
      return [k, cb ? tnum(cb.it) : (wornBySlot[k] ? tnum(wornBySlot[k]) : 1)];
    }));
    const targets = best ? core.rollTargets(best.cls, lvl, planTiers, model, best.loadout.buckets, empirical) : null;
    const fmtAvg = (p) => `+${fmt(p.avg * 100)}%`; // plan targets the % variants only

    // Per-item crafting advice against the derived plan. Krangled items are
    // LOCKED out of every craft action (CraftError::ItemLocked) — never
    // suggest crafting on one; point at the craftable base instead.
    const craftRows = arr(best ? best.loadout.items : []).map(it => {
      const slot = slotOf(it) || str(it.slot).toLowerCase();
      const tier = tnum(it);
      const plan = targets && targets.plan[slot] ? targets.plan[slot] : [];
      const junk = arr(it.mods).filter(m => m && m.t && !plan.some(p => str(m.t).toLowerCase().includes(p.match))).map(m => str(m.t));
      const base = basesBySlot[slot];
      const tips = it.krangled ? [
        `krangled (locked — no crafting possible)${base
          ? `: build the plan on your craftable ${str(base.slot)} base instead — ${str(base.name)} (t${tnum(base)}${base.sacred ? ', Sacred' : ''}, ${arr(base.mods).length} mods), swap in once it beats this one`
          : ': keep wearing it and craft the plan onto the next fresh drop for this slot'}`,
      ] : [
        junk.length && `swap off-build mods (${junk.join(', ')}): veiled Chancing rerolls every mod type with a pick per slot, or Annulment (veiled = choose which leaves) then re-Exalt`,
        arr(it.mods).length < 4 && `fill to 4 mods (${arr(it.mods).length} now): Transmute→Augment→Regal→Exalt, veiled (+500 dust) to pick from 3 rolls`,
        `Reforge to climb tiers (t${tier} now; +1/use above t100, 30×tier dust)`,
        !/perfect|sacred/i.test(str(it.quality)) && 'Polish (sand) — raises rolls toward max and quality to Perfect',
        !it.sacred && !/sacred/i.test(str(it.quality)) && 'upgrade to a Sacred base at stage 300+',
      ].filter(Boolean);
      return tips.length ? el('li', null, el('b', null, str(it.slot) || 'item'), ` (${str(it.name)}): ${tips.join(' · ')}`) : null;
    }).filter(Boolean);

    const roleChip = (rv, label) => {
      const e = el('span', { class: 'chip' + (role === rv ? ' on' : '') }, label);
      e.onclick = () => { role = rv; render(); };
      return e;
    };
    view(
      el('h1', null, 'Advisor'),
      el('p', { class: 'sub' }, `${str(b.name)} · ${str(b.archetype)} Lv ${str(b.level)} — full-loadout suggestions from live data.`),
      el('div', { class: 'chips', style: 'margin:0 0 14px' },
        'Role: ', roleChip(null, 'Auto'), roleChip('dps', '🗡️ DPS'), roleChip('tank', '🛡️ Tank'), roleChip('healer', '🩹 Healer')),
      !best ? el('p', { class: 'status' }, 'No builds for this role.') : el('div', { class: 'card' },
        el('div', { class: 'bname' }, `Play ${best.cls} — ${str(best.build.name)}`),
        el('div', { class: 'btag' }, `score ${best.score} · ≈${fmt(best.cs.dps)} dps · ≈${fmt(best.cs.ehp)} ehp · ${fmt(best.cs.interval)}ms cadence`
          + (best.loadout.buckets.unparsed ? ` · ${best.loadout.buckets.unparsed} unrecognized mod(s) ignored` : '')),
        el('p', null, str(best.build.why)),
        arr(best.loadout.swaps).length ? el('p', null, 'Equip from bag: ', arr(best.loadout.swaps).map(s =>
          `${str(s.use.name)} (${str(s.use.tier)}) over ${s.over ? str(s.over.name) : 'empty ' + s.slot}`).join(' · ')) : null,
        el('p', null, el('a', { href: '#/class/' + encodeURIComponent(best.cls) }, `Full ${best.cls} build + tree order →`))),
      best && arr(best.ops).length ? [
        el('h2', null, 'Known-strong interactions for this pick'),
        el('div', { class: 'stack' }, arr(best.ops).map(i => el('div', { class: 'card' },
          el('div', { class: 'bname' }, str(i.title)),
          el('div', { class: 'chips', style: 'margin:6px 0 0' },
            el('span', { class: 'chip' + (str(i.impact) === 'high' ? ' on' : '') }, str(i.impact) + ' impact'),
            i.type ? el('span', { class: 'chip' }, str(i.type)) : null,
            arr(i.rolls).map(r => el('span', { class: 'chip' }, str(r)))),
          el('p', null, str(i.text)))))] : null,
      best && ranked.length > 1 ? el('div', { class: 'chips', style: 'margin:10px 0 0' }, ranked.slice(1, 4).map(x =>
        el('a', { class: 'chip', href: '#/class/' + encodeURIComponent(x.cls) }, `${x.cls} · ${x.score}`))) : null,
      best ? [
        el('h2', null, 'Passives plan'),
        el('div', { class: 'card' },
          toGet.length ? [el('p', { class: 'sub', style: 'margin:0 0 6px' }, 'Allocate:'),
            el('div', { class: 'chips' }, toGet.map(t => el('span', { class: 'chip' }, t)))] : el('p', { style: 'margin:0' }, 'Tree already matches this build.'),
          toDrop.length ? [el('p', { class: 'sub', style: 'margin:12px 0 6px' }, 'Respec out (off-build):'),
            el('div', { class: 'chips' }, toDrop.map(t => el('span', { class: 'chip' }, t)))] : null),
        el('h2', null, 'Craft plan (4 mods + Sacred, no uniques)'),
        el('p', { class: 'sub' }, `Per slot: the 4 crafted mods with the biggest marginal gain for ${best.cls} at your level, valued at the tier of the item you'd actually craft on — the worn one, or your best unkrangled base when the worn item is locked. One Sacred wish across the set (ignores slot restrictions, may duplicate a crafted mod). Veiled crafts (+500 dust) roll 3 candidates and let you pick.`),
        el('table', null,
          el('thead', null, el('tr', null, el('th', null, 'Slot'), el('th', null, 'Craft on'), el('th', null, 'Craft these 4'), el('th', null, 'Sacred wish'))),
          el('tbody', null, Object.entries(targets.plan).map(([slot, picks]) => {
            const cb = craftBase(slot);
            return el('tr', null,
              el('td', null, slot),
              el('td', null, cb ? `${cb.worn ? 'worn' : 'bag'} t${tnum(cb.it)}${cb.worn ? '' : ' ' + str(cb.it.name)}` : 'next drop'),
              el('td', null, picks.map(p => `${p.match} ${fmtAvg(p)}`).join(' · ')),
              el('td', null, targets.sacred ? `${targets.sacred.match} ${fmtAvg(targets.sacred)}` : '—'));
          }))),
        craftRows.length ? [el('h2', null, 'Crafting worklist'),
          el('ul', { class: 'rolls' }, craftRows)] : null,
      ] : null);
  }
  render();
}

// Game-replica canvas: absolute node cards + connector lines at the game's own
// coordinates (scraped layout), rank dots filled to the suggested build's ranks
// (4th spec point gold, like the game).
function gameTree(layout, builds, archetype) {
  const cb = builds && builds.classes && builds.classes[archetype];
  const picks = new Map(arr(cb && cb.builds[0] && cb.builds[0].order).map(o => [str(o.n), +o.r]));
  const stage = el('div', { class: 'gstage', style: `width:${+layout.w || 1180}px;height:${+layout.h || 463}px` });
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', +layout.w || 1180); svg.setAttribute('height', +layout.h || 463);
  for (const e of arr(layout.edges)) {
    const l = document.createElementNS(svgNS, 'line');
    l.setAttribute('x1', +e.x1 || 0); l.setAttribute('y1', +e.y1 || 0);
    l.setAttribute('x2', +e.x2 || 0); l.setAttribute('y2', +e.y2 || 0);
    l.setAttribute('stroke', 'rgba(160,140,255,0.35)'); l.setAttribute('stroke-width', '2');
    svg.appendChild(l);
  }
  stage.appendChild(svg);
  for (const n of arr(layout.nodes)) {
    const take = picks.get(str(n.name)) || 0;
    const dead = !!n.dead;
    const gold = n.kind === 'spec' && take >= 4;
    const dots = [];
    for (let i = 0; i < (+n.max || 0); i++)
      dots.push(el('span', { class: 'gdot' + (i < take ? (n.kind === 'spec' && i === 3 ? ' gold' : ' on') : '') }));
    stage.appendChild(el('div', {
      class: `gnode kind-${str(n.kind)}${take ? ' pick' : ''}${gold ? ' gold' : ''}${dead ? ' dead' : ''}`,
      style: `left:${+n.x || 0}px;top:${+n.y || 0}px;width:${+n.w || 140}px`,
      title: str(n.desc),
    },
      n.kind === 'root' || n.kind === 'skill' ? el('div', { class: 'gkind' }, n.kind === 'root' ? 'Class passive' : 'Skill') : null,
      el('div', { class: 'gname' }, str(n.name) || str(archetype).toUpperCase()),
      dots.length ? el('div', { class: 'gdots' }, dots) : null));
  }
  return el('div', { class: 'gwrap' }, stage);
}

function treeSection(archetype, passives, builds, layout) {
  if (layout && arr(layout.nodes).length) {
    // The scraped page only shows modifiers its owner has revealed (spec 4/4) —
    // list the rest from the wiki below the canvas rather than faking positions.
    const have = new Set(arr(layout.nodes).map(n => str(n.name)));
    const t = passives && passives[archetype];
    const cb = builds && builds.classes && builds.classes[archetype];
    const picks = new Map(arr(cb && cb.builds[0] && cb.builds[0].order).map(o => [str(o.n), +o.r]));
    const hidden = [];
    for (const s of arr(t && t.skills)) for (const sp of arr(s.specializations)) {
      const miss = arr(sp.modifiers).filter(m => !have.has(str(m.name)));
      if (miss.length) hidden.push(el('div', null, el('b', null, str(sp.name)), ': ',
        el('span', { class: 'chips', style: 'display:inline-flex' }, miss.map(m =>
          el('span', { class: 'chip' + (picks.has(str(m.name)) ? ' on' : ''), title: str(m.text) },
            str(m.name), ' ', str(m.max), picks.has(str(m.name)) ? ' · take ' + picks.get(str(m.name)) : '')))));
    }
    return [el('h2', null, 'Passive tree'),
      el('p', { class: 'sub' }, 'The game\'s own tree layout — filled dots are the suggested build (gold = the specializing 4th point), dashed nodes are inactive. Hover a node for its effect.'),
      gameTree(layout, builds, archetype),
      hidden.length ? [el('p', { class: 'sub', style: 'margin-top:12px' },
        'Modifiers absent from this saved layout (from the wiki — hover for effects, highlighted = in the suggested build):'),
        el('div', { class: 'stack', style: 'gap:4px' }, hidden)] : null];
  }
  const t = passives && passives[archetype];
  if (!t) return null;
  // Highlight the suggested build's allocations on the tree itself.
  const cb = builds && builds.classes && builds.classes[archetype];
  const picks = new Map(arr(cb && cb.builds[0] && cb.builds[0].order).map(o => [str(o.n), +o.r]));
  const node = (n, cls) => {
    const dead = /\(inactive\)\s*$/.test(str(n.text));
    const pick = picks.get(str(n.name));
    return el('div', { class: `tnode ${cls}${pick ? ' pick' : ''}${dead ? ' dead' : ''}`, title: str(n.text) },
      el('b', null, str(n.name)), el('span', { class: 'max' }, str(n.max)),
      pick ? el('span', { class: 'take' }, `take ${pick}`) : null, dead ? el('span', { class: 'max' }, 'inactive') : null);
  };
  return [el('h2', null, 'Full passive tree'),
    el('p', { class: 'sub' }, str(t.root) + ' — highlighted nodes are the suggested build; hover any node for its effect.'),
    el('div', { class: 'stack' }, arr(t.skills).map(s => el('div', { class: 'card tskill' },
      node(s, 'skill'),
      el('div', { class: 'tspecs' }, arr(s.specializations).map(sp => el('div', { class: 'tcol' },
        node(sp, 'spec'),
        arr(sp.modifiers).map(m => node(m, 'mod'))))))))];
}

async function classView(archetype) {
  const [r, { builds, passives }, layoutR] = await Promise.all([
    fetch('api/class/' + encodeURIComponent(archetype)), staticData(),
    fetch('api/tree/' + encodeURIComponent(archetype))]);
  const layout = layoutR.ok ? await layoutR.json() : null;
  const known = (passives && passives[archetype]) || (builds && builds.classes && builds.classes[archetype]);
  if (r.status === 404 && !known) { view(el('p', { class: 'status' }, 'Unknown class. ', el('a', { href: '#/' }, 'Back to ladder'))); return; }
  if (!r.ok && r.status !== 404) throw new Error('class ' + r.status);
  const c = r.ok ? await r.json() : null;
  const role = passives && passives[archetype] && passives[archetype].role;
  const pct = (n) => Math.round(100 * n / c.players) + '%';
  view(
    el('p', null, el('a', { href: '#/' }, '← Ladder')),
    el('h1', null, str(archetype)),
    el('p', { class: 'sub' }, c
      ? `${role ? str(role) + ' · ' : ''}what ${c.players} tracked player${c.players === 1 ? '' : 's'} run · avg Lv ${str(c.avg_level)} · best Lv ${str(c.max_level)}`
      : `${role ? str(role) + ' · ' : ''}no tracked players yet`),
    buildCards(archetype, builds),
    treeSection(archetype, passives, builds, layout),
    c && arr(c.passives).length ? [el('h2', null, 'Popular passives'),
      el('div', { class: 'card' }, barChart(arr(c.passives).map(p => ({
        label: str(p.name) + (p.tier != null ? ` (T${str(p.tier)})` : ''),
        count: p.players,
        num: pct(p.players) + (p.avg_rank != null ? ` · rank ${str(p.avg_rank)}` : ''),
      })), 'var(--series-1)'))] : null,
    c && arr(c.mods).length ? [el('h2', null, 'Popular gear mods'),
      el('div', { class: 'card' }, barChart(arr(c.mods).map(m => ({
        label: m.mod, count: m.players, num: pct(m.players),
      })), 'var(--series-2)'))] : null,
    null); // item names are flavor text — no per-slot section
}

async function route() {
  // Capture ?key=… / ?owner=… from the hash once, remember them, strip from the URL.
  // Parsed by hand rather than with URLSearchParams: that applies form-encoding
  // rules and would turn a '+' inside a key into a space.
  const km = location.hash.match(/^(.*?)\?(.+)$/);
  if (km) {
    const param = (n) => {
      const m = km[2].match(new RegExp('(?:^|&)' + n + '=([^&]*)'));
      return m ? decodeURIComponent(m[1]) : '';
    };
    const key = param('key'), owner = param('owner');
    if (key) localStorage.setItem('pod.key', key);
    if (owner) localStorage.setItem('pod.owner', owner);
    if (key || owner) { location.replace(location.pathname + km[1]); return; }
  }
  const solo = { '#/admin': admin, '#/watchlist': watchlist, '#/feedback': feedbackView, '#/intel': intel }[location.hash];
  if (solo) {
    // view() adds the nav; a thrown page never called it, so add it here too.
    try { await solo(); } catch (e) {
      app.replaceChildren(el('p', { class: 'status' }, 'Failed to load — try again shortly.'));
      app.prepend(adminNav());
    }
    window.scrollTo(0, 0); renderFoot(); checkFeedback(); return;
  }
  const m = location.hash.match(/^#\/(build|class|advisor)\/(.+)$/);
  try { m ? await ({ build, class: classView, advisor })[m[1]](decodeURIComponent(m[2])) : await ladder(); }
  catch (e) { app.replaceChildren(el('p', { class: 'status' }, 'Failed to load — try again shortly.')); }
  window.scrollTo(0, 0);
  renderFoot();
  checkFeedback();
}
addEventListener('hashchange', route);
route();
setInterval(checkFeedback, 120e3);
</script>
