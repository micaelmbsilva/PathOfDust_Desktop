  render();
}

// Deterministic game-style tree from passive-tree.json (no scraped coords, so it
// works for every class incl. Elementalist). Lays out root → skills → specs →
// mods (each spec spans its mods, each skill its specs), fills each node's dots to
// the RECOMMENDED rank (red; a spec's 4th point gold, like the game), and borders
// each node by the respec vs the player's current ranks (green = add, dashed red
// = drop). Unscored specials (reflects/procs) are dimmed + tagged. Read-only.
function treeGraph(cls, nodes, alloc, currentByKey, core) {
  const kids = (k) => arr(nodes).filter(n => n.parent === k);
  const skills = arr(nodes).filter(n => !n.parent);
  // 27 mod-columns wide for a full class — keep nodes compact so the whole tree
  // is a couple of screens of horizontal scroll, not ten (the game is wide too).
  const COL = 92, NODEW = 80;
  const rowY = { root: 44, skill: 150, spec: 292, mod: 438 };
  const pos = {};
  let col = 0;
  for (const sk of skills) {
    const specs = kids(sk.key), scols = [];
    for (const sp of specs) {
      const mods = kids(sp.key);
      if (!mods.length) { pos[sp.key] = { col: col++, y: rowY.spec }; }
      else {
        const start = col;
        for (const md of mods) pos[md.key] = { col: col++, y: rowY.mod };
        pos[sp.key] = { col: (start + col - 1) / 2, y: rowY.spec };
      }
      scols.push(pos[sp.key].col);
    }
    pos[sk.key] = { col: specs.length ? (Math.min(...scols) + Math.max(...scols)) / 2 : col++, y: rowY.skill };
  }
  const cols = Object.values(pos).map(p => p.col);
  const rootCol = cols.length ? (Math.min(...cols) + Math.max(...cols)) / 2 : 0;
  const X = (c) => c * COL + COL / 2;
  const stageW = Math.max(COL, col * COL), stageH = rowY.mod + 70;
  const rank = (k) => alloc[k] || 0;

  const stage = el('div', { class: 'gstage', style: `width:${stageW}px;height:${stageH}px` });
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', stageW); svg.setAttribute('height', stageH);
  const line = (x1, y1, x2, y2, on) => { const l = document.createElementNS(svgNS, 'line');
    l.setAttribute('x1', x1); l.setAttribute('y1', y1); l.setAttribute('x2', x2); l.setAttribute('y2', y2);
    l.setAttribute('stroke', on ? 'rgba(255,59,78,0.45)' : 'rgba(160,140,255,0.22)');
    l.setAttribute('stroke-width', on ? 2.5 : 1.5); svg.appendChild(l); };
  for (const sk of skills) line(X(rootCol), rowY.root, X(pos[sk.key].col), rowY.skill, rank(sk.key));
  for (const n of nodes) for (const c of kids(n.key)) if (pos[n.key] && pos[c.key])
    line(X(pos[n.key].col), pos[n.key].y, X(pos[c.key].col), pos[c.key].y, rank(n.key) && rank(c.key));
  stage.appendChild(svg);

  stage.appendChild(el('div', { class: 'gnode kind-root', style: `left:${X(rootCol)}px;top:${rowY.root}px;width:150px` },
    el('div', { class: 'gkind' }, 'Class passive'), el('div', { class: 'gname' }, str(cls).toUpperCase())));
  for (const n of nodes) {
    const p = pos[n.key]; if (!p) continue;
    const r = rank(n.key), cur = currentByKey.get(n.key) || 0, isSpec = n.tier === 'spec';
    const dots = [];
    for (let i = 0; i < (n.max || 0); i++)
      dots.push(el('span', { class: 'gdot' + (i < r ? (isSpec && i === 3 ? ' gold' : ' on') : '') }));
    const unscored = !core.nodeScored(n);
    const state = r > cur ? ' get' : r < cur ? ' drop' : '';
    stage.appendChild(el('div', {
      class: `gnode kind-${n.tier}${r ? ' pick' : ''}${isSpec && r >= 4 ? ' gold' : ''}${state}${unscored ? ' unscored' : ''}`,
      style: `left:${X(p.col)}px;top:${p.y}px;width:${NODEW}px`,
      title: `${str(n.name)} — ${str(n.description)}${unscored ? '  ·  in-fight effect, not scored by the advisor' : ''}`,
    },
      el('div', { class: 'gname' }, str(n.name)),
      dots.length ? el('div', { class: 'gdots' }, dots) : null,
      unscored ? el('div', { class: 'gtag' }, 'not scored') : null));
  }
  return el('div', { class: 'gwrap' }, stage);
}

// Game-replica canvas: absolute node cards + connector lines at the game's own
// coordinates (scraped layout), rank dots filled to the suggested build's ranks
// (4th spec point gold, like the game).
function gameTree(layout, builds, archetype) {
  const cb = builds && builds.classes && builds.classes[archetype];
  const picks = new Map(arr(cb && cb.builds[0] && cb.builds[0].order).map(o => [str(o.n), +o.r]));
  const stage = el('div', { class: 'gstage', style: `width:${+layout.w || 1180}px;height:${+layout.h || 463}px` });
  const svgNS = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(svgNS, 'svg');
  svg.setAttribute('width', +layout.w || 1180); svg.setAttribute('height', +layout.h || 463);
  for (const e of arr(layout.edges)) {
    const l = document.createElementNS(svgNS, 'line');
    l.setAttribute('x1', +e.x1 || 0); l.setAttribute('y1', +e.y1 || 0);
    l.setAttribute('x2', +e.x2 || 0); l.setAttribute('y2', +e.y2 || 0);
    l.setAttribute('stroke', 'rgba(160,140,255,0.35)'); l.setAttribute('stroke-width', '2');
    svg.appendChild(l);
  }
  stage.appendChild(svg);
  for (const n of arr(layout.nodes)) {
    const take = picks.get(str(n.name)) || 0;
    const dead = !!n.dead;
    const gold = n.kind === 'spec' && take >= 4;
    const dots = [];
    for (let i = 0; i < (+n.max || 0); i++)
      dots.push(el('span', { class: 'gdot' + (i < take ? (n.kind === 'spec' && i === 3 ? ' gold' : ' on') : '') }));
    stage.appendChild(el('div', {
      class: `gnode kind-${str(n.kind)}${take ? ' pick' : ''}${gold ? ' gold' : ''}${dead ? ' dead' : ''}`,
      style: `left:${+n.x || 0}px;top:${+n.y || 0}px;width:${+n.w || 140}px`,
      title: str(n.desc),
    },
      n.kind === 'root' || n.kind === 'skill' ? el('div', { class: 'gkind' }, n.kind === 'root' ? 'Class passive' : 'Skill') : null,
      el('div', { class: 'gname' }, str(n.name) || str(archetype).toUpperCase()),
      dots.length ? el('div', { class: 'gdots' }, dots) : null));
  }
  return el('div', { class: 'gwrap' }, stage);
}

function treeSection(archetype, passives, builds, layout) {
  if (layout && arr(layout.nodes).length) {
    // The scraped page only shows modifiers its owner has revealed (spec 4/4) —
    // list the rest from the wiki below the canvas rather than faking positions.
    const have = new Set(arr(layout.nodes).map(n => str(n.name)));
    const t = passives && passives[archetype];
    const cb = builds && builds.classes && builds.classes[archetype];
    const picks = new Map(arr(cb && cb.builds[0] && cb.builds[0].order).map(o => [str(o.n), +o.r]));
    const hidden = [];
    for (const s of arr(t && t.skills)) for (const sp of arr(s.specializations)) {
      const miss = arr(sp.modifiers).filter(m => !have.has(str(m.name)));
      if (miss.length) hidden.push(el('div', null, el('b', null, str(sp.name)), ': ',
        el('span', { class: 'chips', style: 'display:inline-flex' }, miss.map(m =>
          el('span', { class: 'chip' + (picks.has(str(m.name)) ? ' on' : ''), title: str(m.text) },
            str(m.name), ' ', str(m.max), picks.has(str(m.name)) ? ' · take ' + picks.get(str(m.name)) : '')))));
    }
    return [el('h2', null, 'Passive tree'),
      el('p', { class: 'sub' }, 'The game\'s own tree layout — filled dots are the suggested build (gold = the specializing 4th point), dashed nodes are inactive. Hover a node for its effect.'),
      gameTree(layout, builds, archetype),
      hidden.length ? [el('p', { class: 'sub', style: 'margin-top:12px' },
        'Modifiers absent from this saved layout (from the wiki — hover for effects, highlighted = in the suggested build):'),
        el('div', { class: 'stack', style: 'gap:4px' }, hidden)] : null];
  }
  const t = passives && passives[archetype];
  if (!t) return null;
  // Highlight the suggested build's allocations on the tree itself.
  const cb = builds && builds.classes && builds.classes[archetype];
  const picks = new Map(arr(cb && cb.builds[0] && cb.builds[0].order).map(o => [str(o.n), +o.r]));
  const node = (n, cls) => {
    const dead = /\(inactive\)\s*$/.test(str(n.text));
    const pick = picks.get(str(n.name));
    return el('div', { class: `tnode ${cls}${pick ? ' pick' : ''}${dead ? ' dead' : ''}`, title: str(n.text) },
      el('b', null, str(n.name)), el('span', { class: 'max' }, str(n.max)),
      pick ? el('span', { class: 'take' }, `take ${pick}`) : null, dead ? el('span', { class: 'max' }, 'inactive') : null);
  };
  return [el('h2', null, 'Full passive tree'),
    el('p', { class: 'sub' }, str(t.root) + ' — highlighted nodes are the suggested build; hover any node for its effect.'),
    el('div', { class: 'stack' }, arr(t.skills).map(s => el('div', { class: 'card tskill' },
      node(s, 'skill'),
      el('div', { class: 'tspecs' }, arr(s.specializations).map(sp => el('div', { class: 'tcol' },
        node(sp, 'spec'),
        arr(sp.modifiers).map(m => node(m, 'mod'))))))))];
}

async function classView(archetype) {
  const [r, { builds, passives }, layoutR] = await Promise.all([
    fetch('api/class/' + encodeURIComponent(archetype)), staticData(),
    fetch('api/tree/' + encodeURIComponent(archetype))]);
  const layout = layoutR.ok ? await layoutR.json() : null;
  const known = (passives && passives[archetype]) || (builds && builds.classes && builds.classes[archetype]);
  if (r.status === 404 && !known) { view(el('p', { class: 'status' }, 'Unknown class. ', el('a', { href: '#/' }, 'Back to ladder'))); return; }
  if (!r.ok && r.status !== 404) throw new Error('class ' + r.status);
  const c = r.ok ? await r.json() : null;
  const role = passives && passives[archetype] && passives[archetype].role;
  const pct = (n) => Math.round(100 * n / c.players) + '%';
  view(
    el('p', null, el('a', { href: '#/' }, '← Ladder')),
    el('h1', null, str(archetype)),
    el('p', { class: 'sub' }, c
      ? `${role ? str(role) + ' · ' : ''}${c.players} tracked player${c.players === 1 ? '' : 's'}${c.total ? ` · ${Math.round(100 * c.players / c.total)}% of the ${c.total} on the ladder` : ''} · avg Lv ${str(c.avg_level)} · best Lv ${str(c.max_level)}`
      : `${role ? str(role) + ' · ' : ''}no tracked players yet`),
    buildCards(archetype, builds),
    treeSection(archetype, passives, builds, layout),
    c && arr(c.passives).length ? [el('h2', null, 'Popular passives'),
      el('div', { class: 'card' }, barChart(arr(c.passives).map(p => ({
        label: str(p.name) + (p.tier != null ? ` (T${str(p.tier)})` : ''),
        count: p.players,
        num: pct(p.players) + (p.avg_rank != null ? ` · rank ${str(p.avg_rank)}` : ''),
      })), 'var(--series-1)'))] : null,
    c && arr(c.mods).length ? [el('h2', null, 'Popular gear mods'),
      el('div', { class: 'card' }, barChart(arr(c.mods).map(m => ({
        label: m.mod, count: m.players, num: pct(m.players),
      })), 'var(--series-2)'))] : null,
    null); // item names are flavor text — no per-slot section
}

// Public route: #/explorer — class-FIRST build search. Pick a class + level +
// tier + objective + required/banned affixes; searchBuild returns the best
// reachable build under the modeled ruleset. Pure model+tree math, no player
// data, so no owner gate. Same engine tools/best-builds.mjs runs in batch.
async function explorer() {
  const [core, model, ptree] = await Promise.all([
    import('./advisor-core.mjs'),
    fetch('game-model.json').then(r => r.json()),
    fetch('passive-tree.json').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);
  if (!ptree || !ptree.classes) { view(el('h1', null, 'Build explorer'), el('p', { class: 'status' }, 'Passive tree data unavailable.')); return; }
  const classes = Object.keys(model.archetypes).filter(c => arr(ptree.classes[c]).length);
  const OBJ = { overall: s => s.score, damage: s => s.dps, tank: s => s.ehp, healing: s => s.hps };
  const affixes = model.affixes.map(a => a.match);
  const nodeName = (cls, key) => (arr(ptree.classes[cls]).find(n => n.key === key) || {}).name || key;
  const pct = x => (x * 100).toFixed(1) + '%';
  const sci = x => Number(x).toExponential(2);

  const st = { cls: classes[0], level: 119, tier: 119, obj: 'overall', require: new Set(), ban: new Set() };
  const lvl = x => { const n = Math.floor(+x); return n >= 1 ? n : 1; }; // model wants integer ≥ 1

  function render() {
    const nodes = ptree.classes[st.cls];
    const r = core.searchBuild(st.cls, nodes, lvl(st.level), lvl(st.tier), model,
      { objective: OBJ[st.obj], require: [...st.require], ban: [...st.ban] });
    const s = r.score, d = s.detail;

    const sel = el('select');
    classes.forEach(c => sel.append(el('option', { value: c }, c)));
    sel.value = st.cls; sel.onchange = () => { st.cls = sel.value; render(); };
    // onchange (fires on blur/Enter), not oninput: render() rebuilds the whole
    // view, so a per-keystroke rebuild would steal focus mid-type and re-run the
    // full gear+tree search on every digit.
    const numIn = (val, set) => { const i = el('input', { type: 'number', min: '1', value: val, style: 'width:5em' }); i.onchange = () => { set(i.value); render(); }; return i; };
    const objChip = (k) => { const e = el('span', { class: 'chip' + (st.obj === k ? ' on' : '') }, k); e.onclick = () => { st.obj = k; render(); }; return e; };
    // One affix chip toggles its own set; requiring clears a ban and vice-versa
    // (an affix can't be both forced in and forbidden).
    const affChip = (a, set, other) => { const e = el('span', { class: 'chip' + (set.has(a) ? ' on' : '') }, a);
      e.onclick = () => { if (set.has(a)) set.delete(a); else { set.add(a); other.delete(a); } render(); }; return e; };

    const stat = (label, val) => el('div', null, el('span', { class: 'sub', style: 'display:block;font-size:11px' }, label), el('b', null, val));
    const gearRows = ['weapon', 'helm', 'body', 'gloves', 'boots'].map(k =>
      el('li', null, el('b', null, k), ': ', arr(r.gear.picks[k]).length ? r.gear.picks[k].join(', ') : el('span', { class: 'sub' }, '(base only)')));
    const treeEntries = Object.entries(r.alloc).filter(([, v]) => v > 0)
      .map(([k, v]) => `${nodeName(st.cls, k)} ${v}`);
    const dropped = r.dropped || []; // required affixes that couldn't be placed (slot cap / elemental contention)

    view(
      el('h1', null, 'Build explorer'),
      el('p', { class: 'sub' }, 'Best reachable build for a chosen class under the modeled ruleset (5 Perfect items · 4 crafted mods + 1 Sacred · no uniques/krangle). Pure formula math — treat per-fight mechanics as upside.'),
      el('div', { class: 'chips', style: 'align-items:center;gap:10px;margin:0 0 12px' },
        el('span', null, 'Class '), sel,
        el('span', null, ' Level '), numIn(st.level, v => st.level = v),
        el('span', null, ' Tier '), numIn(st.tier, v => st.tier = v)),
      el('div', { class: 'chips', style: 'margin:0 0 10px' }, el('span', { class: 'sub' }, 'Objective:'), Object.keys(OBJ).map(objChip)),
      el('div', { class: 'chips', style: 'margin:0 0 6px' }, el('span', { class: 'sub' }, 'Require:'), affixes.map(a => affChip(a, st.require, st.ban))),
      el('div', { class: 'chips', style: 'margin:0 0 12px' }, el('span', { class: 'sub' }, 'Ban:'), affixes.map(a => affChip(a, st.ban, st.require))),
      dropped.length ? el('p', { class: 'status' }, `Couldn't fit ${dropped.length} required affix${dropped.length > 1 ? 'es' : ''}: ${dropped.join(', ')}. Ban fewer, or free up weapon/helm for elemental affixes.`) : null,
      el('div', { class: 'card' },
        el('h2', { style: 'margin-top:0' }, `${st.cls} · best ${st.obj}`),
        el('div', { style: 'display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px' },
          stat('DPS', sci(s.dps)), stat('HPS', sci(s.hps)), stat('eHP', sci(s.ehp)), stat('HP', sci(s.hp)),
          stat('Inc dmg', pct(d.inc)), stat('Crit ch', s.detail.cc.toFixed(1)), stat('Crit mult', s.detail.cm.toFixed(1)),
          stat('DR/Blk/Eva', `${pct(d.eff.dr)} / ${pct(d.eff.block)} / ${pct(d.eff.evasion)}`),
          stat('Heal', pct(s.healPower)), stat('Interval', `${s.interval.toFixed(0)}ms`))),
      el('div', { class: 'grid2' },
        el('div', { class: 'card' }, el('h2', { style: 'margin-top:0' }, 'Gear'),
          el('ul', null, gearRows),
          el('p', null, el('b', null, 'Sacred: '), r.gear.sacred || '—')),
        el('div', { class: 'card' }, el('h2', { style: 'margin-top:0' }, `Passives (${treeEntries.length} nodes)`),
          treeEntries.length ? el('ul', null, treeEntries.map(t => el('li', null, t))) : el('p', { class: 'sub' }, 'No nodes allocated.'))),
      el('p', { class: 'sub', style: 'margin-top:14px' }, core.UNMODELED_NOTE),
      el('p', null, el('a', { href: '#/' }, '← Ladder')));
  }
  render();
}

async function route() {
  // Capture ?key=… / ?owner=… from the hash once, remember them, strip from the URL.
  // Parsed by hand rather than with URLSearchParams: that applies form-encoding
  // rules and would turn a '+' inside a key into a space.
  const km = location.hash.match(/^(.*?)\?(.+)$/);
  if (km) {
    const param = (n) => {
      const m = km[2].match(new RegExp('(?:^|&)' + n + '=([^&]*)'));
      return m ? decodeURIComponent(m[1]) : '';
    };
    const key = param('key'), owner = param('owner');
    if (key) localStorage.setItem('pod.key', key);
    if (owner) localStorage.setItem('pod.owner', owner);
    if (key || owner) { location.replace(location.pathname + km[1]); return; }
  }
  const solo = { '#/admin': admin, '#/watchlist': watchlist, '#/feedback': feedbackView, '#/intel': intel, '#/explorer': explorer }[location.hash];
  if (solo) {
    // view() adds the nav; a thrown page never called it, so add it here too.
    try { await solo(); } catch (e) {
      app.replaceChildren(el('p', { class: 'status' }, 'Failed to load — try again shortly.'));
      app.prepend(adminNav());
    }
    window.scrollTo(0, 0); renderFoot(); checkFeedback(); return;
  }
  const m = location.hash.match(/^#\/(build|class|advisor)\/(.+)$/);
  try { m ? await ({ build, class: classView, advisor })[m[1]](decodeURIComponent(m[2])) : await ladder(); }
  catch (e) { app.replaceChildren(el('p', { class: 'status' }, 'Failed to load — try again shortly.')); }
  window.scrollTo(0, 0);
  renderFoot();
  checkFeedback();
}
addEventListener('hashchange', route);
route();
setInterval(checkFeedback, 120e3);
</script>
