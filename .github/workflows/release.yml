name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      - name: Ensure Electron binary
        run: node node_modules/electron/install.js

      - name: Package app
        run: npm run dist

      - name: Zip build
        shell: pwsh
        run: Compress-Archive -Path dist/LokatiOverlay-win32-x64 -DestinationPath PathOfDust.zip -Force

      - name: Publish "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Path of Dust — Desktop (latest)
          body: |
            **Path of Dust — Desktop** · companion app for the Twitch RPG *Path of Dust* by
            [Lokati_Gaming](https://www.twitch.tv/lokati_gaming).

            Live game overlay, character stats, and the full bag / crafting / passives dashboard —
            plus in-app Twitch chat with 7TV emotes — all driven by your own Twitch login.

            ### Install
            1. Download **`PathOfDust.zip`** below.
            2. Extract it anywhere.
            3. Run **`LokatiOverlay.exe`** and log in with Twitch on first launch.

            *(SmartScreen may warn on an unsigned app → More info → Run anyway.)*

            The app **self-updates** its interface from the repo on launch — you only re-download
            here when the app shell itself changes.

            See the [README](https://github.com/micaelmbsilva/PathOfDust_Desktop#readme) for the full guide.
          files: PathOfDust.zip
