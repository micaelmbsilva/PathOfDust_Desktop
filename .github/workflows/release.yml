name: Release

# Installer releases fire on a version tag only. Day-to-day web/bridge changes
# hot-update straight from main (see resolveAppDir in main.cjs) and need no build.
# To ship a shell/app update: bump package.json "version", commit, then
#   git tag v<version> && git push origin main --tags
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Gate every publish on the versions agreeing. electron-builder names the
  # release from package.json, NOT from the tag, so a tag pushed at a commit
  # whose package.json says something else quietly uploads its artifacts into
  # the other version's release — which is exactly what v32.3.0 did, landing in
  # the v32.2.0 release and leaving no 32.3.0 at all. Both publish jobs need
  # this, so nothing is built or uploaded until it passes.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tag matches package.json and package-lock.json
        run: node .github/check-versions.mjs "${{ github.ref_name }}"

      - name: Interface manifest is coherent
        run: node .github/check-manifest.mjs

      # npm test, so package.json's list is the only list — a hand-copy here
      # let a new test file silently skip CI. Tests use only node built-ins,
      # so no install step is needed.
      - name: Tests
        run: npm test

  build:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      # electron-builder builds the NSIS installer and publishes it to a GitHub
      # release tagged v{package.json version}, alongside latest.yml + blockmap —
      # the feed electron-updater reads. CSC discovery is off: the app is unsigned
      # (avoids the winCodeSign download that fails to extract on Windows).
      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

  build-mac:
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm ci

      # dmg (installer) + zip (electron-updater feed) for x64 and arm64.
      # Unsigned: users must right-click > Open on first launch, and the mac
      # auto-updater won't install shell updates (web content still hot-updates
      # from main via resolveAppDir).
      - name: Build and publish
        run: npm run release:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
